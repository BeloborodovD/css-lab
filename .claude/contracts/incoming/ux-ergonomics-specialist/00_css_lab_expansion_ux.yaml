# Contract: CSS Lab Library Expansion - UX Specifications
# Task ID: css-lab-expansion-ux
# Created: 2025-11-23
# Agent: ux-ergonomics-specialist

contract_id: "css-lab-expansion-ux-001"
task_type: "ux_specification"
priority: "high"

# Контекст проекта
context:
  project: "CSS Lab - Style Library"
  location: "d:\\_claude_project\\css-lab"
  existing_components: 20+
  target: "Расширить библиотеку новыми компонентами с продуманной UX"

# Задание
task:
  title: "UX-спецификации для новых компонентов CSS Lab"
  description: |
    Проработать UX для новых компонентов библиотеки.
    Определить user flows, interaction patterns, accessibility requirements.

# Новые компоненты для UX проработки
components_to_design:
  # Форм-элементы
  - name: "File Upload"
    ux_requirements:
      - "Drag & drop зона"
      - "Progress индикатор"
      - "Preview загруженных файлов"
      - "Валидация типа/размера файла"
      - "Accessible для keyboard users"
    states:
      - idle
      - dragover
      - uploading
      - success
      - error

  - name: "Rich Select / Combobox"
    ux_requirements:
      - "Поиск по опциям"
      - "Мультиселект"
      - "Группировка опций"
      - "Keyboard navigation (arrow, enter, escape)"
      - "ARIA roles: listbox, option"
    states:
      - closed
      - open
      - searching
      - selected
      - disabled

  - name: "Date Picker"
    ux_requirements:
      - "Calendar view"
      - "Keyboard navigation по датам"
      - "Range selection"
      - "Min/max date ограничения"
      - "Локализация (RU)"
    states:
      - closed
      - open
      - selecting
      - range_start
      - range_end

  - name: "Time Picker"
    ux_requirements:
      - "Часы:Минуты формат"
      - "24h или AM/PM"
      - "Step intervals (15 min)"
      - "Keyboard input"

  # Навигация
  - name: "Command Palette / Spotlight"
    ux_requirements:
      - "Быстрый доступ Cmd+K"
      - "Fuzzy search"
      - "Категории команд"
      - "Recent/frequent actions"
      - "Keyboard-first design"
    interaction:
      trigger: "Cmd+K or click"
      flow: "Open → Type → Filter → Select → Execute"

  - name: "Mega Menu"
    ux_requirements:
      - "Multi-column layout"
      - "Категории с иконками"
      - "Delayed open (150ms)"
      - "Stay open on hover"
      - "Mobile: accordion fallback"

  # Feedback
  - name: "Notification Center"
    ux_requirements:
      - "Badge с количеством"
      - "Dropdown со списком"
      - "Read/unread статусы"
      - "Mark all as read"
      - "Persist across sessions"

  - name: "Skeleton Loader"
    ux_requirements:
      - "Match content layout"
      - "Shimmer animation"
      - "Reduced motion: static gray"
      - "Semantic: aria-busy"

  # Data Display
  - name: "Data Grid / Virtual List"
    ux_requirements:
      - "Виртуализация для 10K+ rows"
      - "Сортировка по колонкам"
      - "Фильтрация"
      - "Column resize"
      - "Row selection"
      - "Keyboard navigation"

  - name: "Chart Components"
    ux_requirements:
      - "Accessible chart data (table fallback)"
      - "Tooltip on hover"
      - "Legend with toggle"
      - "Responsive resize"

  - name: "Avatar / Avatar Group"
    ux_requirements:
      - "Initials fallback"
      - "Status indicator (online/offline)"
      - "Stacked avatars (+N)"
      - "Sizes: xs, sm, md, lg, xl"

  - name: "Empty State"
    ux_requirements:
      - "Illustration + text"
      - "Call-to-action кнопка"
      - "Context-aware messaging"

# Accessibility требования (WCAG 2.1 AA)
accessibility:
  keyboard:
    - "All interactive elements focusable"
    - "Visible focus indicators"
    - "Logical tab order"
    - "Escape to close modals/dropdowns"
  screen_reader:
    - "ARIA labels for all controls"
    - "Live regions for dynamic content"
    - "Announcements for state changes"
  motion:
    - "prefers-reduced-motion respected"
    - "No autoplay animations"
  color:
    - "4.5:1 contrast ratio (text)"
    - "3:1 contrast ratio (UI elements)"
    - "No color-only information"

# Output specifications
output:
  format: "YAML"
  files:
    - "contracts/ux-specs/file-upload-ux.yaml"
    - "contracts/ux-specs/rich-select-ux.yaml"
    - "contracts/ux-specs/date-picker-ux.yaml"
    - "contracts/ux-specs/command-palette-ux.yaml"
    - "contracts/ux-specs/notification-center-ux.yaml"
    - "contracts/ux-specs/data-grid-ux.yaml"
    - "contracts/ux-specs/avatar-ux.yaml"
    - "contracts/ux-specs/empty-state-ux.yaml"

# Handoff
handoff:
  next_agent: "css-design-specialist"
  reason: "После UX specs → CSS implementation"
  input: "UX specification YAMLs"
