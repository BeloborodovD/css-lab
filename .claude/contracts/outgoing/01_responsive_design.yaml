# Responsive Patterns
patterns:
  mobile_first:
    description: "Начинаем с mobile стилей, расширяем для desktop"
    example: |
      .component {
        /* Mobile first */
        padding: 12px;
        font-size: 14px;
      }

      @media (min-width: 768px) {
        .component {
          padding: 16px;
          font-size: 16px;
        }
      }

  touch_targets:
    description: "Минимальный размер touch target 44x44px"
    applies_to:
      - buttons
      - links
      - form controls
      - list items

  fluid_typography:
    description: "Плавное изменение размера шрифта"
    example: |
      h1 {
        font-size: clamp(1.5rem, 4vw, 2.5rem);
      }

  container_queries:
    description: "Container queries для компонентной адаптивности"
    note: "Использовать где поддерживается"

# Dark Theme Responsive
dark_theme:
  notes:
    - "Все responsive стили должны работать с .dark классом"
    - "Проверить контраст на mobile"
    - "Учесть OLED экраны (true black)"

