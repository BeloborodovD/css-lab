        - "Backdrop blur на mobile"

    - path: "styles/components/table.css"
      changes:
        - "Horizontal scroll на mobile"
        - "Card-style layout опция для mobile"
        - "Sticky first column опция"

    - path: "styles/components/nav.css"
      changes:
        - "Hamburger menu pattern"
        - "Dropdown → full-width на mobile"
        - "Bottom navigation опция"

    - path: "styles/components/inputs.css"
      changes:
        - "Full-width inputs на mobile"
        - "Larger touch targets (min 44px height)"
        - "Floating labels stack на mobile"

    - path: "styles/components/date-picker.css"
      changes:
        - "Full-width dropdown на mobile"
        - "Larger day cells для touch"
        - "Month view scroll на small screens"

    - path: "styles/components/combobox.css"
