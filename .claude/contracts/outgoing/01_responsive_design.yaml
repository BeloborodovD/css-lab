# Контекст проекта
context:
  project: "CSS Lab - Style Library"
  location: "d:\\_claude_project\\css-lab"
  styles_dir: "styles/"
  tech_stack: "Pure CSS (no preprocessors)"
  target: "Полная адаптивность всех компонентов для мобильных устройств"

# Задание
task:
  title: "Responsive Design System для CSS Lab"
  description: |
    Создать систему адаптивных стилей для всех компонентов библиотеки.
    Обеспечить корректное отображение на всех устройствах от 320px до 1920px+.

# Breakpoints System
breakpoints:
  xs: "320px"   # Маленькие телефоны
  sm: "480px"   # Телефоны
  md: "768px"   # Планшеты portrait
  lg: "1024px"  # Планшеты landscape / маленькие ноутбуки
  xl: "1280px"  # Десктопы
  xxl: "1536px" # Большие мониторы

# Файлы для создания/обновления
files:
  create:
    - path: "styles/base/responsive.css"
      description: "Основные responsive утилиты и breakpoint миксины"
      content_guide: |
        ## CSS Variables для breakpoints
        ```css
        :root {
          --breakpoint-xs: 320px;
          --breakpoint-sm: 480px;
          --breakpoint-md: 768px;
          --breakpoint-lg: 1024px;
          --breakpoint-xl: 1280px;
          --breakpoint-xxl: 1536px;
        }
        ```

        ## Container responsive
        - .container с max-width для каждого breakpoint
        - .container-fluid для full-width

        ## Responsive утилиты
        - .hide-xs, .hide-sm, .hide-md, .hide-lg, .hide-xl
        - .show-xs, .show-sm, .show-md, .show-lg, .show-xl
        - .text-center-mobile, .text-left-desktop

        ## Grid responsive
        - .grid-cols-1-mobile
        - .grid-cols-2-tablet
        - .flex-column-mobile

        ## Spacing responsive
        - .gap-2-mobile, .gap-4-tablet, .gap-6-desktop
        - .p-2-mobile, .p-4-tablet

  update:
    - path: "styles/components/buttons.css"
      changes:
        - "Кнопки full-width на mobile (.btn-block-mobile)"
        - "Уменьшенный padding на xs screens"
        - "Touch-friendly размер минимум 44px"

    - path: "styles/components/cards.css"
      changes:
        - "Карточки в одну колонку на mobile"
        - "Уменьшенный padding на mobile"
        - "Stack layout для card-header на mobile"

    - path: "styles/components/modal.css"
      changes:
        - "Full-screen modal на mobile"
        - "Bottom sheet вариант для mobile"
        - "Sticky header/footer на mobile"

    - path: "styles/components/sidebar.css"
      changes:
