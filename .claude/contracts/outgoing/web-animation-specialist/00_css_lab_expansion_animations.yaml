# Contract: CSS Lab Library Expansion - Advanced Animations
# Task ID: css-lab-expansion-animations
# Created: 2025-11-23
# Agent: web-animation-specialist

contract_id: "css-lab-expansion-animations-001"
task_type: "animation_implementation"
priority: "high"

# Контекст проекта
context:
  project: "CSS Lab - Style Library"
  location: "d:\\_claude_project\\css-lab"
  existing_animations: "animations.css (~1200 lines)"
  target: "Добавить продвинутые анимации для новых компонентов"

# Задание
task:
  title: "Продвинутые анимации для CSS Lab"
  description: |
    Создать новые анимации и улучшить существующие.
    Все анимации должны быть performant (60fps), accessible (reduced-motion),
    и purposeful (служить UX целям).

# Анимации для реализации
animations_to_create:

  # === MICRO-INTERACTIONS ===
  micro_interactions:
    - name: "Checkbox Tick"
      purpose: "Visual confirmation of selection"
      type: "svg_path_animation"
      duration: "200ms"
      easing: "ease-out"
      technique: "stroke-dashoffset"

    - name: "Radio Dot Scale"
      purpose: "Selection feedback"
      type: "transform"
      duration: "150ms"
      easing: "spring"

    - name: "Switch Slide"
      purpose: "Toggle state change"
      type: "transform + background"
      duration: "200ms"
      easing: "ease-in-out"

    - name: "Button Submit Loading"
      purpose: "Processing feedback"
      type: "width shrink + spinner appear"
      duration: "300ms"
      states: [idle, loading, success, error]

    - name: "Input Focus Ring"
      purpose: "Focus indication"
      type: "box-shadow expand"
      duration: "150ms"
      technique: "box-shadow animation"

  # === PAGE TRANSITIONS ===
  page_transitions:
    - name: "Page Fade Through"
      purpose: "Route change"
      type: "opacity + slight translate"
      duration: "200ms"
      easing: "ease-out"

    - name: "Slide Stack"
      purpose: "Mobile navigation"
      type: "translateX with shadow"
      duration: "300ms"
      easing: "ease-out"

    - name: "Morph Container"
      purpose: "Shared element transition"
      type: "FLIP animation"
      technique: "getBoundingClientRect → transform"

  # === SCROLL ANIMATIONS ===
  scroll_animations:
    - name: "Scroll Reveal"
      purpose: "Progressive content reveal"
      trigger: "IntersectionObserver"
      animation: "fade-in-up"
      stagger: "100ms"
      threshold: "0.2"

    - name: "Parallax Layers"
      purpose: "Depth effect"
      technique: "transform: translateY with scroll ratio"
      performance: "will-change: transform"

    - name: "Progress Bar (scroll-linked)"
      purpose: "Reading progress indicator"
      technique: "CSS scroll-timeline or JS"

  # === LOADING STATES ===
  loading_states:
    - name: "Skeleton Shimmer"
      purpose: "Content placeholder"
      type: "linear-gradient animation"
      duration: "1.5s"
      iteration: "infinite"
      reduced_motion: "static gray"

    - name: "Dots Bounce"
      purpose: "Inline loading"
      type: "3 dots with staggered bounce"
      duration: "1.4s"

    - name: "Progress Ring"
      purpose: "Circular progress"
      type: "stroke-dasharray animation"
      technique: "SVG circle"

    - name: "Skeleton Wave"
      purpose: "Card loading"
      type: "gradient position animation"

  # === FEEDBACK ANIMATIONS ===
  feedback:
    - name: "Success Checkmark"
      purpose: "Operation success"
      type: "SVG path draw + scale"
      duration: "500ms"

    - name: "Error Shake"
      purpose: "Validation error"
      type: "translateX shake"
      duration: "400ms"
      intensity: "4px"

    - name: "Toast Slide In"
      purpose: "Notification appear"
      type: "translateX + opacity"
      duration: "300ms"
      exit: "fade out + slide"

    - name: "Confetti Burst"
      purpose: "Celebration (use sparingly!)"
      type: "particle animation"
      trigger: "on-demand only"
      duration: "2s"

  # === ADVANCED EFFECTS ===
  advanced:
    - name: "Magnetic Button"
      purpose: "Premium feel hover"
      type: "transform follow cursor"
      technique: "mousemove → translate"

    - name: "Text Reveal (per-character)"
      purpose: "Hero text entrance"
      type: "staggered opacity + translateY"
      stagger: "30ms per char"

    - name: "Morphing Background"
      purpose: "Hero section"
      type: "gradient position animation"
      technique: "radial-gradient + animation"

    - name: "3D Card Tilt"
      purpose: "Product card hover"
      type: "rotateX/Y based on cursor"
      technique: "perspective + transform"

# Performance требования
performance:
  target_fps: 60
  gpu_accelerated_only:
    - transform
    - opacity
    - filter
  avoid:
    - "layout-triggering properties (width, height, top, left)"
    - "paint-triggering properties (background-color changes)"
  techniques:
    - "will-change for complex animations"
    - "contain: layout style paint"
    - "content-visibility: auto for off-screen"

# Accessibility
accessibility:
  reduced_motion:
    strategy: "Provide alternative for every animation"
    alternatives:
      - "fade-only instead of slide+fade"
      - "instant instead of animated"
      - "static instead of shimmer"
    media_query: "@media (prefers-reduced-motion: reduce)"

  seizure_safety:
    - "No flashing >3 times per second"
    - "No strobing effects"
    - "Avoid red flashing"

# Output files
output:
  files:
    - "styles/base/animations/micro-interactions.css"
    - "styles/base/animations/page-transitions.css"
    - "styles/base/animations/scroll-animations.css"
    - "styles/base/animations/loading-states.css"
    - "styles/base/animations/feedback.css"
    - "styles/base/animations/advanced.css"
  update:
    - "styles/base/animations.css (import new files)"

# Handoff
handoff:
  next_agent: "frontend-developer"
  reason: "JS-based animations need React hooks"
  input: "CSS animations, animation specs"