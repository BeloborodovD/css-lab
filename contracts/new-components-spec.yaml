          position: "relative"
          padding_bottom: "24px"

      dot:
        element: ".timeline-dot"
        description: "Точка на линии"
        styles:
          position: "absolute"
          left: "-26px"
          top: "4px"
          width: "12px"
          height: "12px"
          border_radius: "50%"
          background: "var(--panel)"
          border: "2px solid var(--accent)"
          z_index: "1"

      dot_icon:
        element: ".timeline-dot-icon"
        description: "Точка с иконкой внутри"
        styles:
          width: "24px"
          height: "24px"
          left: "-32px"
          top: "0"
          display: "flex"
          align_items: "center"
