      title:
        element: ".timeline-title"
        styles:
          font_size: "0.9rem"
          font_weight: "600"
          color: "var(--text)"
          margin_bottom: "4px"

      description:
        element: ".timeline-description"
        styles:
          font_size: "0.85rem"
          color: "var(--muted)"
          line_height: "1.5"

      meta:
        element: ".timeline-meta"
        description: "Дополнительная информация (автор, теги)"
        styles:
          margin_top: "8px"
          font_size: "0.75rem"
          color: "var(--muted)"

    colors:
      base_theme:
        line: "var(--border)"
        dot_border: "var(--accent)"
        dot_bg: "var(--panel)"
        dot_active: "var(--accent)"
        content_bg: "var(--panel)"
        content_border: "var(--border)"
        timestamp: "var(--muted)"
        title: "var(--text)"
        info_dot: "#2196f3"
        success_dot: "#4caf50"
        warning_dot: "#ff9800"
        error_dot: "#f44336"

      dark_theme:
        line: "var(--surface-6)"
        dot_border: "var(--primary-500)"
        dot_bg: "var(--surface-2)"
        dot_active: "var(--primary-500)"
        content_bg: "var(--surface-3)"
        content_border: "var(--surface-6)"
        timestamp: "var(--text-tertiary)"
        title: "var(--text-primary)"
        info_dot: "var(--info)"
        success_dot: "var(--success)"
        warning_dot: "var(--warning)"
        error_dot: "var(--error)"

    accessibility:
      role: "feed или list"
      aria_attributes:
