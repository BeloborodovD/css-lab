# UX Specification: Avatar / Avatar Group Component
# Component: Avatar with Status Indicators and Grouping
# Version: 1.0.0
# Created: 2025-11-23
# Agent: ux-ergonomics-specialist

component_id: "avatar"
component_name: "Avatar / Avatar Group"
category: "data-display"

# User Flows
user_flows:
  image_avatar_flow:
    name: "Image Avatar Display"
    steps:
      - step: 1
        action: "Component receives image URL"
        system_response: "Image loads"
        feedback: "Placeholder shown during load, image fades in"
      - step: 2
        action: "Image load fails"
        system_response: "Fallback activated"
        feedback: "Initials displayed on colored background"
      - step: 3
        action: "User hovers (if interactive)"
        system_response: "Tooltip shows full name"
        feedback: "Tooltip appears after 500ms delay"

  avatar_group_flow:
    name: "Stacked Avatar Group"
    steps:
      - step: 1
        action: "Component receives list of users"
        system_response: "Avatars render stacked"
        feedback: "Max visible avatars shown, overflow counter"
      - step: 2
        action: "User hovers overflow counter"
        system_response: "Tooltip shows remaining names"
        feedback: "+{n} with list of names"
      - step: 3
        action: "User clicks overflow (if enabled)"
        system_response: "Dropdown shows all users"
        feedback: "Full list with avatars and names"

  status_indicator_flow:
    name: "Status Display"
    steps:
      - step: 1
        action: "User status changes"
        system_response: "Status dot updates"
        feedback: "Color transition animation"
      - step: 2
        action: "User hovers status"
        system_response: "Status text shown"
        feedback: "Tooltip: Online/Offline/Away/Busy"

# Interaction Patterns
interaction_patterns:
  avatar:
    shape: "circle (default) or square with radius"
    border: "2px solid white (for contrast on any background)"
    cursor:
      default: "default"
      interactive: "pointer"
    hover:
      interactive_only: true
      transform: "scale(1.05)"
      ring: "2px ring var(--primary-color)"

  initials_fallback:
    generation: "First letter of first and last name"
    max_chars: 2
    background: "deterministic color from name hash"
    color_palette:
      - "#F44336"  # Red
      - "#E91E63"  # Pink
      - "#9C27B0"  # Purple
      - "#673AB7"  # Deep Purple
      - "#3F51B5"  # Indigo
      - "#2196F3"  # Blue
      - "#009688"  # Teal
      - "#4CAF50"  # Green
      - "#FF9800"  # Orange
      - "#795548"  # Brown
    text_color: "white"
    font_weight: "600"

  status_indicator:
    position: "bottom-right"
    offset: "10% from edge"
    size_ratio: "25% of avatar size"
    border: "2px solid white"
    colors:
      online: "#4CAF50"
      offline: "#9E9E9E"
      away: "#FF9800"
      busy: "#F44336"
      do_not_disturb: "#F44336"

  avatar_group:
    overlap: "25% of avatar width"
    direction: "left to right"
    stacking_order: "first on top (highest z-index)"
    max_visible: "configurable, default 4"
    overflow_counter:
      shape: "same as avatars"
      background: "var(--neutral-200)"
      text: "+{remaining count}"
      font_weight: "600"

# Sizes
sizes:
  xs:
    dimension: "24px"
    font_size: "10px"
    status_size: "6px"
    border_width: "1px"

  sm:
    dimension: "32px"
    font_size: "12px"
    status_size: "8px"
    border_width: "2px"

  md:
    dimension: "40px"
    font_size: "14px"
    status_size: "10px"
    border_width: "2px"

  lg:
    dimension: "48px"
    font_size: "16px"
    status_size: "12px"
    border_width: "2px"

  xl:
    dimension: "64px"
    font_size: "20px"
    status_size: "14px"
    border_width: "3px"

  xxl:
    dimension: "96px"
    font_size: "28px"
    status_size: "18px"
    border_width: "3px"

# States
states:
  loading:
    description: "Image loading"
    visual:
      background: "var(--neutral-200)"
      animation: "pulse or shimmer"
    aria_busy: true

  loaded:
    description: "Image displayed"
    visual: "full image visible"
    transition: "fade in 200ms"

  error:
    description: "Image failed to load"
    visual: "initials fallback"
    silent_fallback: true

  default:
    description: "No image provided"
    visual: "initials on colored background"

  interactive_hover:
    description: "Hoverable avatar"
    visual:
      transform: "scale(1.05)"
      ring: "focus ring"
    cursor: "pointer"

  interactive_focus:
    description: "Keyboard focused"
    visual:
      outline: "2px solid var(--primary-color)"
      outline_offset: "2px"

# Keyboard Navigation
keyboard:
  interactive_avatar:
    tab:
      action: "Focus avatar"
    enter:
      action: "Activate avatar (click event)"
    space:
      action: "Activate avatar (click event)"

  avatar_group_dropdown:
    tab:
      action: "Focus overflow button"
    enter:
      action: "Open dropdown"
    escape:
      action: "Close dropdown"
    arrow_down:
      action: "Navigate dropdown items"

# Accessibility Requirements (WCAG 2.1 AA)
accessibility:
  aria_roles:
    avatar_image:
      role: "img"
      alt: "User's full name"
    avatar_button:
      role: "button"
    avatar_group:
      role: "group"
      aria_label: "User avatars"
    overflow_button:
      role: "button"
      aria_expanded: "true/false"

  aria_attributes:
    avatar:
      - "aria-label: Full name"
      - "alt: Full name (for img)"
    status:
      - "aria-label: Status description"
    overflow:
      - "aria-label: Show {n} more users"
      - "aria-haspopup: true (if dropdown)"

  screen_reader:
    image_avatar: "John Doe"
    initials_avatar: "John Doe (initials JD)"
    with_status: "John Doe, online"
    group: "5 users: John, Jane, Bob, and 2 more"

  status_not_color_only:
    requirement: "Status must have icon or text alternative"
    implementation:
      - tooltip_on_hover: true
      - aria_label: "status name"
      - optional_icon: "checkmark for online, clock for away"

  focus_visible:
    outline: "2px solid var(--primary-color)"
    outline_offset: "2px"
    visible_only_on_keyboard: "focus-visible"

  reduced_motion:
    preference: "prefers-reduced-motion: reduce"
    changes:
      - no_hover_scale: true
      - no_loading_animation: "static gray"
      - instant_fade_in: true

  color_contrast:
    initials_text: "4.5:1 minimum against background"
    status_indicator: "3:1 minimum against avatar"
    overflow_text: "4.5:1 minimum"

# Tooltip Configuration
tooltip:
  delay: "500ms"
  position: "top (default)"
  content:
    avatar: "Full name"
    status: "Status: Online/Offline/Away/Busy"
    overflow: "Names of remaining users"
  max_names_in_tooltip: 10
  overflow_message: "and {n} more..."

# Responsive Behavior
responsive:
  desktop:
    min_width: "1024px"
    default_size: "md"
    group_max_visible: 5

  tablet:
    min_width: "768px"
    max_width: "1023px"
    default_size: "md"
    group_max_visible: 4

  mobile:
    max_width: "767px"
    default_size: "sm"
    group_max_visible: 3
    changes:
      - tooltip_on_tap: true
      - larger_status_indicator: true

# Animation Timings
animations:
  image_load:
    duration: "200ms"
    style: "fade in"
    easing: "ease-out"

  hover_scale:
    duration: "150ms"
    transform: "scale(1.05)"
    easing: "ease-out"

  status_change:
    duration: "300ms"
    style: "color transition"
    easing: "ease-in-out"

  loading_pulse:
    duration: "1.5s"
    style: "opacity 0.4 to 1"
    iteration: "infinite"

  group_enter:
    duration: "200ms"
    style: "scale from 0 + fade"
    stagger: "50ms per avatar"

# Usage Variants
variants:
  basic:
    description: "Simple avatar with image or initials"
    props:
      - src: "image URL"
      - name: "user name for alt and initials"
      - size: "xs|sm|md|lg|xl|xxl"

  with_status:
    description: "Avatar with status indicator"
    props:
      - status: "online|offline|away|busy"
      - show_status: "boolean"

  interactive:
    description: "Clickable avatar (opens profile, etc.)"
    props:
      - onClick: "handler function"
      - href: "link URL"

  group:
    description: "Multiple avatars stacked"
    props:
      - users: "array of user objects"
      - max: "maximum visible count"
      - size: "uniform size for all"

  with_badge:
    description: "Avatar with notification badge"
    props:
      - badge_count: "number"
      - badge_position: "top-right"

  editable:
    description: "Avatar with edit overlay"
    props:
      - editable: "boolean"
      - onEdit: "handler function"
    visual:
      overlay: "camera icon on hover"
      background: "semi-transparent black"
