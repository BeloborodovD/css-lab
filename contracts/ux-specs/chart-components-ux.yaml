# UX Specification: Chart Components
# Component: Accessible Charts with Interactions
# Version: 1.0.0
# Created: 2025-11-23
# Agent: ux-ergonomics-specialist

component_id: "chart-components"
component_name: "Chart Components"
category: "data-display"

# User Flows
user_flows:
  view_chart_flow:
    name: "View Chart Data"
    steps:
      - step: 1
        action: "Chart renders with data"
        system_response: "Visual chart displayed"
        feedback: "Animated entry (optional), data visible"
      - step: 2
        action: "User hovers data point"
        system_response: "Tooltip appears"
        feedback: "Value, label, additional context"
      - step: 3
        action: "User moves to different point"
        system_response: "Tooltip updates"
        feedback: "Follows cursor or nearest point"

  toggle_series_flow:
    name: "Toggle Data Series"
    steps:
      - step: 1
        action: "User clicks legend item"
        system_response: "Series toggles visibility"
        feedback: "Series fades out, legend item dims"
      - step: 2
        action: "User clicks again"
        system_response: "Series reappears"
        feedback: "Series animates in"

  access_data_table_flow:
    name: "Access Data via Table"
    steps:
      - step: 1
        action: "User activates accessible data view"
        system_response: "Data table shown"
        feedback: "Table with all chart data"
      - step: 2
        action: "User navigates table"
        system_response: "Standard table interaction"
        feedback: "Screen reader compatible"

# Chart Types
chart_types:
  line_chart:
    use_case: "Trends over time"
    elements:
      - lines: "data series"
      - points: "data markers"
      - x_axis: "categories or time"
      - y_axis: "values"
      - grid: "optional reference lines"

  bar_chart:
    use_case: "Category comparison"
    variants:
      - vertical: "default"
      - horizontal: "for long labels"
      - stacked: "parts of whole"
      - grouped: "side by side comparison"

  area_chart:
    use_case: "Volume over time"
    variants:
      - basic: "single series"
      - stacked: "multiple series"
      - percent: "100% stacked"

  pie_chart:
    use_case: "Parts of whole (limited segments)"
    recommendation: "max 5-7 segments"
    alternatives: "donut chart, bar chart"

  donut_chart:
    use_case: "Parts of whole with center metric"
    center_content: "total, label, icon"

  scatter_plot:
    use_case: "Correlation between variables"
    elements:
      - points: "data markers"
      - quadrants: "optional reference"
      - trend_line: "optional"

# Interaction Patterns
interaction_patterns:
  tooltip:
    trigger: "hover (desktop) or tap (mobile)"
    position: "above point, flip if needed"
    content:
      - value: "primary data value"
      - label: "data point label"
      - secondary: "additional context"
    style:
      background: "var(--neutral-900)"
      color: "white"
      padding: "8px 12px"
      border_radius: "4px"
      shadow: "0 2px 8px rgba(0,0,0,0.15)"
    pointer: "small triangle pointing to data"

  legend:
    position: "bottom or right"
    layout: "horizontal wrap or vertical list"
    items:
      - color_indicator: "matches series"
      - label: "series name"
      - value: "optional current/total value"
    interaction:
      click: "toggle series visibility"
      hover: "highlight series"
    states:
      active: "full opacity"
      inactive: "0.4 opacity, strikethrough optional"

  crosshair:
    type: "vertical line (time series) or crosshairs (scatter)"
    style:
      stroke: "var(--neutral-400)"
      stroke_dasharray: "4 4"
    follows: "cursor or nearest data point"

  zoom_pan:
    enabled: "optional for large datasets"
    controls:
      zoom_in: "button or scroll"
      zoom_out: "button or scroll"
      reset: "double-click or button"
      pan: "drag when zoomed"
    range_selector: "mini chart for range selection"

  data_point_marker:
    default_size: "6px"
    hover_size: "8px"
    shapes: "circle, square, triangle, diamond"
    fill: "series color"
    stroke: "white (for contrast)"

# States
states:
  loading:
    description: "Data fetching"
    visual: "skeleton chart or spinner"
    aria_busy: "true"

  loaded:
    description: "Chart rendered"
    animation: "optional entry animation"

  empty:
    description: "No data"
    visual: "empty state with message"
    message: "No data available"

  error:
    description: "Failed to load"
    visual: "error message"

  interactive:
    description: "User interacting"
    visual: "tooltip visible, crosshair active"

  filtered:
    description: "Some series hidden"
    visual: "dimmed legend items"

# Accessibility Requirements (WCAG 2.1 AA)
accessibility:
  data_table_fallback:
    requirement: "All chart data accessible as table"
    implementation:
      - hidden_table: "visually hidden, available to screen readers"
      - toggle_button: "Show data as table"
      - aria_describedby: "link chart to table"

  aria_roles:
    chart_container: "img or figure"
    figure: "figure"
    figcaption: "figcaption"
    legend: "list"
    legend_item: "listitem"

  aria_attributes:
    chart:
      - "role: img"
      - "aria-label: Chart description"
      - "aria-describedby: detailed description id"
    figure:
      - "role: figure"
    data_point:
      - "aria-label: Full data point description"

  keyboard_navigation:
    tab: "Focus chart, then legend items"
    arrow_keys: "Navigate between data points"
    enter: "Activate legend item (toggle)"
    escape: "Close tooltip"

  announcements:
    on_focus: "Chart title and summary"
    on_navigate: "Data point value and label"
    on_toggle: "Series {name} {shown/hidden}"

  reduced_motion:
    preference: "prefers-reduced-motion: reduce"
    changes:
      - no_entry_animation: true
      - no_transition_animation: true
      - instant_tooltip: true

  color_independence:
    requirement: "Information not conveyed by color alone"
    solutions:
      - patterns: "different line styles (solid, dashed)"
      - shapes: "different point markers"
      - labels: "direct labels on series"
      - texture: "patterns in bars/areas"

  color_contrast:
    data_colors: "distinguishable from each other"
    axis_labels: "4.5:1 against background"
    grid_lines: "3:1 minimum"

# Responsive Behavior
responsive:
  desktop:
    min_width: "1024px"
    legend_position: "right or bottom"
    tooltip_trigger: "hover"
    show_all_labels: true

  tablet:
    min_width: "768px"
    max_width: "1023px"
    legend_position: "bottom"
    tooltip_trigger: "hover or tap"
    reduce_labels: "show every Nth label"

  mobile:
    max_width: "767px"
    changes:
      - legend_position: "below chart"
      - legend_scrollable: true
      - tooltip_trigger: "tap"
      - tooltip_persistent: "until tap elsewhere"
      - simplified_axis: "fewer labels"
      - horizontal_scroll: "for wide charts"
      - aspect_ratio: "more square (1:1 to 4:3)"

# Animation Timings
animations:
  entry:
    line_chart:
      style: "draw from left to right"
      duration: "1000ms"
      easing: "ease-out"
    bar_chart:
      style: "grow from axis"
      duration: "500ms"
      stagger: "50ms per bar"
    pie_chart:
      style: "expand from center or sweep"
      duration: "800ms"

  tooltip:
    show:
      duration: "100ms"
      style: "fade in"
    hide:
      duration: "100ms"
      style: "fade out"

  series_toggle:
    duration: "300ms"
    style: "fade + scale"

  update:
    duration: "500ms"
    easing: "ease-in-out"
    style: "morph to new values"

# Color Guidelines
color_guidelines:
  palette:
    categorical:
      - "#2196F3"  # Blue
      - "#4CAF50"  # Green
      - "#FF9800"  # Orange
      - "#9C27B0"  # Purple
      - "#F44336"  # Red
      - "#00BCD4"  # Cyan
      - "#795548"  # Brown
      - "#607D8B"  # Blue Grey
    sequential:
      light_to_dark: "single hue, varying lightness"
    diverging:
      negative_positive: "red to blue through neutral"

  accessibility:
    colorblind_safe: true
    patterns_for_print: true
    minimum_contrast: "3:1 between adjacent series"

# Best Practices
best_practices:
  do:
    - "Start Y-axis at 0 (bar charts)"
    - "Use appropriate chart type for data"
    - "Label axes clearly"
    - "Provide data table alternative"
    - "Limit series to 5-7 for readability"
    - "Use consistent colors across charts"

  dont:
    - "Use 3D effects (distorts perception)"
    - "Use pie charts for >7 segments"
    - "Truncate Y-axis misleadingly"
    - "Rely on color alone for meaning"
    - "Animate continuously (distracting)"
    - "Overcrowd with data points"
