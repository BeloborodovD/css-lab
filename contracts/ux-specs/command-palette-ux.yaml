# UX Specification: Command Palette / Spotlight Component
# Component: Command Palette (Cmd+K style)
# Version: 1.0.0
# Created: 2025-11-23
# Agent: ux-ergonomics-specialist

component_id: "command-palette"
component_name: "Command Palette / Spotlight"
category: "navigation"

# User Flows
user_flows:
  primary_flow:
    name: "Keyboard-First Command Execution"
    steps:
      - step: 1
        action: "User presses Cmd+K (Mac) or Ctrl+K (Windows)"
        system_response: "Command palette opens centered"
        feedback: "Modal appears with backdrop blur, input focused"
      - step: 2
        action: "User types command or search query"
        system_response: "Fuzzy search filters commands"
        feedback: "Matching commands appear, query text highlighted"
      - step: 3
        action: "User navigates with arrow keys"
        system_response: "Selection moves between results"
        feedback: "Highlighted item with distinct background"
      - step: 4
        action: "User presses Enter"
        system_response: "Command executes"
        feedback: "Palette closes, action performed"

  category_navigation_flow:
    name: "Browse by Category"
    steps:
      - step: 1
        action: "User opens palette (empty query)"
        system_response: "Shows recent actions and categories"
        feedback: "Recent items first, then category headers"
      - step: 2
        action: "User types category prefix (e.g., >file)"
        system_response: "Filters to file-related commands only"
        feedback: "Category indicator shown, filtered list"
      - step: 3
        action: "User selects category header"
        system_response: "Drills into category"
        feedback: "Breadcrumb shows path, back option available"

  recent_actions_flow:
    name: "Quick Access to Recent"
    steps:
      - step: 1
        action: "User opens palette"
        system_response: "Recent actions shown at top"
        feedback: "Clock icon, recently used commands"
      - step: 2
        action: "User presses arrow down once"
        system_response: "First recent item selected"
        feedback: "Can execute immediately with Enter"

  sub_command_flow:
    name: "Nested Commands"
    steps:
      - step: 1
        action: "User selects parent command"
        system_response: "Sub-commands shown"
        feedback: "Breadcrumb updates, new options displayed"
      - step: 2
        action: "User presses Backspace on empty input"
        system_response: "Returns to parent level"
        feedback: "Breadcrumb updates, previous level shown"

# Interaction Patterns
interaction_patterns:
  trigger:
    keyboard:
      mac: "Cmd+K"
      windows: "Ctrl+K"
      alternative: "Cmd+P or Ctrl+P (optional)"
    button:
      display: "Search icon in header"
      shortcut_hint: "Shows Cmd+K badge"

  modal:
    position: "center, 20% from top"
    width: "min(600px, 90vw)"
    max_height: "min(500px, 70vh)"
    backdrop: "blur + dark overlay"
    animation: "scale from 95% + fade (200ms)"

  search_input:
    placeholder: "Type a command or search..."
    autofocus: true
    clear_button: "visible when text present"
    icon: "search icon on left"
    shortcut_hint: "ESC to close on right"

  results_list:
    max_visible: "8 items before scroll"
    scroll: "smooth scroll to keep selection visible"
    empty_state: "No results found. Try different keywords."

  result_item:
    layout: "icon | title + subtitle | shortcut hint"
    elements:
      icon:
        size: "20x20px"
        color: "contextual or category-based"
      title:
        font_weight: "500"
        highlight: "bold matching characters"
      subtitle:
        font_size: "0.875rem"
        color: "var(--text-muted)"
      shortcut:
        display: "keyboard shortcut if available"
        style: "kbd style badge"
    states:
      default:
        background: "transparent"
      highlighted:
        background: "var(--primary-color-alpha-10)"
        border_left: "2px solid var(--primary-color)"

  category_section:
    header:
      text_transform: "uppercase"
      font_size: "0.75rem"
      font_weight: "600"
      color: "var(--text-muted)"
      sticky: true

  footer:
    display: "keyboard hints"
    content:
      - icon: "arrow-up-down"
        text: "Navigate"
      - icon: "enter"
        text: "Select"
      - icon: "escape"
        text: "Close"

# States
states:
  closed:
    description: "Palette not visible"
    trigger_state: "ready for Cmd+K"

  open_empty:
    description: "Palette open, no query"
    display:
      - recent_actions: "if available"
      - quick_actions: "common commands"
      - categories: "browseable sections"
    aria_label: "Command palette open. Type to search commands."

  searching:
    description: "User typing query"
    display: "filtered results"
    feedback: "results update as user types"
    debounce: "100ms (fast for responsiveness)"

  results_shown:
    description: "Filtered results displayed"
    announcement: "{n} results found"

  no_results:
    description: "Query matches nothing"
    display:
      message: "No commands found"
      suggestion: "Try different keywords"
    optional: "Create action if applicable"

  loading:
    description: "Async commands loading"
    display: "spinner or skeleton items"
    aria_busy: true

  sub_menu:
    description: "Viewing nested commands"
    display:
      breadcrumb: "Parent > Current"
      back_option: "visible"
      sub_commands: "child options"

  executing:
    description: "Command running"
    display: "brief loading indicator"
    auto_close: "on completion"

# Keyboard Navigation
keyboard:
  # Global (palette closed)
  global:
    cmd_k:
      action: "Open command palette"
      platform: "Mac"
    ctrl_k:
      action: "Open command palette"
      platform: "Windows/Linux"

  # Palette open
  palette:
    escape:
      action: "Close palette"
      with_query: "Clear query first, second press closes"
    arrow_down:
      action: "Move to next result"
      wrap: "to first if at end"
    arrow_up:
      action: "Move to previous result"
      wrap: "to last if at start"
    enter:
      action: "Execute selected command"
    tab:
      action: "Move to next result (alternative)"
    shift_tab:
      action: "Move to previous result"
    cmd_enter:
      action: "Execute in new tab (if applicable)"
    backspace_empty:
      action: "Go up one level (if in sub-menu)"
    home:
      action: "Jump to first result"
    end:
      action: "Jump to last result"
    page_up:
      action: "Move up 5 results"
    page_down:
      action: "Move down 5 results"

  # Shortcut display
  shortcut_hints:
    display_format: "Mac: Cmd, Windows: Ctrl"
    symbol_style: "kbd badges"

# Accessibility Requirements (WCAG 2.1 AA)
accessibility:
  aria_roles:
    modal: "dialog"
    search_input: "combobox"
    results_list: "listbox"
    result_item: "option"
    category_header: "presentation"

  aria_attributes:
    modal:
      - "aria-modal: true"
      - "aria-label: Command palette"
    search_input:
      - "aria-haspopup: listbox"
      - "aria-expanded: true"
      - "aria-controls: results list id"
      - "aria-activedescendant: highlighted item id"
      - "aria-autocomplete: list"
    results_list:
      - "aria-label: Search results"
    result_item:
      - "aria-selected: true/false"
      - "aria-label: command name and shortcut"

  focus_management:
    open: "Focus search input immediately"
    close: "Return focus to previously focused element"
    trap_focus: "Tab cycles within palette only"

  announcements:
    live_region: "aria-live='polite'"
    events:
      - open: "Command palette open. Type to search."
      - results: "{n} commands found"
      - no_results: "No commands found"
      - navigation: "{command name}"
      - execute: "Executing {command name}"

  reduced_motion:
    preference: "prefers-reduced-motion: reduce"
    changes:
      - no_scale_animation: true
      - no_backdrop_blur: "solid color instead"
      - instant_transitions: true

  color_contrast:
    text: "4.5:1 minimum"
    highlighted_item: "visible without color (border/outline)"
    shortcut_badges: "4.5:1 minimum"

# Command Structure
command_structure:
  categories:
    - name: "File"
      prefix: ">file"
      icon: "file"
      commands:
        - "New File"
        - "Open File"
        - "Save"
        - "Save As"

    - name: "Edit"
      prefix: ">edit"
      icon: "edit"
      commands:
        - "Undo"
        - "Redo"
        - "Cut"
        - "Copy"
        - "Paste"

    - name: "View"
      prefix: ">view"
      icon: "eye"
      commands:
        - "Toggle Sidebar"
        - "Toggle Theme"
        - "Zoom In"
        - "Zoom Out"

    - name: "Go to"
      prefix: ">go"
      icon: "arrow-right"
      commands:
        - "Go to Line"
        - "Go to Symbol"
        - "Go to File"

    - name: "Settings"
      prefix: ">settings"
      icon: "settings"
      commands:
        - "Open Settings"
        - "Keyboard Shortcuts"
        - "User Preferences"

  recent_tracking:
    max_items: 5
    storage: "localStorage"
    key: "command-palette-recent"

  fuzzy_search:
    algorithm: "substring match with scoring"
    scoring:
      exact_match: "100 points"
      starts_with: "80 points"
      word_boundary: "60 points"
      contains: "40 points"
    highlight: "bold matched characters"

# Responsive Behavior
responsive:
  desktop:
    min_width: "1024px"
    modal_width: "600px"
    position: "center, 20% from top"

  tablet:
    min_width: "768px"
    max_width: "1023px"
    modal_width: "90vw"
    position: "center"

  mobile:
    max_width: "767px"
    changes:
      - full_screen: true
      - position: "top"
      - touch_optimized: true
      - larger_touch_targets: "48px minimum"
      - swipe_to_close: "swipe down"
      - no_keyboard_shortcuts_shown: true

# Animation Timings
animations:
  open:
    duration: "200ms"
    easing: "cubic-bezier(0.16, 1, 0.3, 1)"
    style: "scale from 95% + fade"

  close:
    duration: "150ms"
    easing: "ease-in"
    style: "scale to 95% + fade"

  backdrop:
    duration: "200ms"
    style: "fade in blur"

  result_highlight:
    duration: "100ms"
    easing: "ease"

  scroll_into_view:
    behavior: "smooth"
    block: "nearest"

  sub_menu_transition:
    duration: "150ms"
    style: "slide left"
