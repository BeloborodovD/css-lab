# UX Specification: Data Grid / Virtual List Component
# Component: Data Grid with Virtualization, Sorting, Filtering
# Version: 1.0.0
# Created: 2025-11-23
# Agent: ux-ergonomics-specialist

component_id: "data-grid"
component_name: "Data Grid / Virtual List"
category: "data-display"

# User Flows
user_flows:
  browse_data_flow:
    name: "Browse Large Dataset"
    steps:
      - step: 1
        action: "Grid loads with initial data"
        system_response: "Virtualized rows render"
        feedback: "Only visible rows in DOM, smooth scroll"
      - step: 2
        action: "User scrolls down"
        system_response: "New rows virtualize in"
        feedback: "Seamless scrolling, no jank"
      - step: 3
        action: "User scrolls to specific row"
        system_response: "Row comes into view"
        feedback: "Scrollbar reflects position in dataset"

  sort_data_flow:
    name: "Sort by Column"
    steps:
      - step: 1
        action: "User clicks column header"
        system_response: "Data sorts ascending"
        feedback: "Sort indicator (arrow up), rows reorder"
      - step: 2
        action: "User clicks same header again"
        system_response: "Data sorts descending"
        feedback: "Sort indicator (arrow down)"
      - step: 3
        action: "User clicks third time"
        system_response: "Sort removed"
        feedback: "No indicator, original order"

  filter_data_flow:
    name: "Filter Data"
    steps:
      - step: 1
        action: "User clicks filter icon on column"
        system_response: "Filter popover opens"
        feedback: "Filter options based on column type"
      - step: 2
        action: "User enters filter criteria"
        system_response: "Data filters in real-time"
        feedback: "Row count updates, filtered indicator"
      - step: 3
        action: "User clears filter"
        system_response: "All data shown"
        feedback: "Filter indicator removed"

  select_rows_flow:
    name: "Row Selection"
    steps:
      - step: 1
        action: "User clicks row checkbox"
        system_response: "Row selected"
        feedback: "Checkbox checked, row highlighted"
      - step: 2
        action: "User shift-clicks another row"
        system_response: "Range selected"
        feedback: "All rows between selected"
      - step: 3
        action: "User clicks header checkbox"
        system_response: "All visible rows selected"
        feedback: "Selection count shown"

  resize_column_flow:
    name: "Resize Column"
    steps:
      - step: 1
        action: "User hovers column border"
        system_response: "Resize cursor shown"
        feedback: "cursor: col-resize"
      - step: 2
        action: "User drags border"
        system_response: "Column width changes"
        feedback: "Real-time resize, min-width enforced"
      - step: 3
        action: "User double-clicks border"
        system_response: "Auto-fit to content"
        feedback: "Column resizes to fit widest cell"

# Interaction Patterns
interaction_patterns:
  grid_container:
    layout: "CSS Grid or Table"
    overflow: "auto with custom scrollbar"
    min_height: "400px"
    max_height: "configurable or viewport-relative"

  virtualization:
    strategy: "windowing"
    overscan: "5 rows above and below viewport"
    row_height: "fixed (40px) or variable with estimation"
    buffer: "render extra rows for smooth scroll"

  header:
    sticky: true
    z_index: "above rows"
    background: "var(--neutral-50)"
    border_bottom: "1px solid var(--border-color)"

  header_cell:
    padding: "12px 16px"
    cursor: "pointer (if sortable)"
    elements:
      - title: "column name"
      - sort_indicator: "arrow up/down/none"
      - filter_icon: "funnel icon"
      - resize_handle: "invisible 8px wide area"
    hover:
      background: "var(--neutral-100)"

  row:
    height: "40px (configurable)"
    border_bottom: "1px solid var(--border-color-light)"
    states:
      default:
        background: "white"
      hover:
        background: "var(--neutral-50)"
      selected:
        background: "var(--primary-color-alpha-10)"
      striped_even:
        background: "var(--neutral-25)"

  cell:
    padding: "8px 16px"
    text_overflow: "ellipsis"
    white_space: "nowrap"
    types:
      text: "default, left-aligned"
      number: "right-aligned, monospace optional"
      date: "formatted per locale"
      boolean: "checkbox or badge"
      actions: "icon buttons"

  selection_column:
    width: "48px"
    position: "first column (sticky)"
    content: "checkbox"

  scrollbar:
    custom_style: true
    thumb:
      background: "var(--neutral-300)"
      border_radius: "4px"
    track:
      background: "transparent"
    width: "8px"

  filter_popover:
    position: "below header cell"
    width: "250px"
    content:
      text_column: "search input"
      number_column: "range inputs (min/max)"
      date_column: "date range picker"
      select_column: "checkbox list of values"
    actions:
      - apply: "primary button"
      - clear: "text button"

  sort_indicator:
    icons:
      ascending: "arrow-up"
      descending: "arrow-down"
      none: "arrows-up-down (subtle)"
    position: "right of column title"

  pagination:
    position: "bottom of grid"
    elements:
      - rows_per_page: "select (10, 25, 50, 100)"
      - page_info: "Showing 1-10 of 1000"
      - page_navigation: "prev, page numbers, next"
    alternative: "infinite scroll"

  toolbar:
    position: "above grid"
    elements:
      - search: "global search input"
      - filters_summary: "active filter chips"
      - column_toggle: "show/hide columns"
      - export: "CSV/Excel export"
      - bulk_actions: "when rows selected"

# States
states:
  loading:
    description: "Initial data fetch"
    visual: "skeleton rows or spinner overlay"
    aria_busy: "true"

  loaded:
    description: "Data displayed"
    visual: "populated rows"

  empty:
    description: "No data"
    visual: "empty state with message"
    message: "No data available"

  filtered_empty:
    description: "No matching results"
    visual: "empty state with clear filter option"
    message: "No results match your filters"

  error:
    description: "Failed to load"
    visual: "error message with retry"

  loading_more:
    description: "Fetching next page"
    visual: "spinner at bottom"

  selecting:
    description: "Row selection active"
    visual: "selection count in toolbar"

  resizing:
    description: "Column being resized"
    visual: "resize line, cursor col-resize"

  sorting:
    description: "Sort in progress"
    visual: "brief loading indicator (large datasets)"

# Keyboard Navigation
keyboard:
  grid_focus:
    tab:
      action: "Enter grid, focus first cell"
    shift_tab:
      action: "Exit grid backward"

  cell_navigation:
    arrow_right:
      action: "Move to next cell"
    arrow_left:
      action: "Move to previous cell"
    arrow_down:
      action: "Move to cell below"
    arrow_up:
      action: "Move to cell above"
    home:
      action: "Move to first cell in row"
    end:
      action: "Move to last cell in row"
    ctrl_home:
      action: "Move to first cell in grid"
    ctrl_end:
      action: "Move to last cell in grid"
    page_down:
      action: "Move down by viewport height"
    page_up:
      action: "Move up by viewport height"

  selection:
    space:
      action: "Toggle row selection"
    shift_arrow_down:
      action: "Extend selection down"
    shift_arrow_up:
      action: "Extend selection up"
    ctrl_a:
      action: "Select all rows"
    escape:
      action: "Clear selection"

  header_actions:
    enter:
      action: "Toggle sort (when header focused)"
    space:
      action: "Toggle sort (when header focused)"

  cell_actions:
    enter:
      action: "Activate cell (edit or action)"
    f2:
      action: "Enter edit mode"
    escape:
      action: "Cancel edit"

# Accessibility Requirements (WCAG 2.1 AA)
accessibility:
  aria_roles:
    grid: "grid"
    row: "row"
    columnheader: "columnheader"
    rowheader: "rowheader (if applicable)"
    cell: "gridcell"
    checkbox: "checkbox"

  aria_attributes:
    grid:
      - "aria-label: Grid description"
      - "aria-rowcount: total row count"
      - "aria-colcount: column count"
    row:
      - "aria-rowindex: 1-based index"
      - "aria-selected: true/false (if selectable)"
    columnheader:
      - "aria-sort: ascending/descending/none"
      - "aria-colindex: 1-based index"
    cell:
      - "aria-colindex: 1-based index"
      - "aria-describedby: column header id"

  focus_management:
    roving_tabindex: true
    single_tab_stop: "grid itself"
    internal_navigation: "arrow keys"
    visible_focus: "2px solid var(--primary-color)"

  announcements:
    live_region: "aria-live='polite'"
    events:
      - sort: "Sorted by {column}, {direction}"
      - filter: "{n} results after filtering"
      - select_row: "Row {n} selected"
      - select_all: "{n} rows selected"
      - page_change: "Page {n} of {total}"

  screen_reader:
    column_headers: "Read on first cell focus in column"
    row_context: "Row number announced"
    selection_status: "Selected/not selected"

  reduced_motion:
    preference: "prefers-reduced-motion: reduce"
    changes:
      - no_scroll_animation: true
      - instant_virtualization: true
      - no_sort_animation: true

  color_contrast:
    text: "4.5:1 minimum"
    header_text: "4.5:1 minimum"
    selected_row: "visible without color (checkmark)"
    sorted_column: "not color-only (icon)"

# Performance
performance:
  virtualization:
    row_buffer: 10
    scroll_debounce: "16ms (60fps)"
    measure_cache: true

  rendering:
    batch_updates: true
    concurrent_mode: "if React 18+"
    memo_cells: true

  data_handling:
    chunk_size: "1000 rows max per fetch"
    client_side_limit: "10000 rows"
    server_side_threshold: "when > 10000"

  resize_observer:
    enabled: true
    debounce: "100ms"

# Responsive Behavior
responsive:
  desktop:
    min_width: "1024px"
    horizontal_scroll: "if columns overflow"
    sticky_columns: "first 1-2 columns"

  tablet:
    min_width: "768px"
    max_width: "1023px"
    columns_visible: "reduced, show important"
    horizontal_scroll: true

  mobile:
    max_width: "767px"
    changes:
      - card_view: "optional, one card per row"
      - single_column_priority: true
      - expandable_rows: "tap to expand details"
      - horizontal_scroll: "with snap points"
      - sticky_first_column: true
      - touch_scroll: true

# Animation Timings
animations:
  row_hover:
    duration: "100ms"
    easing: "ease"

  sort_transition:
    duration: "200ms"
    style: "fade during reorder"

  filter_popover:
    duration: "150ms"
    style: "scale + fade"

  selection:
    duration: "100ms"
    style: "background color"

  column_resize:
    duration: "0ms"
    style: "immediate (no animation)"

  virtualization:
    recycle_animation: "none (instant for performance)"
