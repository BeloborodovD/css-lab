# UX Specification: Empty State Component
# Component: Empty State with Illustration and CTA
# Version: 1.0.0
# Created: 2025-11-23
# Agent: ux-ergonomics-specialist

component_id: "empty-state"
component_name: "Empty State"
category: "feedback"

# User Flows
user_flows:
  initial_empty_flow:
    name: "First Time Empty"
    steps:
      - step: 1
        action: "User visits empty section for first time"
        system_response: "Empty state displayed"
        feedback: "Welcoming illustration, helpful message, clear CTA"
      - step: 2
        action: "User clicks primary CTA"
        system_response: "Action initiated (create, add, etc.)"
        feedback: "Navigation or modal opens"

  search_no_results_flow:
    name: "Search No Results"
    steps:
      - step: 1
        action: "User searches with no matches"
        system_response: "No results empty state"
        feedback: "Search-specific illustration, suggestions"
      - step: 2
        action: "User clicks suggestion or modifies search"
        system_response: "New search executed"
        feedback: "Results update"

  error_empty_flow:
    name: "Error State"
    steps:
      - step: 1
        action: "Data fails to load"
        system_response: "Error empty state"
        feedback: "Error illustration, explanation, retry button"
      - step: 2
        action: "User clicks retry"
        system_response: "Data refetch attempted"
        feedback: "Loading state, then success or error"

  permission_denied_flow:
    name: "No Permission"
    steps:
      - step: 1
        action: "User lacks access to content"
        system_response: "Permission empty state"
        feedback: "Lock illustration, explanation, request access option"

# Interaction Patterns
interaction_patterns:
  container:
    layout: "centered flex column"
    max_width: "400px"
    padding: "40px 20px"
    text_align: "center"

  illustration:
    position: "top"
    size:
      default: "200x200px"
      compact: "120x120px"
    types:
      - svg_illustration: "preferred, themeable"
      - icon: "fallback, larger size"
      - lottie_animation: "optional, subtle loop"
    colors:
      - "use CSS custom properties"
      - "respect theme (light/dark)"

  title:
    font_size: "1.25rem (20px)"
    font_weight: "600"
    color: "var(--text-primary)"
    margin_top: "24px"
    max_lines: 2

  description:
    font_size: "0.875rem (14px)"
    color: "var(--text-secondary)"
    margin_top: "8px"
    max_lines: 3
    line_height: "1.5"

  primary_action:
    type: "button"
    variant: "primary"
    margin_top: "24px"
    min_width: "120px"

  secondary_action:
    type: "text link or secondary button"
    margin_top: "12px"
    color: "var(--text-secondary)"

  suggestions:
    position: "below description"
    margin_top: "16px"
    style: "bulleted list or chips"

# Variants
variants:
  no_data:
    illustration: "empty-box"
    title: "No items yet"
    description: "Get started by creating your first item."
    primary_action: "Create Item"

  no_search_results:
    illustration: "search-empty"
    title: "No results found"
    description: "Try adjusting your search or filters."
    suggestions:
      - "Check your spelling"
      - "Try broader search terms"
      - "Remove some filters"
    primary_action: "Clear Filters"

  error:
    illustration: "error-cloud"
    title: "Something went wrong"
    description: "We couldn't load this content. Please try again."
    primary_action: "Retry"
    secondary_action: "Contact Support"

  no_permission:
    illustration: "lock"
    title: "Access restricted"
    description: "You don't have permission to view this content."
    primary_action: "Request Access"
    secondary_action: "Go Back"

  offline:
    illustration: "offline-cloud"
    title: "You're offline"
    description: "Check your internet connection and try again."
    primary_action: "Retry"

  maintenance:
    illustration: "construction"
    title: "Under maintenance"
    description: "We're making improvements. Please check back soon."
    show_eta: true

  coming_soon:
    illustration: "rocket"
    title: "Coming soon"
    description: "This feature is under development."
    primary_action: "Notify Me"

  empty_inbox:
    illustration: "inbox-empty"
    title: "All caught up!"
    description: "You have no new messages."
    tone: "positive"

  no_notifications:
    illustration: "bell-off"
    title: "No notifications"
    description: "You're all caught up!"
    tone: "positive"

  empty_cart:
    illustration: "cart-empty"
    title: "Your cart is empty"
    description: "Browse our products and add items to your cart."
    primary_action: "Start Shopping"

# States
states:
  default:
    description: "Standard empty state"
    interactive: true

  loading:
    description: "Content loading"
    visual: "skeleton or spinner"
    show_empty_state: false

  error:
    description: "Error occurred"
    visual: "error variant"
    retry_enabled: true

  compact:
    description: "Space-constrained layout"
    visual:
      illustration_size: "120px"
      hide_description: "optional"

# Context-Aware Messaging
context_awareness:
  first_time_user:
    tone: "welcoming, encouraging"
    messaging: "onboarding-focused"
    cta: "get started action"

  returning_user:
    tone: "informative, efficient"
    messaging: "action-focused"
    cta: "direct action"

  filtered_empty:
    show_filter_count: true
    message: "No results match {n} active filters"
    cta: "Clear all filters"

  search_empty:
    show_query: true
    message: "No results for '{query}'"
    suggestions: true

# Accessibility Requirements (WCAG 2.1 AA)
accessibility:
  aria_roles:
    container: "region"
    illustration: "img (decorative: aria-hidden='true')"
    title: "heading"
    action_button: "button"

  aria_attributes:
    container:
      - "aria-label: Empty state description"
    illustration:
      - "aria-hidden: true (if decorative)"
      - "alt: descriptive text (if meaningful)"
    title:
      - "role: heading"
      - "aria-level: appropriate level (2 or 3)"

  focus_management:
    auto_focus: "primary action button (optional)"
    focus_order: "title → description → primary → secondary"

  announcements:
    on_mount: "announce title to screen readers"
    live_region: "aria-live='polite'"

  reduced_motion:
    preference: "prefers-reduced-motion: reduce"
    changes:
      - no_lottie_animation: "static frame"
      - no_illustration_animation: true

  color_contrast:
    title: "4.5:1 minimum"
    description: "4.5:1 minimum"
    button: "4.5:1 minimum"

# Illustration Guidelines
illustration_guidelines:
  style:
    - "consistent with brand"
    - "simple, not cluttered"
    - "single focal point"
    - "themeable colors"

  themes:
    light:
      primary: "var(--primary-color)"
      secondary: "var(--neutral-200)"
      background: "var(--neutral-50)"
    dark:
      primary: "var(--primary-color-light)"
      secondary: "var(--neutral-700)"
      background: "var(--neutral-800)"

  formats:
    preferred: "SVG (scalable, themeable)"
    alternative: "PNG with transparency"
    animated: "Lottie JSON (optional)"

  sizing:
    aspect_ratio: "1:1 or 4:3"
    max_file_size: "50KB (SVG), 100KB (PNG)"

# Responsive Behavior
responsive:
  desktop:
    min_width: "1024px"
    illustration_size: "200px"
    max_width: "400px"

  tablet:
    min_width: "768px"
    max_width: "1023px"
    illustration_size: "180px"
    max_width: "350px"

  mobile:
    max_width: "767px"
    changes:
      - illustration_size: "140px"
      - max_width: "100%"
      - padding: "24px 16px"
      - title_size: "1.125rem"
      - full_width_button: true

# Animation Timings
animations:
  illustration_enter:
    duration: "400ms"
    delay: "100ms"
    easing: "ease-out"
    style: "scale from 0.9 + fade"

  title_enter:
    duration: "300ms"
    delay: "200ms"
    style: "fade + slide up 10px"

  description_enter:
    duration: "300ms"
    delay: "300ms"
    style: "fade + slide up 10px"

  action_enter:
    duration: "300ms"
    delay: "400ms"
    style: "fade + slide up 10px"

  lottie_loop:
    play_once: false
    speed: 0.5
    loop_delay: "2s"

# Best Practices
best_practices:
  do:
    - "Use specific, actionable messaging"
    - "Provide clear next step"
    - "Match tone to context"
    - "Keep illustrations simple"
    - "Offer help or documentation link"

  dont:
    - "Use generic 'No data' messages"
    - "Leave user without action options"
    - "Use complex or distracting illustrations"
    - "Blame the user for empty state"
    - "Show technical error messages"

  messaging_examples:
    good:
      - "No projects yet. Create your first project to get started."
      - "No results for 'xyz'. Try different keywords."
    bad:
      - "No data."
      - "Error: null reference exception"
      - "Nothing here."
