# UX Specification: File Upload Component
# Component: File Upload with Drag & Drop
# Version: 1.0.0
# Created: 2025-11-23
# Agent: ux-ergonomics-specialist

component_id: "file-upload"
component_name: "File Upload"
category: "form-elements"

# User Flows
user_flows:
  primary_flow:
    name: "Drag & Drop Upload"
    steps:
      - step: 1
        action: "User drags file over drop zone"
        system_response: "Zone highlights with dashed border, color change"
        feedback: "Visual: border-color change, background highlight"
      - step: 2
        action: "User drops file"
        system_response: "File validation starts"
        feedback: "Zone returns to normal, progress indicator appears"
      - step: 3
        action: "Upload in progress"
        system_response: "File bytes transferred"
        feedback: "Progress bar with percentage, file name displayed"
      - step: 4
        action: "Upload completes"
        system_response: "Server confirms receipt"
        feedback: "Success state, preview thumbnail (if image), checkmark icon"

  secondary_flow:
    name: "Click to Browse"
    steps:
      - step: 1
        action: "User clicks drop zone or browse button"
        system_response: "Native file picker opens"
        feedback: "Focus ring on zone, cursor: pointer"
      - step: 2
        action: "User selects file(s)"
        system_response: "File picker closes, validation starts"
        feedback: "Selected files appear in queue"
      - step: 3
        action: "Confirm selection"
        system_response: "Upload begins"
        feedback: "Progress indicators per file"

  error_flow:
    name: "Validation Error"
    steps:
      - step: 1
        action: "User drops invalid file"
        system_response: "Validation fails"
        feedback: "Error message, red border, shake animation"
      - step: 2
        action: "User acknowledges error"
        system_response: "Zone resets to idle"
        feedback: "Clear error on new interaction"

# Interaction Patterns
interaction_patterns:
  drop_zone:
    default:
      cursor: "pointer"
      border: "2px dashed var(--border-color)"
      background: "transparent"
    hover:
      border: "2px dashed var(--primary-color)"
      background: "var(--primary-color-alpha-10)"
    dragover:
      border: "2px solid var(--primary-color)"
      background: "var(--primary-color-alpha-20)"
      transform: "scale(1.02)"
    disabled:
      cursor: "not-allowed"
      opacity: "0.5"

  file_item:
    layout: "horizontal"
    elements:
      - thumbnail_or_icon: "40x40px"
      - file_info:
          - name: "truncate with ellipsis at 200px"
          - size: "formatted (KB, MB)"
      - progress_bar: "when uploading"
      - actions:
          - remove: "icon button, always visible"
          - retry: "on error only"

  progress_indicator:
    type: "linear progress bar"
    height: "4px"
    colors:
      uploading: "var(--primary-color)"
      success: "var(--success-color)"
      error: "var(--error-color)"
    animation: "smooth transition, 200ms ease-out"

# States
states:
  idle:
    description: "Ready for file input"
    visual:
      icon: "upload-cloud"
      text: "Drag files here or click to browse"
      subtext: "Supported formats: JPG, PNG, PDF (max 10MB)"
    aria_label: "File upload drop zone. Click to browse or drag files here."

  dragover:
    description: "File hovering over zone"
    visual:
      icon: "upload-cloud (animated)"
      text: "Drop to upload"
      border: "solid primary"
    aria_live: "polite"
    announcement: "Drop zone active. Release to upload file."

  uploading:
    description: "File transfer in progress"
    visual:
      progress_bar: true
      percentage: true
      cancel_button: true
    aria_live: "polite"
    announcement: "Uploading {filename}, {percentage}% complete"

  success:
    description: "Upload completed"
    visual:
      icon: "check-circle"
      preview: "thumbnail if image"
      remove_button: true
    aria_live: "assertive"
    announcement: "File {filename} uploaded successfully"
    duration: "persistent until removed"

  error:
    description: "Upload or validation failed"
    visual:
      icon: "alert-circle"
      border_color: "var(--error-color)"
      message: "specific error text"
      retry_button: true
    aria_live: "assertive"
    announcement: "Error uploading {filename}: {error_message}"

# Keyboard Navigation
keyboard:
  tab:
    action: "Focus drop zone"
    from: "previous focusable element"

  enter:
    action: "Open file picker"
    context: "when drop zone focused"

  space:
    action: "Open file picker"
    context: "when drop zone focused"

  escape:
    action: "Cancel current upload"
    context: "during upload"

  delete:
    action: "Remove focused file"
    context: "when file item focused"

  arrow_up_down:
    action: "Navigate between uploaded files"
    context: "in file list"

# Accessibility Requirements (WCAG 2.1 AA)
accessibility:
  aria_roles:
    drop_zone: "button"
    file_list: "list"
    file_item: "listitem"
    progress: "progressbar"

  aria_attributes:
    drop_zone:
      - "aria-label: descriptive label"
      - "aria-describedby: format/size hints"
    progress:
      - "aria-valuenow: current percentage"
      - "aria-valuemin: 0"
      - "aria-valuemax: 100"
      - "aria-label: uploading filename"
    file_item:
      - "aria-label: filename and status"

  focus_management:
    after_upload: "Move focus to first file in list"
    after_remove: "Move focus to next file or drop zone"
    after_error: "Keep focus on error message"

  announcements:
    live_region: "aria-live='polite'"
    events:
      - upload_start: "Uploading {n} file(s)"
      - upload_progress: "{percentage}% uploaded"
      - upload_complete: "Upload complete: {filename}"
      - upload_error: "Upload failed: {error}"
      - file_removed: "File removed: {filename}"

  reduced_motion:
    preference: "prefers-reduced-motion: reduce"
    changes:
      - disable_shimmer: true
      - disable_scale_transform: true
      - instant_transitions: true

  color_contrast:
    text: "4.5:1 minimum"
    icons: "3:1 minimum"
    borders: "3:1 minimum"
    error_states: "Not color-only, include icon"

# Validation Rules
validation:
  file_types:
    config: "accept attribute or JavaScript check"
    feedback: "Immediate error on invalid type"
    message_template: "File type not supported. Allowed: {formats}"

  file_size:
    config: "maxSize in bytes"
    feedback: "Immediate error before upload"
    message_template: "File too large. Maximum size: {maxSize}"

  file_count:
    config: "maxFiles number"
    feedback: "Prevent additional files"
    message_template: "Maximum {n} files allowed"

# Responsive Behavior
responsive:
  desktop:
    min_width: "1024px"
    layout: "full drop zone with side preview"
    drop_zone_height: "200px"

  tablet:
    min_width: "768px"
    max_width: "1023px"
    layout: "full width drop zone"
    drop_zone_height: "180px"

  mobile:
    max_width: "767px"
    layout: "compact zone, stack files below"
    drop_zone_height: "120px"
    changes:
      - hide_drag_text: true
      - show_tap_text: "Tap to upload"
      - full_width_buttons: true

# Animation Timings
animations:
  dragover_highlight:
    duration: "150ms"
    easing: "ease-out"

  progress_update:
    duration: "200ms"
    easing: "linear"

  success_checkmark:
    duration: "300ms"
    easing: "ease-in-out"
    style: "scale + fade in"

  error_shake:
    duration: "400ms"
    style: "horizontal shake"
    keyframes: "translateX(-5px, 5px, -5px, 5px, 0)"

  file_item_enter:
    duration: "200ms"
    style: "fade + slide down"

  file_item_exit:
    duration: "150ms"
    style: "fade + slide up"
