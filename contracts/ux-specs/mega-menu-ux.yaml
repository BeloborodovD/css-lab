# UX Specification: Mega Menu Component
# Component: Mega Menu with Multi-column Layout
# Version: 1.0.0
# Created: 2025-11-23
# Agent: ux-ergonomics-specialist

component_id: "mega-menu"
component_name: "Mega Menu"
category: "navigation"

# User Flows
user_flows:
  hover_navigation_flow:
    name: "Desktop Hover Navigation"
    steps:
      - step: 1
        action: "User hovers over menu trigger"
        system_response: "Delay timer starts (150ms)"
        feedback: "Trigger highlight"
      - step: 2
        action: "Hover continues past delay"
        system_response: "Mega menu opens"
        feedback: "Panel slides down/fades in"
      - step: 3
        action: "User moves mouse into menu"
        system_response: "Menu stays open"
        feedback: "Hover state maintained"
      - step: 4
        action: "User clicks link"
        system_response: "Navigation occurs"
        feedback: "Menu closes, page navigates"
      - step: 5
        action: "User moves mouse away"
        system_response: "Close delay starts (300ms)"
        feedback: "Menu closes smoothly"

  click_navigation_flow:
    name: "Mobile/Click Navigation"
    steps:
      - step: 1
        action: "User taps/clicks menu trigger"
        system_response: "Menu expands (accordion)"
        feedback: "Chevron rotates, content reveals"
      - step: 2
        action: "User taps category"
        system_response: "Sub-items shown"
        feedback: "Drill-down or expand"
      - step: 3
        action: "User taps final link"
        system_response: "Navigation occurs"
        feedback: "Menu closes"

  keyboard_navigation_flow:
    name: "Keyboard Navigation"
    steps:
      - step: 1
        action: "User tabs to menu trigger"
        system_response: "Trigger focused"
        feedback: "Focus ring visible"
      - step: 2
        action: "User presses Enter or Down arrow"
        system_response: "Menu opens, first item focused"
        feedback: "Focus moves into menu"
      - step: 3
        action: "User navigates with arrow keys"
        system_response: "Focus moves between items"
        feedback: "Clear focus indication"

# Interaction Patterns
interaction_patterns:
  trigger:
    type: "nav item in header"
    states:
      default:
        background: "transparent"
      hover:
        background: "var(--neutral-100)"
        delay: "150ms before menu opens"
      active:
        background: "var(--neutral-200)"
        indicator: "underline or chevron rotated"
      focused:
        outline: "2px solid var(--primary-color)"

  menu_panel:
    position: "below header, full width or contained"
    width: "full viewport width or max-width container"
    background: "white"
    shadow: "0 8px 16px rgba(0,0,0,0.1)"
    border_top: "1px solid var(--border-color)"
    padding: "24px 40px"

  layout_options:
    columns:
      count: "2-5 columns based on content"
      width: "equal or varied"
      gap: "40px"
    featured:
      position: "right side"
      content: "featured product/promo image"

  category_section:
    header:
      font_size: "0.875rem"
      font_weight: "600"
      text_transform: "uppercase"
      color: "var(--text-muted)"
      margin_bottom: "12px"
      icon: "optional, 20x20px"

  menu_item:
    padding: "8px 0"
    elements:
      icon: "optional, 20x20px left"
      label: "primary text"
      description: "optional secondary text"
      badge: "optional (new, popular)"
    states:
      default:
        color: "var(--text-primary)"
      hover:
        color: "var(--primary-color)"
        background: "var(--neutral-50)"
      focused:
        outline: "2px solid var(--primary-color)"
        outline_offset: "2px"

  featured_section:
    layout: "image + title + description + CTA"
    width: "250-300px"
    background: "var(--neutral-50)"
    border_radius: "8px"
    padding: "16px"

  delay_behavior:
    open_delay: "150ms"
    close_delay: "300ms"
    intent_detection: "diagonal movement detection"
    purpose: "prevent accidental open/close"

# States
states:
  closed:
    description: "Menu not visible"
    trigger_state: "default"
    aria_expanded: "false"

  opening:
    description: "Delay timer active"
    visual: "trigger highlighted"

  open:
    description: "Menu visible"
    aria_expanded: "true"
    focus: "on trigger or first menu item"

  closing:
    description: "Close delay active"
    visual: "menu still visible"
    can_cancel: "mouse re-entry cancels close"

# Keyboard Navigation
keyboard:
  trigger:
    enter:
      action: "Open menu, focus first item"
    space:
      action: "Open menu, focus first item"
    arrow_down:
      action: "Open menu, focus first item"
    escape:
      action: "Close menu (if open)"

  menu:
    arrow_down:
      action: "Move to next item in column"
    arrow_up:
      action: "Move to previous item in column"
    arrow_right:
      action: "Move to next column (same row)"
    arrow_left:
      action: "Move to previous column (same row)"
    home:
      action: "Move to first item"
    end:
      action: "Move to last item"
    enter:
      action: "Activate link"
    escape:
      action: "Close menu, focus trigger"
    tab:
      action: "Move to next focusable (may exit menu)"

  navigation_bar:
    arrow_right:
      action: "Move to next nav item (close current menu)"
    arrow_left:
      action: "Move to previous nav item (close current menu)"

# Accessibility Requirements (WCAG 2.1 AA)
accessibility:
  aria_roles:
    trigger: "button"
    menu_panel: "dialog or menu"
    category_header: "heading"
    menu_item: "menuitem or link"

  aria_attributes:
    trigger:
      - "aria-haspopup: true"
      - "aria-expanded: true/false"
      - "aria-controls: menu panel id"
    menu_panel:
      - "aria-label: Menu name"
    category:
      - "role: group"
      - "aria-labelledby: category header id"

  focus_management:
    open: "Focus first menu item or search input"
    close: "Return focus to trigger"
    trap_focus: false
    roving_tabindex: true

  announcements:
    live_region: "aria-live='polite'"
    events:
      - open: "{menu name} menu open"
      - close: "{menu name} menu closed"
      - navigation: "{item label}"

  reduced_motion:
    preference: "prefers-reduced-motion: reduce"
    changes:
      - no_slide_animation: true
      - instant_open_close: true

  color_contrast:
    text: "4.5:1 minimum"
    category_headers: "4.5:1 minimum"
    hover_state: "visible without color"

  touch_targets:
    minimum_size: "44x44px on mobile"
    spacing: "8px minimum between targets"

# Responsive Behavior
responsive:
  desktop:
    min_width: "1024px"
    layout: "mega menu panel"
    trigger: "hover with delay"
    columns: "3-5"

  tablet:
    min_width: "768px"
    max_width: "1023px"
    layout: "mega menu panel (narrower)"
    trigger: "hover or click"
    columns: "2-3"

  mobile:
    max_width: "767px"
    changes:
      - accordion_fallback: true
      - hamburger_trigger: true
      - full_screen_drawer: true
      - slide_from_left_or_right: true
      - single_column: true
      - back_button: "for drill-down navigation"
      - close_button: "visible in header"
      - touch_optimized: true

  mobile_patterns:
    accordion:
      description: "Categories expand/collapse in place"
      animation: "slide down"
    drill_down:
      description: "Categories slide in from right"
      back_navigation: "chevron left + category name"

# Animation Timings
animations:
  panel_open:
    duration: "200ms"
    easing: "ease-out"
    style: "slide down + fade"
    origin: "top"

  panel_close:
    duration: "150ms"
    easing: "ease-in"
    style: "slide up + fade"

  item_hover:
    duration: "100ms"
    style: "background color"

  mobile_slide:
    duration: "250ms"
    easing: "ease-in-out"
    style: "slide from edge"

  accordion_expand:
    duration: "200ms"
    easing: "ease-out"
    style: "height auto animation"

# Content Guidelines
content_guidelines:
  category_limit: "5-7 categories per menu"
  items_per_category: "5-10 items"
  nesting_depth: "2 levels maximum"

  naming:
    categories: "short, descriptive nouns"
    items: "action-oriented or descriptive"

  organization:
    primary_items: "left columns"
    secondary_items: "right columns"
    featured: "rightmost or bottom"

  visual_hierarchy:
    category_headers: "prominent, styled differently"
    primary_links: "larger, bolder"
    secondary_links: "smaller, lighter"
