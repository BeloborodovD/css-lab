# Mobile Gesture Support UX Specification
# CSS Lab - Style Library
# Created: 2025-11-23
# Agent: ux-ergonomics-specialist

spec_id: "mobile-gesture-support-001"
spec_type: "ux_specification"
category: "mobile_optimization"

# Overview
overview:
  name: "Mobile Gesture Support"
  description: |
    CSS and JavaScript patterns for touch gesture interactions.
    Enables swipe, long press, pull-to-refresh, and other mobile gestures.
  when_to_use:
    - "Mobile and tablet interfaces"
    - "Touch-enabled web applications"
    - "Progressive Web Apps (PWAs)"
    - "Hybrid mobile applications"

# Horizontal Swipe Gestures
swipe_horizontal:
  name: "Horizontal Swipe Gestures"
  description: |
    Left/right swipe actions for navigation, deletion, and content browsing.

  use_cases:
    carousel_slider:
      description: "Browse through images or cards"
      trigger: "Swipe left/right"
      css_support:
        - "scroll-snap-type: x mandatory"
        - "overflow-x: auto"
        - "scroll-behavior: smooth"

    swipe_to_delete:
      description: "Reveal delete action on list item"
      trigger: "Swipe left (RTL: right)"
      reveal_distance: "80px"
      action_button_width: "80px"
      css_support:
        - "transform: translateX()"
        - "transition: transform 200ms"
        - "overflow: hidden"

    swipe_to_action:
      description: "Reveal multiple actions (archive, share, etc.)"
      trigger: "Swipe in either direction"
      action_zone_width: "160px (2 actions)"
      css_support:
        - "position: relative"
        - "transform: translateX()"

    tab_navigation:
      description: "Switch between tab content"
      trigger: "Swipe left/right on content area"
      css_support:
        - "scroll-snap-type: x mandatory"
        - "touch-action: pan-x"

  specifications:
    min_swipe_distance: "30px"
    swipe_velocity_threshold: "0.3px/ms"
    animation_duration: "200ms"
    easing: "ease-out"

  css_implementation:
    carousel: |
      .carousel {
        display: flex;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .carousel::-webkit-scrollbar {
        display: none;
      }

      .carousel-item {
        flex-shrink: 0;
        width: 100%;
        scroll-snap-align: start;
      }

      /* Optional: Center snapping */
      .carousel--center .carousel-item {
        scroll-snap-align: center;
      }

    swipe_to_delete: |
      .swipe-item {
        position: relative;
        overflow: hidden;
      }

      .swipe-item-content {
        position: relative;
        background: var(--surface-color);
        transform: translateX(0);
        transition: transform 200ms ease-out;
        z-index: 1;
      }

      .swipe-item-content.swiping {
        transition: none; /* Remove during active swipe */
      }

      .swipe-item-actions {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        z-index: 0;
      }

      .swipe-action {
        width: 80px;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
      }

      .swipe-action--delete {
        background: var(--error-color);
      }

      .swipe-action--archive {
        background: var(--warning-color);
      }

      /* Revealed state */
      .swipe-item-content.revealed {
        transform: translateX(-80px);
      }

      .swipe-item-content.revealed-full {
        transform: translateX(-160px);
      }

    tab_swipe: |
      .tab-content-container {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
        touch-action: pan-x;
      }

      .tab-content-container::-webkit-scrollbar {
        display: none;
      }

      .tab-content-panel {
        flex-shrink: 0;
        width: 100%;
        scroll-snap-align: start;
      }

  dark_theme:
    swipe_content_bg: "var(--surface-dark)"
    delete_action_bg: "#DC2626"
    archive_action_bg: "#D97706"

# Vertical Swipe Gestures
swipe_vertical:
  name: "Vertical Swipe Gestures"
  description: |
    Up/down swipe actions for pull-to-refresh, dismiss, and scrolling.

  use_cases:
    pull_to_refresh:
      description: "Refresh content by pulling down"
      trigger: "Pull down at top of scroll container"
      activation_threshold: "80px"
      css_support:
        - "overscroll-behavior-y: contain"
        - "touch-action: pan-y"

    dismiss_bottom_sheet:
      description: "Close bottom sheet by swiping down"
      trigger: "Swipe down on drag handle"
      dismiss_threshold: "30% of sheet height"
      css_support:
        - "transform: translateY()"
        - "transition: transform 300ms"

    vertical_scroll_snap:
      description: "Full-page vertical scrolling"
      trigger: "Vertical scroll/swipe"
      css_support:
        - "scroll-snap-type: y mandatory"
        - "scroll-behavior: smooth"

    dismiss_notification:
      description: "Swipe up/down to dismiss"
      trigger: "Vertical swipe on notification"
      threshold: "50px"

  specifications:
    pull_refresh_threshold: "80px"
    pull_refresh_max: "120px"
    dismiss_threshold_percent: "30%"
    animation_duration: "300ms"

  css_implementation:
    pull_to_refresh: |
      .ptr-container {
        position: relative;
        overscroll-behavior-y: contain;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .ptr-indicator {
        position: absolute;
        top: -60px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 150ms, transform 150ms;
      }

      .ptr-container.pulling .ptr-indicator {
        opacity: 1;
        transform: translateX(-50%) translateY(var(--pull-distance, 0));
      }

      .ptr-container.refreshing .ptr-indicator {
        opacity: 1;
        transform: translateX(-50%) translateY(80px);
      }

      .ptr-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid var(--primary-color);
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 800ms linear infinite;
      }

      .ptr-arrow {
        width: 24px;
        height: 24px;
        transition: transform 150ms;
      }

      .ptr-container.ready .ptr-arrow {
        transform: rotate(180deg);
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

    bottom_sheet_dismiss: |
      .bottom-sheet {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--surface-color);
        border-radius: 16px 16px 0 0;
        transform: translateY(100%);
        transition: transform 300ms ease-out;
        touch-action: none; /* Handle via JS */
        z-index: 1200;
      }

      .bottom-sheet.open {
        transform: translateY(0);
      }

      .bottom-sheet.dragging {
        transition: none;
      }

      .bottom-sheet-drag-handle {
        width: 100%;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        touch-action: none;
      }

      .bottom-sheet-drag-bar {
        width: 40px;
        height: 4px;
        background: var(--border-color);
        border-radius: 2px;
      }

      /* Snap points */
      .bottom-sheet--half {
        transform: translateY(50%);
      }

      .bottom-sheet--quarter {
        transform: translateY(75%);
      }

    vertical_scroll_snap: |
      .fullpage-scroll {
        height: 100vh;
        overflow-y: auto;
        scroll-snap-type: y mandatory;
        scroll-behavior: smooth;
        overscroll-behavior-y: contain;
      }

      .fullpage-section {
        height: 100vh;
        scroll-snap-align: start;
      }

  dark_theme:
    sheet_bg: "var(--surface-dark)"
    drag_bar_color: "var(--border-dark)"
    spinner_color: "var(--primary-light)"

# Long Press Gestures
long_press:
  name: "Long Press Gestures"
  description: |
    Touch and hold interactions for context menus and special actions.

  use_cases:
    context_menu:
      description: "Show contextual actions"
      trigger: "Touch and hold 500ms"
      haptic_feedback: "light impact"
      css_support:
        - "user-select: none"
        - "-webkit-touch-callout: none"

    multi_select_mode:
      description: "Enter selection mode in lists"
      trigger: "Long press on item"
      visual_feedback: "Scale + selection indicator"
      css_support:
        - "transform: scale()"
        - "transition: transform 200ms"

    drag_and_drop:
      description: "Initiate item dragging"
      trigger: "Long press then drag"
      lift_elevation: "8dp"
      css_support:
        - "user-select: none"
        - "touch-action: none"

    preview_peek:
      description: "Preview content without navigating"
      trigger: "Long press on link/card"
      show_after: "500ms"

  specifications:
    long_press_duration: "500ms"
    visual_feedback_start: "100ms"
    cancel_on_move: "10px threshold"

  css_implementation:
    context_menu: |
      .long-press-target {
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
      }

      .long-press-target.pressing {
        transform: scale(0.98);
        transition: transform 100ms ease-out;
      }

      .long-press-target.activated {
        transform: scale(1);
        background: var(--selected-bg);
      }

      /* Context menu */
      .context-menu {
        position: fixed;
        min-width: 200px;
        background: var(--surface-color);
        border-radius: 8px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        z-index: 1300;
        overflow: hidden;
        transform-origin: top left;
        animation: contextMenuIn 150ms ease-out;
      }

      @keyframes contextMenuIn {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .context-menu-item {
        height: 48px;
        padding: 0 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
      }

      .context-menu-item:active {
        background: var(--ripple-color);
      }

    multi_select: |
      .list-item {
        position: relative;
        transition: transform 200ms ease-out, background 200ms;
      }

      .list-item.selecting {
        transform: scale(0.98);
      }

      .list-item.selected {
        background: var(--selected-bg);
      }

      .list-item-checkbox {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%) scale(0);
        transition: transform 200ms ease-out;
      }

      .list--select-mode .list-item-checkbox {
        transform: translateY(-50%) scale(1);
      }

      .list--select-mode .list-item-content {
        padding-left: 56px;
      }

    drag_and_drop: |
      .draggable-item {
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        transition: transform 200ms, box-shadow 200ms;
      }

      .draggable-item.dragging {
        transform: scale(1.02);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        z-index: 100;
        opacity: 0.9;
      }

      .draggable-item.drag-placeholder {
        opacity: 0.3;
        pointer-events: none;
      }

      .drop-zone {
        transition: background 150ms;
      }

      .drop-zone.drag-over {
        background: var(--primary-color-10);
      }

  dark_theme:
    context_menu_bg: "var(--surface-dark-elevated)"
    context_menu_shadow: "0 8px 32px rgba(0, 0, 0, 0.4)"
    selected_bg: "var(--primary-color-20)"

# Pull-to-Refresh Pattern
pull_to_refresh:
  name: "Pull-to-Refresh"
  description: |
    Standard pattern for refreshing content by pulling down.

  when_to_use:
    - "Feed/timeline content"
    - "List views with server data"
    - "News articles or social content"
    - "Email inbox"

  specifications:
    threshold: "80px"
    max_pull: "120px"
    indicator_size: "40px"
    refresh_duration: "min 1s, max 10s"

  states:
    idle:
      indicator: "hidden"
      pull_allowed: true

    pulling:
      indicator: "arrow pointing down"
      progress: "based on pull distance"
      haptic: "none"

    ready:
      indicator: "arrow pointing up (rotated)"
      text: "Release to refresh"
      haptic: "selection (if available)"

    refreshing:
      indicator: "spinner"
      text: "Refreshing..."
      haptic: "impact light"

    complete:
      indicator: "checkmark"
      text: "Updated"
      duration: "500ms before hiding"

  css_implementation:
    base: |
      .ptr-wrapper {
        position: relative;
        overflow: hidden;
      }

      .ptr-content {
        overscroll-behavior-y: contain;
        overflow-y: auto;
        height: 100%;
      }

      .ptr-indicator-container {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        overflow: hidden;
        transition: height 300ms ease-out;
      }

      .ptr-wrapper.pulling .ptr-indicator-container,
      .ptr-wrapper.refreshing .ptr-indicator-container {
        height: var(--ptr-height, 80px);
      }

      .ptr-indicator {
        width: 40px;
        height: 40px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .ptr-icon {
        width: 24px;
        height: 24px;
        transition: transform 200ms ease-out;
      }

      .ptr-wrapper.ready .ptr-icon {
        transform: rotate(180deg);
      }

      .ptr-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid var(--primary-color);
        border-top-color: transparent;
        border-radius: 50%;
        animation: ptr-spin 800ms linear infinite;
      }

      @keyframes ptr-spin {
        to { transform: rotate(360deg); }
      }

      .ptr-text {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 4px;
      }

  dark_theme:
    indicator_color: "var(--primary-light)"
    text_color: "var(--text-secondary-dark)"

# CSS Properties for Gesture Support
css_properties:
  name: "CSS Properties for Touch Gestures"
  description: |
    CSS properties that enable and control touch gesture behavior.

  touch_action:
    description: "Controls which touch gestures the browser handles"
    values:
      auto: "Browser handles all gestures (default)"
      none: "No gestures handled by browser (JS handles all)"
      pan_x: "Only horizontal panning"
      pan_y: "Only vertical panning"
      pan_left: "Only pan to the left"
      pan_right: "Only pan to the right"
      pan_up: "Only pan up"
      pan_down: "Only pan down"
      pinch_zoom: "Allow pinch zoom"
      manipulation: "Panning and pinch zoom, but faster (no 300ms delay)"

    examples: |
      /* Standard scrollable content */
      .scrollable {
        touch-action: pan-y;
      }

      /* Horizontal carousel */
      .carousel {
        touch-action: pan-x;
      }

      /* Button (no scroll, no zoom delay) */
      .btn {
        touch-action: manipulation;
      }

      /* Custom gesture handling */
      .custom-gesture-area {
        touch-action: none;
      }

      /* Allow pinch zoom on images */
      .zoomable-image {
        touch-action: pinch-zoom;
      }

  user_select:
    description: "Controls text selection behavior"
    values:
      none: "Text cannot be selected"
      text: "Text can be selected"
      all: "Entire element selected on click"
      auto: "Default behavior"

    examples: |
      /* Prevent selection during drag */
      .draggable {
        user-select: none;
        -webkit-user-select: none;
      }

      /* Allow text selection in content */
      .content {
        user-select: text;
      }

  webkit_touch_callout:
    description: "iOS: Controls the callout menu on long press"
    values:
      default: "Shows system callout"
      none: "Disables callout"

    examples: |
      /* Disable iOS callout menu */
      .no-callout {
        -webkit-touch-callout: none;
      }

  webkit_tap_highlight:
    description: "Controls tap highlight color on mobile WebKit"
    values:
      color: "Any color value"
      transparent: "No highlight"

    examples: |
      /* Remove default tap highlight */
      button, a {
        -webkit-tap-highlight-color: transparent;
      }

      /* Custom tap highlight */
      .custom-highlight {
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0.1);
      }

  overscroll_behavior:
    description: "Controls behavior when scrolling past boundaries"
    values:
      auto: "Default overscroll (pull-to-refresh, rubber band)"
      contain: "No scroll chaining, no navigation"
      none: "No overscroll, no navigation"

    examples: |
      /* Prevent pull-to-refresh on custom implementation */
      .custom-ptr-container {
        overscroll-behavior-y: contain;
      }

      /* Prevent scroll chaining in modals */
      .modal-content {
        overscroll-behavior: contain;
      }

      /* Prevent back/forward navigation on horizontal scroll */
      .horizontal-scroll {
        overscroll-behavior-x: contain;
      }

  scroll_snap:
    description: "Creates snap points for smooth scrolling"
    properties:
      scroll_snap_type: "x/y mandatory/proximity"
      scroll_snap_align: "start/center/end"
      scroll_padding: "Offset from container edge"

    examples: |
      /* Horizontal carousel with snap */
      .carousel {
        scroll-snap-type: x mandatory;
        overflow-x: auto;
        scroll-behavior: smooth;
        scroll-padding: 16px; /* Account for padding */
      }

      .carousel-item {
        scroll-snap-align: start;
      }

      /* Full-page vertical scroll */
      .fullpage {
        scroll-snap-type: y mandatory;
        overflow-y: auto;
        height: 100vh;
      }

      .fullpage-section {
        scroll-snap-align: start;
        height: 100vh;
      }

# Implementation Notes
implementation_notes:
  browser_support:
    - "Test touch-action across browsers"
    - "Safari requires -webkit prefixes for some properties"
    - "Firefox has different overscroll behavior"

  performance:
    - "Use passive event listeners for scroll/touch events"
    - "Avoid expensive operations during gesture"
    - "Use CSS transforms for animations (GPU accelerated)"
    - "Debounce gesture end callbacks"

  accessibility:
    - "Provide alternative to gesture-only actions"
    - "Ensure swipe-to-delete has button alternative"
    - "Long press should have menu button alternative"
    - "Announce gesture results to screen readers"

  best_practices:
    - "Always provide visual feedback during gestures"
    - "Use consistent gesture patterns across app"
    - "Respect system gesture areas (edge swipes)"
    - "Test with real devices, not just emulators"
    - "Consider users with motor impairments"
