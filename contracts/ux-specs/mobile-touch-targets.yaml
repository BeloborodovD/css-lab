# Mobile Touch Targets UX Specification
# CSS Lab - Style Library
# Created: 2025-11-23
# Agent: ux-ergonomics-specialist

spec_id: "mobile-touch-targets-001"
spec_type: "ux_specification"
category: "mobile_optimization"

# Overview
overview:
  name: "Mobile Touch Targets"
  description: |
    Specification for touch-friendly interactive element sizing.
    Ensures all tappable elements meet accessibility standards and
    provide comfortable touch targets for finger-based interaction.
  when_to_use:
    - "Any interactive element on touch devices"
    - "Buttons, links, checkboxes, dropdowns"
    - "Mobile-first responsive designs"
    - "Hybrid web/mobile applications"

# Global Standards
global_standards:
  minimum_touch_target:
    width: "44px"
    height: "44px"
    note: "Apple HIG and WCAG 2.1 minimum"

  recommended_touch_target:
    width: "48px"
    height: "48px"
    note: "Material Design recommendation"

  minimum_spacing:
    between_targets: "8px"
    recommended_spacing: "12px"
    dense_mode_spacing: "4px"
    note: "Prevents accidental taps on adjacent elements"

# Component-Specific Measurements
components:

  buttons:
    name: "Buttons"
    description: "Primary, secondary, and tertiary button touch targets"

    primary_button:
      min_height: "48px"
      min_width: "88px"
      padding_horizontal: "24px"
      padding_vertical: "12px"
      full_width_mobile: true
      note: "Primary actions should have largest touch targets"

    secondary_button:
      min_height: "44px"
      min_width: "64px"
      padding_horizontal: "16px"
      padding_vertical: "10px"

    icon_button:
      min_size: "44px"
      icon_size: "24px"
      padding: "10px"
      note: "Icon centered within touch target"

    fab_button:
      size: "56px"
      icon_size: "24px"
      mini_size: "40px"
      note: "Floating action button, elevated"

    css_implementation:
      base: |
        .btn {
          min-height: 44px;
          min-width: 64px;
          padding: 10px 16px;
          touch-action: manipulation;
        }

        .btn-primary {
          min-height: 48px;
          padding: 12px 24px;
        }

        @media (max-width: 768px) {
          .btn-primary {
            width: 100%;
          }
        }

        .btn-icon {
          width: 44px;
          height: 44px;
          padding: 10px;
        }

  chips:
    name: "Chips / Tags"
    description: "Selectable and removable chips"

    selectable_chip:
      min_height: "32px"
      min_touch_height: "44px"
      padding_horizontal: "12px"
      note: "Visual height can be smaller than touch target"

    removable_chip:
      min_height: "32px"
      remove_button_size: "44px"
      remove_icon_size: "18px"
      chip_padding_right: "8px"

    input_chip:
      min_height: "32px"
      touch_padding: "6px 0"
      note: "Add invisible padding for touch target"

    css_implementation:
      base: |
        .chip {
          min-height: 32px;
          padding: 6px 12px;
          position: relative;
        }

        /* Expand touch target with pseudo-element */
        .chip::before {
          content: '';
          position: absolute;
          top: 50%;
          left: 0;
          right: 0;
          height: 44px;
          transform: translateY(-50%);
        }

        .chip-remove {
          width: 44px;
          height: 44px;
          margin: -6px -12px -6px 4px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

  checkboxes_radios:
    name: "Checkboxes and Radio Buttons"
    description: "Form selection controls"

    checkbox:
      visual_size: "20px"
      touch_target: "44px"
      label_gap: "12px"
      row_height: "48px"

    radio:
      visual_size: "20px"
      touch_target: "44px"
      label_gap: "12px"
      row_height: "48px"

    switch_toggle:
      track_width: "52px"
      track_height: "32px"
      thumb_size: "28px"
      touch_target: "48px"

    css_implementation:
      base: |
        .checkbox-wrapper,
        .radio-wrapper {
          min-height: 48px;
          display: flex;
          align-items: center;
          padding: 4px 0;
        }

        .checkbox-input,
        .radio-input {
          width: 44px;
          height: 44px;
          position: relative;
        }

        .checkbox-input::after,
        .radio-input::after {
          content: '';
          width: 20px;
          height: 20px;
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          /* visual checkbox styles */
        }

  dropdown_items:
    name: "Dropdown and List Items"
    description: "Selectable items in dropdowns, menus, lists"

    dropdown_option:
      min_height: "48px"
      padding_horizontal: "16px"
      padding_vertical: "12px"

    menu_item:
      min_height: "48px"
      icon_size: "24px"
      icon_margin_right: "16px"
      padding_horizontal: "16px"

    list_item:
      min_height: "56px"
      single_line: "48px"
      two_line: "72px"
      three_line: "88px"
      padding_horizontal: "16px"

    css_implementation:
      base: |
        .dropdown-option,
        .menu-item {
          min-height: 48px;
          padding: 12px 16px;
          display: flex;
          align-items: center;
        }

        .list-item {
          min-height: 56px;
          padding: 8px 16px;
        }

        .list-item--single {
          min-height: 48px;
        }

        .list-item--two-line {
          min-height: 72px;
        }

  date_picker_days:
    name: "Date Picker Calendar Days"
    description: "Individual day cells in calendar views"

    day_cell:
      min_size: "44px"
      recommended_size: "48px"
      font_size: "14px"
      selected_indicator: "36px"
      note: "Cell contains visual indicator smaller than touch target"

    month_nav_button:
      min_size: "44px"
      icon_size: "24px"

    year_selector:
      min_height: "48px"
      padding: "12px 16px"

    css_implementation:
      base: |
        .calendar-day {
          width: 44px;
          height: 44px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 14px;
        }

        @media (min-width: 400px) {
          .calendar-day {
            width: 48px;
            height: 48px;
          }
        }

        .calendar-day-inner {
          width: 36px;
          height: 36px;
          border-radius: 50%;
        }

  combobox_options:
    name: "Combobox / Autocomplete Options"
    description: "Searchable dropdown option items"

    option_item:
      min_height: "48px"
      padding_horizontal: "16px"
      padding_vertical: "12px"

    option_with_avatar:
      min_height: "56px"
      avatar_size: "40px"
      avatar_margin_right: "16px"

    option_with_checkbox:
      min_height: "48px"
      checkbox_size: "44px"
      checkbox_visual: "20px"

    css_implementation:
      base: |
        .combobox-option {
          min-height: 48px;
          padding: 12px 16px;
          display: flex;
          align-items: center;
        }

        .combobox-option--with-avatar {
          min-height: 56px;
        }

        .combobox-option .avatar {
          width: 40px;
          height: 40px;
          margin-right: 16px;
        }

  notification_items:
    name: "Notification Panel Items"
    description: "Notification list items with actions"

    notification_item:
      min_height: "72px"
      padding: "12px 16px"
      action_zone_width: "48px"

    notification_action:
      min_size: "44px"
      icon_size: "20px"

    dismiss_button:
      min_size: "44px"
      position: "top-right"

    css_implementation:
      base: |
        .notification-item {
          min-height: 72px;
          padding: 12px 16px;
          padding-right: 56px; /* space for action */
          position: relative;
        }

        .notification-action {
          position: absolute;
          top: 50%;
          right: 8px;
          transform: translateY(-50%);
          width: 44px;
          height: 44px;
        }

  links:
    name: "Text Links"
    description: "Inline and standalone text links"

    inline_link:
      min_height: "auto"
      touch_padding: "8px 4px"
      note: "Use pseudo-element to expand touch target"

    standalone_link:
      min_height: "44px"
      padding: "10px 8px"

    nav_link:
      min_height: "48px"
      padding: "12px 16px"

    css_implementation:
      base: |
        /* Inline link with expanded touch target */
        .link-inline {
          position: relative;
        }

        .link-inline::before {
          content: '';
          position: absolute;
          top: -8px;
          left: -4px;
          right: -4px;
          bottom: -8px;
        }

        .link-standalone {
          display: inline-flex;
          min-height: 44px;
          align-items: center;
          padding: 10px 8px;
        }

  tabs:
    name: "Tab Navigation"
    description: "Horizontal tab controls"

    tab_item:
      min_height: "48px"
      min_width: "90px"
      padding_horizontal: "16px"

    scrollable_tabs:
      scroll_button_width: "44px"
      scroll_button_height: "48px"

    css_implementation:
      base: |
        .tab-item {
          min-height: 48px;
          min-width: 90px;
          padding: 12px 16px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .tabs-scroll-btn {
          width: 44px;
          height: 48px;
        }

  sliders:
    name: "Slider / Range Input"
    description: "Draggable slider controls"

    thumb:
      visual_size: "20px"
      touch_target: "44px"
      note: "Invisible touch area larger than visual thumb"

    track:
      height: "4px"
      touch_height: "44px"
      note: "Track touch area extends beyond visual track"

    css_implementation:
      base: |
        .slider-thumb {
          width: 20px;
          height: 20px;
          position: relative;
        }

        /* Expand touch target */
        .slider-thumb::before {
          content: '';
          position: absolute;
          top: 50%;
          left: 50%;
          width: 44px;
          height: 44px;
          transform: translate(-50%, -50%);
        }

        .slider-track-container {
          height: 44px;
          display: flex;
          align-items: center;
        }

# Spacing Requirements
spacing_requirements:
  between_buttons:
    horizontal: "8px"
    vertical: "12px"
    recommended_vertical: "16px"

  between_list_items:
    divider_only: "0px"
    with_spacing: "4px"

  between_form_elements:
    label_to_input: "8px"
    input_to_input: "16px"
    section_gap: "24px"

  touch_safe_margins:
    from_edge: "16px"
    from_system_ui: "20px"
    note: "Avoid system gesture areas"

# Dark Theme Considerations
dark_theme:
  touch_feedback:
    ripple_color: "rgba(255, 255, 255, 0.1)"
    pressed_overlay: "rgba(255, 255, 255, 0.08)"

  focus_indicator:
    color: "var(--focus-ring-color, #90CAF9)"
    width: "2px"
    offset: "2px"

  note: |
    Touch targets should have subtle visual feedback in dark mode.
    Use lighter ripple effects and ensure focus rings are visible.

# Media Queries
media_queries:
  touch_detection: |
    /* Detect touch devices */
    @media (hover: none) and (pointer: coarse) {
      /* Touch-specific styles */
    }

    /* Detect fine pointer (mouse) */
    @media (hover: hover) and (pointer: fine) {
      /* Can use smaller targets */
    }

  breakpoints:
    mobile: "max-width: 768px"
    tablet: "min-width: 769px and max-width: 1024px"
    desktop: "min-width: 1025px"

# Implementation Notes
implementation_notes:
  - "Use touch-action: manipulation to remove 300ms tap delay"
  - "Apply -webkit-tap-highlight-color: transparent for custom highlights"
  - "Ensure :active states respond immediately on touch"
  - "Test with real fingers, not just mouse simulation"
  - "Consider users with larger fingers or motor impairments"
  - "Use CSS custom properties for easy theme switching"
