# UX Specification: Notification Center Component
# Component: Notification Center with Badge and Dropdown
# Version: 1.0.0
# Created: 2025-11-23
# Agent: ux-ergonomics-specialist

component_id: "notification-center"
component_name: "Notification Center"
category: "feedback"

# User Flows
user_flows:
  view_notifications_flow:
    name: "View Notifications"
    steps:
      - step: 1
        action: "User sees badge with unread count"
        system_response: "Badge displays count"
        feedback: "Red badge with number (9+ for >9)"
      - step: 2
        action: "User clicks bell icon"
        system_response: "Dropdown opens"
        feedback: "List of notifications, newest first"
      - step: 3
        action: "User scrolls through notifications"
        system_response: "Older notifications load"
        feedback: "Infinite scroll or load more button"

  read_notification_flow:
    name: "Mark as Read"
    steps:
      - step: 1
        action: "User clicks notification"
        system_response: "Notification marked read, action triggered"
        feedback: "Background color changes, badge decrements"
      - step: 2
        action: "Navigation occurs (if link)"
        system_response: "User taken to relevant page"
        feedback: "Dropdown closes, page navigates"

  mark_all_read_flow:
    name: "Mark All as Read"
    steps:
      - step: 1
        action: "User clicks 'Mark all as read'"
        system_response: "All notifications marked read"
        feedback: "All items change to read state, badge clears"

  dismiss_notification_flow:
    name: "Dismiss Single Notification"
    steps:
      - step: 1
        action: "User hovers notification"
        system_response: "Dismiss button appears"
        feedback: "X icon on right side"
      - step: 2
        action: "User clicks dismiss"
        system_response: "Notification removed"
        feedback: "Item slides out, list reflows"

# Interaction Patterns
interaction_patterns:
  trigger_button:
    icon: "bell"
    size: "24x24px"
    cursor: "pointer"
    states:
      default:
        color: "var(--text-secondary)"
      hover:
        color: "var(--text-primary)"
      has_unread:
        animation: "subtle shake on new notification"

  badge:
    position: "top-right of bell icon"
    offset: "-4px, -4px"
    min_size: "18px"
    shape: "circle (1 digit) or pill (2+ digits)"
    background: "var(--error-color)"
    color: "white"
    font_size: "11px"
    font_weight: "600"
    max_display: "9+"
    animation: "scale pop on increment"

  dropdown:
    position: "below trigger, align right edge"
    width: "360px"
    max_height: "480px"
    shadow: "elevated (16px blur)"
    border_radius: "8px"

  header:
    content: "Notifications"
    sticky: true
    actions:
      - mark_all_read: "text button"
      - settings: "gear icon (optional)"

  notification_item:
    layout: "avatar | content | timestamp"
    padding: "12px 16px"
    elements:
      avatar:
        size: "40px"
        fallback: "icon based on type"
      content:
        title:
          font_weight: "500"
          truncate: "2 lines"
        description:
          font_size: "0.875rem"
          color: "var(--text-secondary)"
          truncate: "2 lines"
      timestamp:
        font_size: "0.75rem"
        color: "var(--text-muted)"
        format: "relative (5m ago, 2h ago, Yesterday)"
      dismiss_button:
        visibility: "on hover"
        icon: "x"
        size: "16px"
    states:
      unread:
        background: "var(--primary-color-alpha-5)"
        border_left: "3px solid var(--primary-color)"
      read:
        background: "transparent"
      hover:
        background: "var(--neutral-50)"

  notification_types:
    info:
      icon: "info-circle"
      color: "var(--info-color)"
    success:
      icon: "check-circle"
      color: "var(--success-color)"
    warning:
      icon: "alert-triangle"
      color: "var(--warning-color)"
    error:
      icon: "alert-circle"
      color: "var(--error-color)"
    mention:
      icon: "at-sign"
      color: "var(--primary-color)"
    message:
      icon: "message-circle"
      color: "var(--primary-color)"

  empty_state:
    icon: "bell-off"
    title: "No notifications"
    description: "You're all caught up!"

  loading_state:
    skeleton: "3 notification item skeletons"
    shimmer: true

  footer:
    content: "View all notifications"
    style: "text link, centered"
    action: "navigates to full notifications page"

# States
states:
  closed:
    description: "Only trigger visible"
    badge_visible: "if unread count > 0"
    aria_expanded: "false"

  open:
    description: "Dropdown visible"
    aria_expanded: "true"
    focus: "on first notification or header"

  loading:
    description: "Fetching notifications"
    visual: "skeleton loader"
    aria_busy: "true"

  empty:
    description: "No notifications"
    visual: "empty state illustration"

  error:
    description: "Failed to load"
    visual: "error message with retry"
    message: "Failed to load notifications"

  has_new:
    description: "New notification received"
    visual: "badge increments, optional toast"
    animation: "badge pulse"

# Keyboard Navigation
keyboard:
  trigger:
    enter:
      action: "Open dropdown"
    space:
      action: "Open dropdown"

  dropdown:
    escape:
      action: "Close dropdown"
    tab:
      action: "Navigate between notifications"
    arrow_down:
      action: "Move to next notification"
    arrow_up:
      action: "Move to previous notification"
    enter:
      action: "Activate notification (navigate/read)"
    delete:
      action: "Dismiss focused notification"
    home:
      action: "Jump to first notification"
    end:
      action: "Jump to last notification"

# Accessibility Requirements (WCAG 2.1 AA)
accessibility:
  aria_roles:
    trigger: "button"
    dropdown: "dialog"
    notification_list: "list"
    notification_item: "listitem"

  aria_attributes:
    trigger:
      - "aria-label: Notifications, {n} unread"
      - "aria-haspopup: dialog"
      - "aria-expanded: true/false"
    dropdown:
      - "aria-modal: false (non-blocking)"
      - "aria-label: Notifications"
    notification_item:
      - "aria-label: full notification text"
      - "aria-describedby: timestamp"

  focus_management:
    open: "Focus first notification or header"
    close: "Return focus to trigger"
    after_dismiss: "Focus next notification or previous"
    trap_focus: false  # Allow tab out to close

  announcements:
    live_region: "aria-live='polite'"
    events:
      - open: "{n} notifications, {m} unread"
      - new_notification: "New notification: {title}"
      - marked_read: "Notification marked as read"
      - marked_all_read: "All notifications marked as read"
      - dismissed: "Notification dismissed"

  reduced_motion:
    preference: "prefers-reduced-motion: reduce"
    changes:
      - no_badge_animation: true
      - no_item_slide: true
      - instant_transitions: true

  color_contrast:
    text: "4.5:1 minimum"
    badge: "4.5:1 white on red"
    unread_indicator: "not color-only (border + background)"

# Real-time Updates
real_time:
  connection: "WebSocket or SSE"
  events:
    - new_notification:
        action: "Prepend to list, increment badge"
        visual: "slide in from top"
        sound: "optional notification sound"
    - read_elsewhere:
        action: "Update read status"
        visual: "change background"
    - deleted:
        action: "Remove from list"
        visual: "slide out"

  polling_fallback:
    enabled: true
    interval: "30 seconds"

  offline_behavior:
    cache: "localStorage"
    sync_on_reconnect: true

# Persistence
persistence:
  storage: "localStorage + server sync"
  key: "notification-center-state"
  data:
    - last_read_timestamp: "datetime"
    - dismissed_ids: "array"
    - preferences: "object"

  sync:
    on_open: "fetch latest from server"
    on_action: "sync read/dismissed status"

# Responsive Behavior
responsive:
  desktop:
    min_width: "1024px"
    dropdown_width: "360px"
    position: "below trigger, align right"

  tablet:
    min_width: "768px"
    max_width: "1023px"
    dropdown_width: "320px"
    position: "below trigger, align right"

  mobile:
    max_width: "767px"
    changes:
      - full_screen_panel: true
      - slide_from_right: true
      - swipe_to_dismiss: "swipe right"
      - close_button_visible: true
      - larger_touch_targets: "48px minimum"

# Animation Timings
animations:
  dropdown_open:
    duration: "200ms"
    easing: "ease-out"
    style: "scale from 95% + fade"

  dropdown_close:
    duration: "150ms"
    easing: "ease-in"
    style: "scale to 95% + fade"

  badge_increment:
    duration: "300ms"
    style: "scale 1.2 + bounce back"

  new_notification:
    duration: "250ms"
    style: "slide down + fade in"

  dismiss:
    duration: "200ms"
    style: "slide right + fade out"

  mark_read:
    duration: "200ms"
    style: "background color transition"
