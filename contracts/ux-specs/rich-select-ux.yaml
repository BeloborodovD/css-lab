# UX Specification: Rich Select / Combobox Component
# Component: Rich Select with Search, Multi-select, Grouping
# Version: 1.0.0
# Created: 2025-11-23
# Agent: ux-ergonomics-specialist

component_id: "rich-select"
component_name: "Rich Select / Combobox"
category: "form-elements"

# User Flows
user_flows:
  single_select_flow:
    name: "Single Selection"
    steps:
      - step: 1
        action: "User clicks trigger or presses Enter/Space"
        system_response: "Dropdown opens"
        feedback: "Chevron rotates, dropdown animates in"
      - step: 2
        action: "User types to search"
        system_response: "Options filter in real-time"
        feedback: "Matching text highlighted, non-matching hidden"
      - step: 3
        action: "User navigates with arrow keys"
        system_response: "Visual focus moves between options"
        feedback: "Highlighted option with distinct background"
      - step: 4
        action: "User presses Enter or clicks option"
        system_response: "Selection made, dropdown closes"
        feedback: "Selected value shows in trigger, checkmark on option"

  multi_select_flow:
    name: "Multiple Selection"
    steps:
      - step: 1
        action: "User opens dropdown"
        system_response: "Dropdown opens with checkboxes"
        feedback: "All options visible with checkbox indicators"
      - step: 2
        action: "User clicks option or presses Space"
        system_response: "Option toggled, dropdown stays open"
        feedback: "Checkbox checked/unchecked, tag added/removed in trigger"
      - step: 3
        action: "User continues selecting"
        system_response: "Multiple options toggled"
        feedback: "Tags accumulate, counter if overflow"
      - step: 4
        action: "User clicks outside or presses Escape"
        system_response: "Dropdown closes"
        feedback: "Selected count or tags visible in trigger"

  search_flow:
    name: "Search and Filter"
    steps:
      - step: 1
        action: "User types in search input"
        system_response: "Options filter by text match"
        feedback: "Debounced filtering (150ms), matched text bold"
      - step: 2
        action: "No results found"
        system_response: "Empty state shown"
        feedback: "No results message with optional create action"
      - step: 3
        action: "User clears search"
        system_response: "All options restored"
        feedback: "Clear button or backspace"

# Interaction Patterns
interaction_patterns:
  trigger:
    closed:
      display: "Selected value(s) or placeholder"
      chevron: "down"
      cursor: "pointer"
    open:
      display: "Same as closed or search input"
      chevron: "up (rotated 180deg)"
      focus: "on search input if present"
    hover:
      background: "var(--hover-bg)"
      border: "var(--primary-color)"
    disabled:
      cursor: "not-allowed"
      opacity: "0.5"

  dropdown:
    position: "below trigger, flip if no space"
    width: "match trigger width or min-width 200px"
    max_height: "300px with scroll"
    animation: "slide down + fade (150ms)"

  option:
    default:
      padding: "8px 12px"
      cursor: "pointer"
    highlighted:
      background: "var(--primary-color-alpha-10)"
    selected:
      background: "var(--primary-color-alpha-15)"
      icon: "checkmark on right"
    disabled:
      cursor: "not-allowed"
      opacity: "0.5"
      skip_in_navigation: true

  option_group:
    header:
      font_weight: "600"
      font_size: "0.75rem"
      text_transform: "uppercase"
      color: "var(--text-muted)"
      padding: "8px 12px 4px"
      not_selectable: true

  multi_select_tags:
    layout: "inline, wrap"
    max_visible: 3
    overflow: "+{n} more"
    tag_style:
      background: "var(--primary-color-alpha-15)"
      border_radius: "4px"
      remove_icon: "x on right"

  search_input:
    position: "sticky top inside dropdown or in trigger"
    placeholder: "Search..."
    clear_button: "visible when text present"
    debounce: "150ms"

# States
states:
  closed:
    description: "Dropdown collapsed"
    trigger_display: "Selected value or placeholder"
    aria_expanded: "false"

  open:
    description: "Dropdown expanded"
    aria_expanded: "true"
    focus: "first option or search input"

  searching:
    description: "User filtering options"
    visual: "filtered list, loading spinner if async"
    aria_live: "polite"
    announcement: "{n} results found"

  loading:
    description: "Async options loading"
    visual: "spinner in dropdown"
    aria_busy: "true"

  empty:
    description: "No options or no search results"
    visual: "Empty state message"
    optional_action: "Create new option"

  selected:
    description: "Value(s) selected"
    trigger_display: "Selected label(s)"
    validation: "valid"

  error:
    description: "Validation error"
    visual: "red border, error message below"
    aria_invalid: "true"
    aria_describedby: "error message id"

  disabled:
    description: "Non-interactive"
    cursor: "not-allowed"
    opacity: "0.5"
    tabindex: "-1"

# Keyboard Navigation
keyboard:
  # Trigger focused
  trigger:
    enter:
      action: "Open dropdown"
    space:
      action: "Open dropdown"
    arrow_down:
      action: "Open dropdown, focus first option"
    arrow_up:
      action: "Open dropdown, focus last option"

  # Dropdown open
  dropdown:
    arrow_down:
      action: "Move focus to next option"
      wrap: "to first if at end"
    arrow_up:
      action: "Move focus to previous option"
      wrap: "to last if at start"
    home:
      action: "Move focus to first option"
    end:
      action: "Move focus to last option"
    enter:
      action: "Select focused option, close (single) or toggle (multi)"
    space:
      action: "Toggle option (multi-select) or select and close (single)"
    escape:
      action: "Close dropdown, return focus to trigger"
    tab:
      action: "Close dropdown, move to next focusable element"

  # Search input
  search:
    typing:
      action: "Filter options"
    arrow_down:
      action: "Move focus from search to first option"
    escape:
      action: "Clear search if text, else close dropdown"

  # Multi-select tags
  tags:
    backspace:
      action: "Remove last tag if cursor at start"
    delete:
      action: "Remove focused tag"
    arrow_left_right:
      action: "Navigate between tags"

# Accessibility Requirements (WCAG 2.1 AA)
accessibility:
  aria_roles:
    trigger: "combobox"
    dropdown: "listbox"
    option: "option"
    option_group: "group"
    search: "searchbox"

  aria_attributes:
    trigger:
      - "aria-haspopup: listbox"
      - "aria-expanded: true/false"
      - "aria-controls: dropdown id"
      - "aria-activedescendant: focused option id"
      - "aria-autocomplete: list (if searchable)"
    dropdown:
      - "aria-label: descriptive label"
      - "aria-multiselectable: true (if multi)"
    option:
      - "aria-selected: true/false"
      - "aria-disabled: true (if disabled)"
    option_group:
      - "aria-label: group name"

  focus_management:
    open: "Focus search input or first option"
    close: "Return focus to trigger"
    selection_single: "Close and focus trigger"
    selection_multi: "Keep open, announce selection"

  announcements:
    live_region: "aria-live='polite'"
    events:
      - open: "Dropdown open. {n} options available."
      - filter: "{n} results for {query}"
      - no_results: "No results found"
      - select: "{option} selected"
      - deselect: "{option} deselected"
      - close: "Dropdown closed"

  reduced_motion:
    preference: "prefers-reduced-motion: reduce"
    changes:
      - no_dropdown_animation: true
      - instant_transitions: true

  color_contrast:
    text: "4.5:1 minimum"
    placeholder: "4.5:1 minimum"
    focused_option: "visible without color (outline)"
    selected_indicator: "not color-only (checkmark icon)"

# Validation Rules
validation:
  required:
    message: "Please select an option"
    visual: "red border, error text below"
    timing: "on blur or form submit"

  min_selections:
    config: "minSelected number"
    message: "Please select at least {n} options"

  max_selections:
    config: "maxSelected number"
    message: "Maximum {n} options allowed"
    behavior: "disable unchecked options when limit reached"

# Responsive Behavior
responsive:
  desktop:
    min_width: "1024px"
    dropdown_position: "absolute below trigger"
    max_dropdown_height: "300px"

  tablet:
    min_width: "768px"
    max_width: "1023px"
    dropdown_position: "absolute below trigger"
    max_dropdown_height: "250px"

  mobile:
    max_width: "767px"
    changes:
      - full_screen_dropdown: true
      - drawer_from_bottom: true
      - sticky_search: true
      - larger_touch_targets: "48px minimum"
      - close_button_visible: true

# Animation Timings
animations:
  dropdown_open:
    duration: "150ms"
    easing: "ease-out"
    style: "slide down + fade"

  dropdown_close:
    duration: "100ms"
    easing: "ease-in"
    style: "slide up + fade"

  option_highlight:
    duration: "100ms"
    easing: "ease"

  chevron_rotate:
    duration: "200ms"
    easing: "ease-in-out"

  tag_enter:
    duration: "150ms"
    style: "scale from 0.8 + fade"

  tag_exit:
    duration: "100ms"
    style: "scale to 0.8 + fade"
