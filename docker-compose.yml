# Оркестрация витрины css-lab: dev-профиль с hot-reload и prod-профиль под nginx.
# Модуль: docker. Зависимости: Dockerfile, docker/nginx.conf, package.json.
#
#   docker compose up -d              — dev, live-server с автоперезагрузкой (:48621)
#   docker compose --profile prod up -d --build  — prod, nginx со статикой (:48620)

name: css-lab

services:

  # [CONFIG:service.css-lab-dev]
  # Рабочий режим доработки дизайна: исходники смонтированы внутрь,
  # live-server следит за файлами и перезагружает вкладку сам.
  dev:
    image: node:22-alpine
    container_name: css-lab-dev
    working_dir: /app
    command: npx --yes live-server@1.2.2 --port=80 --host=0.0.0.0 --no-browser --entry-file=index-v3.html
    ports:
      - "48621:80"
    volumes:
      - ./index-v3.html:/app/index-v3.html:ro
      - ./main.js:/app/main.js:ro
      - ./styles:/app/styles:ro
      - ./assets:/app/assets:ro
    restart: unless-stopped
  # </CONFIG:service.css-lab-dev>

  # [CONFIG:service.css-lab-web]
  # Боевой режим: статика запечена в образ, отдаётся nginx.
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: css-lab:latest
    container_name: css-lab-web
    profiles: ["prod"]
    ports:
      - "48620:80"
    restart: unless-stopped
  # </CONFIG:service.css-lab-web>
