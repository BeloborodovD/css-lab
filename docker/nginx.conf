# Конфигурация nginx для витрины компонентов css-lab (prod-профиль).
# Модуль: docker. Зависимости: базовый образ nginx:alpine.
# Монтируется как /etc/nginx/conf.d/default.conf.

# [CONFIG:nginx.css-lab]
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;

    # Точка входа витрины — единственная страница проекта
    index index-v3.html;

    # Сжатие: CSS витрины разбит на 46 файлов, выигрыш существенный
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript image/svg+xml;

    # [BLOCK:nginx.static-cache]
    # Статика кэшируется коротко: проект в активной доработке дизайна,
    # длинный кэш мешал бы видеть правки после пересборки образа.
    location ~* \.(css|js|svg)$ {
        expires    5m;
        add_header Cache-Control "public, must-revalidate";
    }
    # </BLOCK:nginx.static-cache>

    # [BLOCK:nginx.no-cache-html]
    # HTML не кэшируем — витрина должна открываться в актуальной версии
    location ~* \.html$ {
        expires    -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    # </BLOCK:nginx.no-cache-html>

    # Иконки нет и не планируется — глушим шум 404 в логах
    location = /favicon.ico {
        access_log    off;
        log_not_found off;
        return        204;
    }

    # Проба живости для healthcheck в docker-compose
    location = /healthz {
        access_log off;
        return     200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
# </CONFIG:nginx.css-lab>
