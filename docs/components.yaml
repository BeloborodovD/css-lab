    tokens: ["--space-2", "--space-3", "--space-4", "--space-16", "--color-border", "--color-text-muted", "--font-mono", "--fs-xs"]
    showcase: "components.html#typography"
    examples:
      - "витрина components.html — шкала заголовков и раздел «Типографика по брендам» (VEZA / Уралэлектро / HEMAH)"
    status: new

  - name: user-menu
    file: styles/components/user-menu.css
    summary: 'Меню текущего пользователя в шапке: триггер с аватаром, именем и ролью плюс выпадающая панель с идентификацией, пунктами и выходом.'
    use_when:
      - в шапке нужна точка входа в профиль, настройки и выход
      - 'надо показать, кто вошёл: имя, почта, роль, признак «онлайн»'
      - у пунктов меню есть клавиатурные сокращения (.user-menu__shortcut)
      - выход из системы нужно визуально отделить как опасное действие (--danger)
    avoid_when:
      - это меню действий над объектом, а не над учётной записью
      - нужен выбор значения, а не переход по разделам
      - панель должна содержать формы и длинный контент
      - пунктов много и по ним нужен поиск
    instead_use:
      - case: меню действий у произвольной кнопки
        component: dropdown
      - case: выбор значения из списка
        component: combobox
      - case: длинный список команд с поиском и клавиатурным вызовом
        component: command-palette
    anatomy:
      block: .user-menu
      elements: [user-menu__trigger, user-menu__avatar-wrap, user-menu__name, user-menu__caption, user-menu__caption-role, user-menu__chevron, user-menu__dropdown, user-menu__header, user-menu__identity, user-menu__fullname, user-menu__email, user-menu__role, user-menu__divider, user-menu__item, user-menu__icon, user-menu__shortcut]
      modifiers: ["--danger"]
      states: [is-open]
    behavior_contract:
      keyboard:
        - Enter/Space на триггере открывает меню, стрелки перемещают по .user-menu__item
        - Escape закрывает меню и возвращает фокус на триггер; закрытое меню вне Tab-порядка (visibility:hidden)
        - Home/End — к первому и последнему пункту; фокус не выходит за пределы открытого меню стрелками
      aria:
        - 'триггер: aria-expanded + aria-haspopup="menu" + aria-controls; панель — role="menu", пункты role="menuitem"'
        - '[hidden] на панели сохраняется для AT; визуальное скрытие обеспечивает visibility'
        - онлайн-точка (::after у .user-menu__avatar-wrap) декоративна — статус дублируется текстом
        - '.user-menu__role — видимый текст роли, а не только цветная плашка'
      js_required:
        - переключать .is-open на контейнере и aria-expanded на триггере
        - закрытие по клику вне и по Escape, возврат фокуса на триггер
        - навигация стрелками по пунктам и подстановка --transform-origin от триггера
    tokens: ["--space-px", "--space-1", "--space-2", "--space-3", "--border-w", "--border-w-strong", "--color-border", "--color-border-subtle", "--color-surface", "--color-surface-hover", "--color-text", "--color-text-muted", "--color-accent", "--color-accent-soft", "--color-error", "--color-error-soft", "--color-success", "--radius-xs", "--radius-sm", "--radius", "--radius-full", "--shadow-lg", "--shadow-focus", "--fs-xs", "--fs-sm", "--fw-medium", "--fw-semi", "--lh-tight", "--tracking-wide", "--font-mono", "--z-dropdown", "--transform-origin", "--duration-press", "--duration-dropdown", "--duration-exit", "--ease-out", "--ease-in-out"]
    showcase: "components.html#user-menu"
    examples:
      - "corporate-search v2 / НТБ — донор структуры и поведения (открытие по клику, закрытие по клику вне и Escape)"
      - "аватар в триггере — components/avatar.css"
    status: new

  - name: page-shell
    file: styles/layout/page-shell.css
    summary: Оболочка контента страницы — ограничение ширины, поля и заголовочная пара; сюда же входит skip-link «к содержимому».
    use_when:
      - создаётся новая страница-пример и её контент должен получить общую ширину и поля сайта
      - странице нужен узкий читаемый столбец под форму или текст (--narrow)
      - контенту нужна вся ширина окна с сохранением боковых полей (--wide)
      - на странице обязана быть ссылка обхода навигации (SC 2.4.1)
    avoid_when:
      - страница строится как приложение с боковыми панелями и собственной прокруткой
      - нужен лист бумаги фиксированной геометрии под печать
      - речь о внутреннем контейнере компонента, а не об оболочке страницы
    instead_use:
      - case: интерфейс приложения с боковыми колонками
        component: app-layout
      - case: печатный лист A4 с колонтитулами
        component: print-sheet
    anatomy:
      block: .page-shell
      elements: [page-shell__title, page-shell__sub, skip-link]
      modifiers: ["--narrow", "--wide"]
      states: []
    behavior_contract:
      keyboard:
        - '.skip-link — первый фокусируемый элемент документа; по первому Tab выезжает из-под верхней кромки'
        - переход по skip-link ведёт на контейнер с id, у которого есть tabindex="-1", иначе фокус не переносится
      aria:
        - '.page-shell — <main> с id, на который ссылается skip-link'
        - '.page-shell__title — <h1> страницы; .page-shell__sub — подзаголовок, не заголовок'
        - 'skip-link не .sr-only: он обязан становиться видимым при фокусе'
      js_required:
        - 'ничего: оболочка декларативна, skip-link работает на :focus-visible'
    tokens: ["--max-content-w", "--space-1", "--space-2", "--space-4", "--space-5", "--space-6", "--space-16", "--border-w", "--color-border", "--color-surface", "--color-accent", "--color-text-muted", "--radius-sm", "--shadow-focus", "--border-w-strong", "--fs-sm", "--fw-medium", "--z-sticky", "--duration-dropdown", "--ease-out"]
    showcase: "components.html#skip-link"
    examples:
      - "index.html и все pages/* (catalog, dashboard, datasheet, form) — общая оболочка контента"
      - "на витрине показан только .skip-link; сама оболочка .page-shell в components.html не используется — там каркас app-layout"
    status: stable

  - name: print-sheet
    file: styles/layout/print-sheet.css
    summary: '«Бумага» A4: экранный лист с тенью и физической геометрией 210×297 мм, принудительно светлой палитрой в любой теме, колонтитулами в разметке и контрактом видимости экран/печать.'
    use_when:
      - документ должен выглядеть на экране так же, как выйдет из принтера
      - нужны сквозные колонтитулы листа, прижатые к его кромкам, а не к концу контента
      - часть элементов видна только на экране, часть — только в печати (.screen-only / .print-only)
      - на листе есть логотип бренда, который обязан оставаться цветным и в тёмной теме
    avoid_when:
      - нужно только содержимое даташита без геометрии бумаги
      - страница экранная и печать не предполагается
      - требуется многоколоночная вёрстка произвольной ширины
    instead_use:
      - case: содержимое листа — характеристики, таблицы, карточки параметров
        component: spec-sheet
      - case: обычная экранная страница
        component: page-shell
    anatomy:
      block: .print-sheet
      elements: [print-sheet__running-head, print-sheet__running-foot, print-only, screen-only, no-print]
      modifiers: []
      states: []
    behavior_contract:
      keyboard:
        - лист статичен; кнопка печати находится вне листа и помечается .no-print
      aria:
        - '.print-only скрыт со экрана через display:none — его содержимое недоступно AT, дублировать смысл в экранной версии обязательно'
        - 'колонтитул — разметка листа, а не CSS-генерация: номер листа проставляет генератор документа'
        - логотип на бумаге — <img>/фон с текстовой альтернативой рядом
      js_required:
        - ничего для отображения; страница-потребитель обязана задать собственный @page (size, margin) и переопределить min-height листа под свои поля
    tokens: ["--space-2", "--space-4", "--space-6", "--border-w", "--shadow", "--radius-xs", "--color-text", "--color-text-secondary", "--color-text-muted", "--color-border", "--color-border-strong", "--color-border-subtle", "--color-surface", "--color-surface-sunken", "--color-bg", "--color-highlight", "--color-accent", "--color-accent-paper", "--brand-logo-paper", "--brand-logo", "--fs-xs"]
    showcase: "components.html#print-sheet"
    examples:
      - "print-forms.html — печатные формы (.print-sheet.pf-sheet со вложенным .spec-sheet)"
      - "motor-datasheet (generateDatasheetHTML.ts) — донор механизма прижатого подвала листа"
    status: stable

  - name: site-footer
    file: styles/layout/site-footer.css
    summary: 'Общий подвал страниц сайта: ряд ссылок и подпись, отделённые верхней линией.'
    use_when:
      - страница входит в сайт-витрину и должна заканчиваться единым подвалом
      - нужны служебные ссылки (хаб, витрина компонентов) и строка подписи
      - подвал должен переноситься на узких экранах без отдельных правил (flex-wrap)
    avoid_when:
      - это подвал панели или карточки внутри интерфейса
      - подвал печатной формы с реквизитами и номером листа
      - нужен многоколоночный маркетинговый футер с блоками и формой подписки
    instead_use:
      - case: подвал внутри боковой панели или карточки
        component: sidebar
      - case: подвал печатного листа
        component: print-sheet
      - case: развёрнутый футер сайта с колонками
        component: footer
    anatomy:
      block: .site-footer
      elements: [site-footer__links]
      modifiers: []
      states: []
    behavior_contract:
      keyboard:
        - ссылки в обычном Tab-порядке; последняя ссылка — конец обхода страницы
      aria:
        - '<footer> с role по умолчанию contentinfo; блок ссылок — <nav aria-label="Подвал">'
        - у ссылок нет собственного стиля :focus-visible — кольцо приходит из base; при вендоринге проверить видимость фокуса
      js_required:
        - ничего; разметка копируется между страницами по маркерам [BLOCK:site-footer]
    tokens: ["--space-4", "--space-5", "--space-16", "--border-w", "--color-border", "--color-text-muted", "--color-accent", "--fs-sm"]
    showcase: "components.html#site-footer"
    examples:
      - "витрина: components.html#site-footer — ряд ссылок и подпись"
      - "index.html, pages/catalog.html, pages/dashboard.html, pages/datasheet.html, pages/form.html"
    status: stable

  - name: site-header
    file: styles/layout/site-header.css
    summary: 'Липкая шапка сайта со стеклянным фоном: логотип-словомарка, горизонтальная навигация и правый блок инструментов с переключателями бренда и темы.'
    use_when:
      - страница входит в сайт-витрину и должна нести одинаковую шапку и переключатели
      - шапка обязана оставаться сверху при прокрутке, а контент — уходить под неё
      - нужен единственный легитимный стеклянный слой уровня страницы (backdrop-filter + solid-фоллбек)
      - активный раздел помечается прямо в навигации
    avoid_when:
      - интерфейс приложения со своей панелью инструментов и действиями над документом
      - шапка должна печататься — этот слой в печати скрывается принудительно
      - навигация большая и требует выпадающих подменю
    instead_use:
      - case: панель приложения с действиями над текущим документом
        component: app-layout
      - case: самостоятельная навигация внутри страницы
        component: nav
      - case: путь по иерархии разделов
        component: breadcrumbs
    anatomy:
      block: .site-header
      elements: [site-header__brand, site-header__wordmark, site-header__tools, site-header__theme, site-nav, site-nav__link]
      modifiers: []
      states: []
    behavior_contract:
      keyboard:
        - '.site-nav__link и .site-header__theme в Tab-порядке, кольцо фокуса через --shadow-focus'
        - 'шапка идёт после skip-link: первый Tab обязан попадать на ссылку обхода, а не на логотип'
        - горизонтально прокручиваемая .site-nav должна оставаться достижимой с клавиатуры
      aria:
        - 'текущий раздел — aria-current="page" (класс для этого не используется)'
        - '.site-header__theme: aria-label и aria-pressed либо смена доступного имени при переключении темы'
        - '<header> + <nav> с доступным именем; иконки внутри кнопок aria-hidden'
      js_required:
        - js/site.js — переключение темы (.dark на <body>) и бренда (data-brand), запись в localStorage css-lab-theme / css-lab-brand
        - анти-FOUC-сниппет в <head> каждой страницы обязан выставлять тему до отрисовки
        - разметка копируется между страницами по маркерам [BLOCK:site-header]
    tokens: ["--space-1", "--space-2", "--space-3", "--space-4", "--space-5", "--header-h", "--border-w", "--border-w-strong", "--color-border", "--color-surface", "--color-surface-hover", "--color-text", "--color-text-muted", "--color-accent", "--color-accent-soft", "--surface-glass", "--surface-glass-border", "--blur-glass", "--radius-sm", "--shadow-focus", "--fs-sm", "--fw-medium", "--fw-bold", "--z-sticky", "--duration-press", "--ease-out"]
    showcase: "components.html#site-header"
    examples:
      - "витрина: components.html#site-header — образец в рамке-подмакетнике"
      - "index.html, print-forms.html, ral-colors.html и все pages/* — общий хром сайта"
      - "витрина components.html эту шапку в собственном хроме не использует: у неё каркас app-layout"
    status: stable
