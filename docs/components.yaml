      - "таблица рабочих точек изделия в даташите, уходящая в печать вместе с документом"
      - "редактируемый массив однотипных строк: 5–7 числовых параметров в строке, одна шапка на весь массив (.table--form)"
      - "в репозитории: components.html#table и components.html#table-form, pages/dashboard.html"
