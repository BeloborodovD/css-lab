  - name: logs
    file: styles/components/logs.css
    summary: Просмотрщик журналов — строки событий с меткой времени и уровнем, раскрываемые детали, панель управления, переключатель вида и семантические плашки.
    use_when:
      - Нужен поток событий с уровнями (info/warning/error/debug/success) и моноширинными метками времени.
      - Строку журнала надо разворачивать в детали — JSON, таблицу «поле — значение».
      - Нужна панель фильтров журнала, переключатель «текст/JSON» и кнопка обновления с индикацией загрузки.
    avoid_when:
      - Данные табличные и требуют сортировки по колонкам и выравнивания по столбцам.
      - События образуют хронологию вех, а не поток строк.
      - Нужно единичное сообщение пользователю о состоянии — у журнала своей плашки нет, это компонент alerts.
    instead_use:
      - case: табличные данные с сортировкой и колонками
        component: table
      - case: хронология вех процесса
        component: timeline
      - case: сообщение пользователю в потоке страницы
        component: alerts
      - case: подсветка блока кода/конфигурации
        component: code-panel
    anatomy:
      block: .log-entry
      elements: [log-entry-toggle, log-entry-icon, log-entry-timestamp, log-entry-level, log-entry-message, log-entry-details, log-entry-grid, log-entry-label, log-entry-value, log-badge, log-controls, log-controls-group, log-controls-label, log-controls-select, view-mode-toggle, view-mode-btn, log-refresh-btn, log-json-view, log-empty]
      modifiers: [info, warning, error, debug, success]
      states: [active, spinning, ":disabled"]
    behavior_contract:
      keyboard:
        - Кнопка раскрытия строки, переключатель вида и обновление — нативные button, достижимы Tab.
        - Переключатель вида ведёт себя как группа кнопок: активная помечается не только фоном, но и aria-pressed.
      aria:
        - Уровень события передаётся текстом бейджа, а не только цветом.
        - Кнопка раскрытия держит aria-expanded и aria-controls на блоке деталей.
        - Автообновляемый поток озвучивается только явной live-областью; по умолчанию её нет.
        - Вращающаяся иконка обновления декоративна — состояние «идёт загрузка» дублируется текстом или disabled.
      js_required:
        - Разворачивать и сворачивать .log-entry-details, синхронизируя aria-expanded.
        - Переключать .active у .view-mode-btn и показывать нужное представление (текст / JSON).
        - Ставить и снимать .spinning на иконке обновления.
    tokens: ["--color-surface", "--color-surface-sunken", "--color-surface-hover", "--color-text", "--color-text-secondary", "--color-text-muted", "--color-border", "--color-border-subtle", "--color-accent", "--color-accent-soft", "--color-accent-hover", "--color-text-on-accent", "--color-info", "--color-info-soft", "--color-info-text", "--color-warning", "--color-warning-soft", "--color-warning-text", "--color-error", "--color-error-soft", "--color-error-text", "--color-success", "--color-success-soft", "--color-success-text", "--font-mono", "--border-w", "--border-w-thick", "--border-w-strong", "--radius", "--radius-sm", "--radius-xs", "--shadow-focus", "--space-1", "--space-2", "--space-3", "--space-4", "--space-12", "--fs-xs", "--fs-sm", "--fw-medium", "--lh-snug", "--lh-relaxed", "--tracking-wide", "--t-fast", "--ease"]
    showcase: "components.html#logs"
    examples:
