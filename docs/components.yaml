  - name: modal
    file: styles/components/modal.css
    summary: Модальное окно по центру затемнённого фона — шапка, тело с прокруткой, подвал действий; варианты размеров и полноэкранный режим.
    use_when:
      - Действие требует подтверждения или ввода и не должно продолжаться до ответа пользователя.
      - Содержимое короткое и самодостаточное, а возврат в контекст обязателен сразу после ответа.
      - Нужен акцентный итог операции с иконкой (успех, предупреждение, ошибка).
    avoid_when:
      - Панель дополняет контекст и не блокирует работу — модалка отберёт фокус зря.
      - Сообщение не требует ответа и должно исчезнуть само.
      - Содержимое — длинная форма или таблица, для которой нужна отдельная страница.
      - Пользователю нужен быстрый поиск команд по всему приложению.
    instead_use:
      - case: панель от кромки экрана (сбоку или нижний лист)
        component: drawer
      - case: сообщение без ответа, исчезающее само
        component: toast
      - case: быстрый поиск команд/действий
        component: command-palette
      - case: раскрытие подробностей внутри страницы
        component: accordion
    anatomy:
      block: .modal
      elements: [modal-overlay, modal-header, modal-title, modal-close, modal-body, modal-footer, modal-icon]
      modifiers: [modal-sm, modal-md, modal-lg, modal-xl, modal-fullscreen, modal-fullscreen-mobile, modal-no-header, modal-no-footer, modal-centered, modal-footer-left, modal-footer-center, modal-footer-between]
      states: [modal-enter, modal-exit, modal-slide-up, modal-slide-down]
    behavior_contract:
      keyboard:
        - Escape закрывает окно; фокус запирается внутри окна на всё время показа.
        - При открытии фокус уходит на первый интерактивный элемент или на само окно, при закрытии — возвращается на элемент, который окно открыл.
        - Кнопка закрытия достижима Tab и имеет видимое фокус-кольцо.
      aria:
        - Разметка 'role="dialog" aria-modal="true"' со связью aria-labelledby на .modal-title.
        - Остальная страница помечается inert или aria-hidden, пока окно открыто.
        - Кнопка закрытия получает текстовую метку, крестик — не имя.
      js_required:
        - Монтировать/демонтировать окно и управлять классами .modal-enter / .modal-exit (выход должен дожидаться animationend).
        - Реализовать ловушку фокуса, Escape, закрытие по клику на оверлей и возврат фокуса.
        - Блокировать прокрутку фона на время показа.
    tokens: ["--color-overlay", "--color-surface-overlay", "--color-surface-hover", "--color-border", "--color-border-strong", "--color-text", "--color-text-secondary", "--color-text-muted", "--color-accent", "--color-accent-soft", "--color-success", "--color-success-soft", "--color-warning", "--color-warning-soft", "--color-error", "--color-error-soft", "--color-info", "--color-info-soft", "--drawer-w", "--border-w", "--border-w-strong", "--radius-lg", "--radius-sm", "--radius-full", "--shadow-xl", "--shadow-lg", "--shadow-focus", "--z-modal", "--z-sticky", "--space-2", "--space-3", "--space-4", "--space-5", "--space-6", "--space-8", "--fs-base", "--fs-md", "--fs-lg", "--fw-semi", "--lh-snug", "--lh-relaxed", "--duration-modal", "--duration-modal-exit", "--duration-dropdown", "--duration-exit", "--ease-out", "--ease-drawer"]
    showcase: "components.html#modal"
    examples:
      - "Витрина (статичный пример без скрипта): components.html#modal"
      - "Панель мониторинга — окно подтверждения действия: pages/dashboard.html"
    status: stable
    notes:
      - "Шторок здесь больше нет: .modal-drawer / .modal-drawer-left / .modal-drawer-right / .modal-bottom-sheet удалены — боковая панель и нижний лист живут в компоненте drawer (.drawer--left / .drawer--sheet)."
      - "На ширине ≤767px окно по-прежнему прижимается к низу экрана — это адаптация модалки, а не отдельный вариант."

  - name: nav
    file: styles/components/nav.css
    summary: Горизонтальная навигационная полоса сайта с мобильным раскрытием и липкое оглавление длинной страницы.
    use_when:
      - Публичной странице нужна фиксированная верхняя полоса с логотипом, разделами и CTA-ссылкой.
      - Меню должно схлопываться в бургер на узком экране без отдельного компонента шторки.
      - Длинной странице нужно липкое оглавление сбоку с подсветкой текущего раздела (.page-nav).
    avoid_when:
      - Это интерфейс приложения с боковой панелью — там своя шапка и свой каркас.
      - "Нужны хлебные крошки: этот компонент их не содержит."
      - Переключаются представления внутри одной страницы, а не разделы сайта.
      - Показывается прогресс прохождения многошагового сценария.
    instead_use:
      - case: путь по уровням иерархии
        component: breadcrumbs
      - case: переключение представлений внутри страницы
        component: tabs
      - case: прогресс многошагового сценария
        component: steps
      - case: шапка приложения с действиями
        component: layout (.header)
      - case: вертикальное меню разделов
        component: sidebar
    anatomy:
      block: .nav
      elements: [nav-container, nav-logo, nav-menu, nav-link, nav-toggle, page-nav, page-nav-link]
      modifiers: [nav-link-primary]
      states: [is-open, active]
    behavior_contract:
      keyboard:
        - Бургер — нативная кнопка, Enter/Space раскрывают меню; ссылки меню достижимы Tab только когда меню открыто.
        - Текущий раздел помечается не только цветом, но и насыщенностью шрифта.
      aria:
        - Полоса размечается nav с aria-label; текущий пункт получает aria-current="page".
        - Бургер держит aria-expanded и aria-controls на .nav-menu.
        - Липкое оглавление — тоже nav с меткой; активная ссылка помечается aria-current="location".
      js_required:
        - Переключать .is-open на .nav-menu и aria-expanded на бургере (легаси-двойник .open ставится тем же обработчиком до снятия последнего потребителя).
        - Проставлять .active по текущему разделу и, для .page-nav, по позиции прокрутки.
    tokens: ["--color-surface", "--color-surface-hover", "--color-border", "--color-text", "--color-text-secondary", "--color-text-muted", "--color-text-disabled", "--color-accent", "--color-accent-soft", "--color-accent-hover", "--color-text-on-accent", "--max-content-w", "--header-h", "--border-w", "--border-w-strong", "--radius", "--radius-sm", "--shadow", "--shadow-focus", "--z-sticky", "--space-1", "--space-2", "--space-3", "--space-4", "--space-5", "--fs-sm", "--fs-md", "--fw-regular", "--fw-medium", "--fw-semi", "--tracking-tight", "--duration-press", "--ease-out"]
    showcase: "components.html#nav"
    examples:
      - "витрина: components.html#nav — полоса с бургером и липкое оглавление .page-nav"
      - Публичный сайт или лендинг с верхней навигационной полосой
      - "Длинная страница с липким оглавлением разделов (.page-nav)"
    status: legacy

  - name: notification-badge
    file: styles/components/notification-badge.css
    summary: "Обвязка индикатора уведомлений на иконке: якорь для бейджа, четыре угла размещения, пульсация «есть новое» — плюс выпадающая панель списка уведомлений. Сам индикатор — бейдж из badge.css."
    use_when:
      - На иконке в шапке нужно показать число непрочитанного или сам факт наличия нового ("badge"/"badge-dot" плюс "badge-float" внутри контейнера).
      - Нужен выпадающий список уведомлений с заголовком, прокруткой, отметкой прочитанного и ссылкой «показать все».
      - Элементы списка должны различаться по типу (успех/предупреждение/ошибка/инфо) и иметь состояние «непрочитано».
      - На мобильном список должен разворачиваться нижним листом — это заложено в компонент.
    avoid_when:
      - Нужна просто числовая или статусная метка рядом с текстом.
      - Сообщение разовое и должно всплыть и исчезнуть.
      - Требуется меню действий, а не список событий.
    instead_use:
      - case: статусная или числовая метка в тексте/таблице
        component: badge
      - case: разовое всплывающее сообщение
        component: toast
      - case: меню действий под кнопкой
        component: dropdown
      - case: меню профиля пользователя
        component: user-menu
    anatomy:
      block: .notification-badge
      elements: [notification-badge-trigger, notification-panel, notification-panel-header, notification-panel-title, notification-panel-count, notification-list, notification-item, "notification-item-icon", "notification-item-content", "notification-item-title", "notification-item-message", "notification-item-time", "notification-item-actions", "notification-item-action", notification-panel-footer, notification-mark-read, notification-view-all, notification-empty]
      modifiers: ["notification-badge-top-left", "notification-badge-bottom-right", "notification-badge-bottom-left", notification-badge-pulse, notification-panel-left, notification-badge-inline]
      states: [open, "notification-item-unread"]
    behavior_contract:
      keyboard:
        - Триггер — нативная кнопка; Escape закрывает панель и возвращает фокус на триггер.
        - Действия элемента списка проявляются по наведению, но обязаны оставаться достижимыми Tab (на мобильном они видимы всегда).
      aria:
        - Триггер держит aria-expanded и доступное имя со счётчиком («уведомления, 3 новых»), а не только визуальную цифру.
        - Закрытая панель убирается из Tab-порядка (visibility скрывает её, но JS обязан следить за hidden при необходимости).
        - Пульсация — декоративная: факт новых уведомлений дублируется числом и текстом.
      js_required:
        - Переключать класс .open на контейнере и aria-expanded на триггере, закрывать по клику вне и Escape.
        - Обновлять счётчики, состояние .notification-item-unread и «отметить всё прочитанным».
    tokens: ["--notification-panel-width", "--notification-item-padding", "--duration-pulse", "--color-surface", "--color-surface-hover", "--color-surface-active", "--color-border", "--color-border-subtle", "--color-text", "--color-text-muted", "--color-accent", "--color-accent-soft", "--color-accent-soft-hover", "--color-error", "--color-error-soft", "--color-success", "--color-success-soft", "--color-warning", "--color-warning-soft", "--color-info", "--color-info-soft", "--font-sans", "--border-w", "--border-w-strong", "--radius", "--radius-lg", "--radius-xs", "--radius-full", "--shadow-lg", "--shadow-focus", "--z-dropdown", "--space-1", "--space-2", "--space-3", "--space-4", "--space-6", "--space-12", "--fs-xs", "--fs-sm", "--fs-md", "--fs-lg", "--fw-medium", "--fw-semi", "--lh-snug", "--lh-normal", "--t-fast", "--ease", "--ease-out"]
    showcase: "components.html#notification"
    examples:
      - "Витрина индикаторов и панели: components.html#notification"
      - Иконка колокольчика в шапке портала со списком событий
    status: stable
    notes:
      - "2026-07-30: собственные .notification-dot/.notification-count удалены как дубль бейджа. Соответствие имён: .notification-dot → .badge-dot + .badge-float, .notification-count → .badge + .badge-float, цвет — .badge-dot-*/.badge-*, пульсация — .notification-badge-pulse (одна анимация вместо пяти keyframes на дотокенной палитре)."

  - name: pagination
    file: styles/components/pagination.css
    summary: Постраничная навигация — ряд кнопок страниц с многоточием либо компактный контейнерный счётчик «стрелка — X / Y — стрелка».
    use_when:
      - Длинный список результатов разбит на страницы и пользователю нужен переход к конкретной странице.
      - Нужен компактный вариант навигации, когда номера страниц не важны, а важно «текущая из общего».
      - Требуется отдельная подпись с диапазоном показанных записей (.pagination-info).
    avoid_when:
      - Список подгружается бесконечной прокруткой или кнопкой «показать ещё».
      - Речь о шагах процесса, а не о страницах данных.
      - Переключаются вкладки представлений.
    instead_use:
      - case: шаги многошагового процесса
        component: steps
      - case: переключение представлений
        component: tabs
      - case: навигация внутри длинного документа
        component: nav (.page-nav)
    anatomy:
      block: .pagination
      elements: [page-btn, pagination-info, pagination-ellipsis, pagination-container, pagination-btn, pagination-counter, pagination-current, pagination-separator, pagination-total]
      modifiers: [pagination-compact, pagination-modern]
      states: [active, ":disabled"]
    behavior_contract:
      keyboard:
        - Кнопки страниц — нативные button или ссылки; Tab проходит по ним по порядку, отключённые исключены из действия.
        - Фокус-кольцо видимо и не совпадает со стилем активной страницы.
      aria:
        - Обёртка — nav с aria-label «Постраничная навигация».
        - Текущая страница помечается aria-current="page", отключённые стрелки — disabled, а не только визуально бледные.
        - Многоточие декоративно и скрывается от скринридера.
      js_required:
        - Строить диапазон номеров и многоточие, переключать .active, ставить disabled на краевых стрелках.
        - После смены страницы вернуть фокус в начало списка результатов и объявить изменение.
    tokens: ["--color-surface", "--color-surface-hover", "--color-border", "--color-border-strong", "--color-text", "--color-text-muted", "--color-accent", "--color-accent-text", "--color-text-on-accent", "--border-w", "--border-w-strong", "--radius-sm", "--radius-xs", "--shadow-focus", "--space-1", "--space-2", "--space-3", "--space-4", "--fs-xs", "--fs-sm", "--fw-medium", "--fw-semi", "--t-fast", "--ease"]
    showcase: "components.html#pagination"
    examples:
