    status: legacy
    notes:
      - "2026-07-30: собственная точка .footer-status-dot удалена — в разметке .badge-dot с семантическим модификатором."

  - name: form-error-summary
    file: styles/components/form-error-summary.css
    summary: Сводка ошибок валидации формы — список ссылок-якорей к невалидным полям, сгруппированный по разделам.
    use_when:
      - Длинная форма с несколькими разделами, где после отправки невалидное поле нельзя найти глазами.
      - Нужна замена блокирующего браузерного alert() при отправке — все ошибки видны сразу и кликабельны.
      - Ошибки требуется сгруппировать по разделам формы и показать счётчик по каждому.
    avoid_when:
      - Ошибка относится к одному полю — сообщение живёт под полем.
      - Форма короткая (2-3 поля), все ошибки и так видны на экране.
      - Сообщение не про валидацию, а про результат операции или системное событие.
    instead_use:
      - case: ошибка одного поля
        component: form-section (.form-field__error)
      - case: одиночное сообщение об ошибке или предупреждении в потоке страницы
        component: alerts
      - case: эфемерное уведомление о результате операции
        component: toast
    anatomy:
      block: .form-error-summary
      elements: [__list, __item, __link, __section]
      modifiers: []
      states: [is-visible]
    behavior_contract:
      keyboard:
        - Каждая ошибка — ссылка-якорь, переход по Enter ставит фокус на соответствующее поле.
        - Ссылки подчёркнуты: цвет не единственный носитель различия.
        - Скрытая сводка выведена из потока (hidden + visibility), в Tab-порядок не попадает.
      aria:
        - Контейнер компонуется как 'div class="alert alert-error form-error-summary" role="alert" tabindex="-1" hidden'.
        - При показе снять hidden и программно сфокусировать контейнер — иначе объявление role="alert" не даёт точки входа.
        - Каждое поле связано со своим сообщением через aria-describedby и помечено aria-invalid="true".
      js_required:
        - Собрать список ошибок, снять hidden и следующим кадром повесить .is-visible (иначе перехода не будет).
        - Обработать клик по __link — перевести фокус на поле, а не только проскроллить.
        - Синхронизировать счётчики разделов с бейджем в легенде секции и модификатором .form-section--invalid.
    tokens: ["--color-error", "--space-1", "--space-2", "--space-3", "--space-4", "--fs-xs", "--fs-sm", "--fw-semi", "--tracking-wide", "--radius-xs", "--shadow-focus-error", "--border-w-strong", "--duration-press", "--duration-dropdown", "--duration-exit", "--ease-out"]
    showcase: "components.html#form-error-summary"
    examples:
      - "Витрина с рабочей кнопкой отправки: components.html#form-error-summary"
      - Длинная техническая форма-опросник с разделами и обязательными полями
    status: stable

  - name: form-section
    file: styles/components/form-section.css
    summary: Раздел формы — fieldset с брендовой засечкой, сеткой полей, метками, подсказками, ошибками и прогрессивным раскрытием.
    use_when:
      - Форма разбита на смысловые разделы и каждому нужен заголовок, подсказка и признак «в разделе есть ошибки».
      - Поля надо разложить в 2 или 3 колонки с корректным схлопыванием на планшете и телефоне.
      - Полю нужна пара «метка + кнопка-подсказка», единица измерения, счётчик символов или сообщение об ошибке.
      - Часть полей появляется в зависимости от ответа в другом поле (зависимая группа).
    avoid_when:
      - Это не форма, а произвольный контейнер контента.
      - Строк массива много и у каждой одни и те же 5-7 числовых параметров — метки будут дублироваться в каждой строке.
      - Нужен только один инпут без обвязки раздела.
    instead_use:
      - case: произвольный контейнер контента с заголовком
        component: cards
      - case: повторяемые строки формы (добавить/удалить)
        component: row-card
      - case: массив из 5-7 однотипных числовых параметров
        component: table (.table--form)
      - case: сами контролы ввода
        component: inputs
    anatomy:
      block: .form-section
      elements: [__legend, __legend-row, __hint, __subtitle, "form-grid", "form-field", "form-field__label", "form-field__label-row", "form-field__req", "form-field__unit", "form-field__tip", "form-field__error", "form-field__counter", "form-group"]
      modifiers: ["--invalid", "form-grid--three", "form-field--full", "form-group--dependent"]
      states: [is-near-limit, is-over-limit, is-hidden]
    behavior_contract:
      keyboard:
        - Кнопка-подсказка «?» — отдельная кнопка рядом с меткой, цель не меньше 24px, достижима Tab.
        - Скрытые поля и группы снимаются из Tab-порядка атрибутом hidden (компонент явно не даёт display перебить hidden).
      aria:
        - Раздел размечается fieldset + legend; счётчик ошибок раздела — бейдж внутри __legend-row.
        - Подсказка «?» связана с полем через aria-describedby; ошибка поля — тоже describedby плюс aria-invalid.
        - Ошибка не передаётся одним цветом — маркер «!» и текст обязательны.
        - Зависимая группа при скрытии получает hidden, а не только класс .is-hidden.
      js_required:
        - Показывать и прятать зависимые группы, ставя hidden и класс .is-hidden.
        - Считать символы для textarea и переключать пороги .is-near-limit / .is-over-limit.
        - Выставлять .form-section--invalid и счётчик ошибок в легенде по результатам валидации.
    tokens: ["--color-surface", "--color-accent", "--color-accent-soft", "--color-accent-text", "--color-error", "--color-warning", "--color-text-secondary", "--color-text-muted", "--color-text-on-accent", "--color-border", "--border-w", "--border-w-thick", "--border-w-strong", "--radius", "--radius-full", "--shadow-sm", "--space-px", "--space-1", "--space-2", "--space-3", "--space-4", "--space-5", "--space-6", "--fs-xs", "--fs-sm", "--fs-md", "--fw-medium", "--fw-semi", "--fw-bold", "--lh-snug", "--tracking-tight", "--tracking-wide", "--duration-press", "--duration-dropdown", "--ease-out"]
    showcase: "components.html#form-section"
    examples:
      - "витрина: components.html#form-section — легенда, подсказка и сетка полей; соседи по форме вынесены в собственные секции (#row-card, #rte, #save-status)"
      - "Страница-пример многошаговой формы: pages/form.html"
      - Длинная техническая форма-опросник с разделами, единицами измерения и зависимыми полями
    status: stable

  - name: inputs
    file: styles/components/inputs.css
    summary: Базовые контролы ввода — текстовое поле, select, textarea, чекбокс/радио, метка, поле с иконкой и суффиксом, парный диапазон «от — до».
    use_when:
      - Нужен любой нативный контрол ввода с единым видом, состояниями и фокус-кольцом дизайн-системы.
      - Полю требуется ведущая иконка, хвостовая единица измерения (кВт, ₽, %) или моноширинные цифры.
      - Нужен парный диапазон двух числовых полей с общим кольцом фокуса.
      - Требуются корректные состояния валидации, которые не красят поле до первого ввода.
    avoid_when:
      - Значение выбирается из списка с поиском или автодополнением.
      - Значений много и они выбираются пачкой.
      - Нужен форматированный текст с абзацами и списками.
      - Пользователь загружает файл или выбирает дату/цвет специализированным пикером.
    instead_use:
      - case: одиночный выбор из списка с автодополнением
        component: combobox
      - case: мультивыбор из перечня
        component: picklist
      - case: выбор даты
        component: date-picker
      - case: выбор цвета из палитры
        component: swatch-picker
      - case: форматированный текст
        component: rte
      - case: загрузка файла
        component: file-upload
    anatomy:
      block: .input
      elements: [input-group, input-icon, input-affix, input-clear, input-range, "input-range__dash", select, textarea, checkbox, radio, label, search-bar]
      modifiers: [input-sm, input-lg, "input--numeric", "input-group--suffix", input-floating, search-bar-stack, input-group-stack-mobile]
      states: [input-error, input-success, input-shake, ":user-invalid", "[aria-invalid=true]", "[readonly]", ":disabled"]
    behavior_contract:
      keyboard:
        - Все контролы нативные, порядок Tab и ввод — браузерные; фокус помечается кольцом плюс прозрачный outline (forced-colors).
        - readonly-поле остаётся фокусируемым и читается обычным контрастом, в отличие от disabled.
      aria:
        - У каждого поля есть label (или aria-label); плейсхолдер меткой не является.
        - Программная валидация ставит aria-invalid="true" и aria-describedby на текст ошибки; нативная закрывается :user-invalid.
        - Тряска .input-shake — не носитель информации: причина отказа обязана быть в тексте и рамке.
      js_required:
        - Ничего для базового вида. Скриптом добавляются: очистка поля (.input-clear), класс .input-shake, aria-invalid при собственной валидации.
    tokens: ["--color-surface", "--color-surface-sunken", "--color-surface-hover", "--color-text", "--color-text-muted", "--color-text-disabled", "--color-border", "--color-border-strong", "--color-border-subtle", "--color-accent", "--color-error", "--color-success", "--border-w", "--border-w-strong", "--radius-sm", "--radius-full", "--shadow-focus", "--shadow-focus-error", "--space-1", "--space-2", "--space-3", "--space-4", "--space-10", "--fs-sm", "--fs-base", "--fs-md", "--lh-snug", "--lh-normal", "--duration-press", "--duration-tooltip", "--ease-out"]
    showcase: "components.html#inputs"
    examples:
      - "Витрина базовых контролов: components.html#inputs"
      - "Витрина состояний валидации, суффиксов, диапазона и счётчика: components.html#input-states"
      - "Форма-пример: pages/form.html"
      - "Диапазон .input-range — в группе фильтров каталога: components.html#filter-panel, pages/catalog.html"
    status: stable
    notes:
      - "Единственный владелец имён .search-bar (поле + примыкающая кнопка) и .input-range (пара «от — до»). Полоса поиска в шапке — композиция .header .search-bar в components/layout.css; прежний дубль .filter-range из filter-panel.css удалён."

  - name: layout
    file: styles/components/layout.css
    summary: Липкая шапка экрана приложения (в том числе акцентная app-bar), основная область, оверлей и контейнеры ширины.
    use_when:
      - "Строится экран приложения: шапка сверху с логотипом, поиском и группами действий."
      - Нужна акцентная брендовая полоса приложения с заголовком, подзаголовком, логотипом и группами действий (вариант --accent).
      - Полосу нужно уплотнять при прокрутке (--condensed) и печатать как шапку бланка.
      - Требуется центрирующий контейнер фиксированной максимальной ширины.
    avoid_when:
      - Страница контентная (статья, каталог, форма) — ей нужен каркас страницы, а не каркас приложения.
      - Нужна только служебная шапка сайта с переключателями бренда и темы.
      - Нужна одна выезжающая панель поверх контента без всего каркаса.
    instead_use:
      - case: каркас контентной страницы
        component: layout/page-shell.css
      - case: служебная шапка и подвал сайта
        component: layout/site-header.css, layout/site-footer.css
      - case: сетка «панель + контент», сдвиг центра, фиксированный подвал
        component: app-layout
      - case: сама боковая панель — каркас, шторка, ресайз, наполнение
        component: sidebar
      - case: временная панель поверх контента
        component: drawer
      - case: поле поиска само по себе (вне шапки)
        component: inputs (.search-bar)
    anatomy:
      block: .header
      elements: [header-left, header-right, "header__titles", "header__title", "header__sub", "header__logo", "header__group", logo, logo-accent, main, overlay, container]
      modifiers: ["header--accent", "header--condensed", container-sm, container-lg]
      states: [active]
    behavior_contract:
      keyboard:
        - Все действия в шапке — нативные кнопки/ссылки с видимым фокусом.
      aria:
        - Шапка размечается тегом header, основная область — main.
        - Оверлей декоративен и не должен перехватывать фокус в закрытом состоянии.
