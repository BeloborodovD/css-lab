  - name: toast
    file: styles/components/toast.css
    summary: 'Всплывающее уведомление о результате действия: временное, поверх интерфейса, с иконкой типа, необязательными кнопками и полосой обратного отсчёта.'
    use_when:
      - действие завершилось и результат нужно подтвердить, не прерывая работу («Сохранено», «Файл удалён»)
      - у сообщения есть недеструктивное продолжение — «Отменить», «Открыть» (.toast-actions)
      - сообщение относится к моменту, а не к состоянию экрана, и должно само исчезнуть
      - событие произошло в фоне и не привязано к конкретному месту на странице
    avoid_when:
      - сообщение относится к участку страницы и обязано остаться, пока проблема не устранена
      - это результат валидации формы со списком проблемных полей
      - действие требует подтверждения или блокирует продолжение работы
      - текст длинный и его нужно перечитать — тост исчезнет раньше
    instead_use:
      - case: постоянное сообщение в потоке страницы
        component: alerts
      - case: сводка ошибок валидации со ссылками на поля
        component: form-error-summary
      - case: обязательное подтверждение или выбор пользователя
        component: modal
      - case: статус фонового автосохранения
        component: save-status
    anatomy:
      block: .toast
      elements: [toast-container, toast-icon, toast-content, toast-title, toast-message, toast-close, toast-actions, toast-action, toast-progress]
      modifiers: [toast-compact, toast-filled, top-right, top-left, top-center, bottom-right, bottom-left, bottom-center]
      states: [info, success, warning, error, toast-enter, toast-exit]
    behavior_contract:
      keyboard:
        - '.toast-close достижима с клавиатуры, цель ≥24px; тост не крадёт фокус при появлении'
        - при наведении и фокусе внутри тоста автозакрытие приостанавливается
        - кнопки .toast-action в Tab-порядке, пока тост жив
      aria:
        - 'обычное уведомление — role="status" (aria-live="polite"); ошибка — role="alert"'
        - контейнер .toast-container постоянно присутствует в DOM, тосты добавляются внутрь
        - тип продублирован текстом; цвет левого канта — не единственный носитель
        - '.toast-close: aria-label («Закрыть»)'
      js_required:
        - создавать .toast-container и добавлять тост с классом .toast-enter
        - 'закрытие: снять .toast-enter, поставить .toast-exit и удалить по animationend со страховочным таймером'
        - ограничивать очередь (на витрине — не более трёх) и ставить таймер на паузу при hover/focus
        - тип задаётся классами .info/.success/.warning/.error на .toast (варианты вида .toast-info в CSS нет)
    tokens: ["--space-1", "--space-2", "--space-3", "--space-4", "--border-w", "--border-w-thick", "--color-border", "--color-border-strong", "--color-surface-elevated", "--color-surface-hover", "--color-text", "--color-text-secondary", "--color-text-muted", "--color-text-on-accent", "--color-accent", "--color-accent-soft", "--color-info", "--color-info-soft", "--color-success", "--color-success-soft", "--color-warning", "--color-warning-soft", "--color-error", "--color-error-soft", "--radius", "--radius-xs", "--shadow", "--fs-xs", "--fs-sm", "--fw-medium", "--fw-semi", "--lh-snug", "--z-toast", "--duration-dropdown", "--duration-modal", "--duration-modal-exit", "--duration-exit", "--ease-out"]
    showcase: "components.html#toast"
    examples:
      - "подтверждение отправки длинной формы: «Заявка отправлена» с кнопкой «Открыть»"
      - "результат фоновой операции: «Файл удалён» с действием «Отменить»"
      - "в репозитории: components.html#toast (статичные примеры + демо-тосты из main.js), pages/form.html (.fp-toasts)"
    status: stable
    notes:
      - "2026-07-30: разметка витрины приведена к контракту CSS — было .toast-info/-success/-warning/-error, стало .toast + .info/.success/.warning/.error (как на pages/form.html). Классов вида .toast-info в библиотеке нет и не было."

  - name: toggle
    file: styles/components/toggle.css
    summary: 'Переключатель двух состояний с мгновенным применением: трек, кноб, подпись и опциональные иконки или надписи ON/OFF внутри трека.'
    use_when:
      - настройка включается и применяется сразу, без кнопки «Сохранить»
      - состояний ровно два и оба осмысленны сами по себе («уведомления включены / выключены»)
      - применение асинхронное и на время запроса нужен индикатор в кнобе (.toggle-loading)
      - переключателей несколько подряд и они образуют список настроек (.toggle-group)
    avoid_when:
      - значение отправляется вместе с формой по кнопке — тогда это флажок
      - нужно третье состояние (не задано / частично)
      - выбирается один вариант из нескольких
      - переключается режим отображения из трёх и более вариантов
    instead_use:
      - case: согласие или флажок, отправляемый вместе с формой
        component: inputs
      - case: один вариант из нескольких взаимоисключающих
        component: inputs
      - case: переключение режима из трёх и более вариантов
        component: tabs
    anatomy:
      block: .toggle
      elements: [toggle-track, toggle-thumb, toggle-label, toggle-icon, toggle-icon-on, toggle-icon-off, toggle-text-on, toggle-text-off, toggle-group]
      modifiers: [toggle-sm, toggle-lg, toggle-label-left, toggle-label-top, toggle-label-bottom, toggle-success, toggle-warning, toggle-error, toggle-icons, toggle-text, toggle-loading, toggle-group-horizontal]
      states: [checked, disabled]
    behavior_contract:
      keyboard:
        - внутри лежит настоящий <input type="checkbox"> — Space переключает, Tab фокусирует
        - кольцо фокуса рисуется на .toggle-track от input:focus-visible; визуально скрытый input остаётся в DOM
        - отключённый переключатель не получает фокус (pointer-events:none + disabled на input)
      aria:
        - '<input type="checkbox"> с <label>, либо role="switch" + aria-checked на кастомном элементе'
        - состояние читается текстом подписи, не только положением кноба и цветом трека
        - при асинхронном применении — aria-busy на время запроса и объявление результата через role="status"
      js_required:
        - 'ничего для базовой работы: :checked двигает кноб через CSS'
        - класс .checked нужен только там, где нет настоящего input (кастомная разметка) — держать его в синхроне с aria-checked
        - при асинхронном применении — ставить .toggle-loading и откатывать состояние при ошибке
    tokens: ["--space-2", "--space-3", "--space-4", "--border-w-strong", "--color-border", "--color-border-strong", "--color-surface", "--color-text", "--color-text-muted", "--color-text-disabled", "--color-accent", "--color-accent-hover", "--color-success", "--color-success-hover", "--color-warning", "--color-warning-hover", "--color-error", "--color-error-hover", "--radius-full", "--shadow-sm", "--shadow-focus", "--fs-sm", "--fw-semi", "--duration-press", "--ease-out", "--ease-in-out"]
    showcase: "components.html#toggle"
    examples:
      - "список настроек профиля, применяемых сразу: уведомления, автосохранение, компактный режим"
      - "включение фильтра в панели поиска с немедленным пересчётом выдачи"
      - "в репозитории: components.html#toggle (размеры, цветовые варианты, ON/OFF-текст, loading)"
    status: stable

  - name: tooltip
    file: styles/components/tooltip.css
    summary: Короткая подсказка у элемента, появляющаяся по наведению или фокусу; один компонент с двумя носителями — декларативным [data-tooltip] и узлом .tooltip-popup, координаты которого считает скрипт.
    use_when:
      - нужно расшифровать иконку без подписи или сокращение (IP, IC, IE, S3)
      - 'подсказка вспомогательная: без неё интерфейс остаётся работоспособным'
      - текст короткий; для инженерных расшифровок в несколько строк есть .tooltip-multiline
      - 'по умолчанию — [data-tooltip]: ничего, кроме атрибута, не нужно, работают и hover, и фокус'
      - '.tooltip-popup — когда пузырь обязан выйти за пределы обрезающего контейнера или уклониться от кромки экрана: координаты ставит скрипт'
    avoid_when:
      - внутри нужны ссылки, кнопки или поля — подсказка не удерживает фокус и закрыта для указателя
      - сведения обязательны для выполнения задачи (их надо показать в потоке страницы)
      - подсказка должна оставаться открытой и закрываться явно
      - это меню действий у кнопки
    instead_use:
      - case: панель с интерактивным содержимым, открываемая по клику
        component: dropdown
      - case: обязательное пояснение к полю формы
        component: form-section
      - case: постоянное сообщение в потоке страницы
        component: alerts
    anatomy:
      block: "[data-tooltip]"
      elements: [tooltip-popup, selection-tooltip]
      modifiers: [tooltip-top, tooltip-bottom, tooltip-left, tooltip-right, tooltip-sm, tooltip-lg, tooltip-light, tooltip-primary, tooltip-multiline, tooltip-interactive]
      states: []
    behavior_contract:
      keyboard:
        - подсказка появляется по :focus/:focus-within, а не только по hover — без задержки, в отличие от наведения
        - Escape скрывает подсказку, не убирая фокус с триггера (SC 1.4.13)
        - триггер обязан быть фокусируемым (кнопка, ссылка или tabindex="0")
      aria:
        - 'триггер: aria-describedby на элемент подсказки, либо содержимое дублируется доступным именем'
        - '.tooltip-popup, вставляемый скриптом, скрывается от AT (aria-hidden) — текст уже прочитан с триггера'
        - подсказка не может быть единственным носителем обязательной информации
        - '[data-tooltip] использует cursor:help — курсор не заменяет программную связь'
      js_required:
        - ничего для [data-tooltip] — этот носитель целиком на CSS
        - для .tooltip-popup — вставка в DOM, расчёт стороны и координат, класс стороны (tooltip-top/bottom/left/right) для transform-origin и стрелки, удаление по уходу курсора
        - hover-intent (~400 мс) уже заложен в --tooltip-intent-delay; таймеры в JS дублировать не нужно
    tokens: ["--space-1", "--space-2", "--space-3", "--space-8", "--border-w", "--color-border", "--color-surface", "--color-surface-elevated", "--color-text", "--color-text-on-accent", "--color-accent", "--radius-sm", "--shadow", "--fs-xs", "--fs-sm", "--fw-regular", "--lh-snug", "--lh-normal", "--tooltip-max-w", "--tooltip-intent-delay", "--z-tooltip", "--duration-tooltip", "--duration-dropdown", "--ease-out"]
    showcase: "components.html#tooltip"
    examples:
      - "расшифровка отраслевого сокращения в подписи поля (степень защиты, режим работы, класс изоляции)"
      - "пояснение к иконке-кнопке в плотной панели инструментов"
      - "многострочная справка со стандартным рядом значений, приходящая готовой строкой (.tooltip-multiline)"
      - "в репозитории: components.html#tooltip — позиции, размеры, варианты и многострочный JS-вариант"
    status: stable
    notes:
      - "2026-07-30: из четырёх параллельных реализаций осталось две — по числу способов позиционирования. Удалены обёрточная (.has-tooltip + .tooltip-content, ни одного вхождения в разметке) и маркерная (.tooltip, дублировала position/cursor самого [data-tooltip]); сторона задаётся классом .tooltip-top/-bottom/-left/-right, атрибут data-tooltip-position больше не поддерживается."
      - "Цвет пузыря и стрелки живёт в локальных свойствах --tooltip-bg/--tooltip-fg: вариант (light/primary/тёмная тема) меняет их один раз, правила стрелок цвета не перечисляют."

  - name: tree
    file: styles/components/tree.css
    summary: 'Иерархический список с раскрытием ветвей: шеврон, иконка, подпись и счётчик; обёртка-панель для боковой колонки и состояния пусто/загрузка.'
    use_when:
      - данные вложены на несколько уровней и уровень имеет смысл (папки, разделы каталога, группы устройств)
      - нужно раскрывать и сворачивать ветви, не теряя контекст остальных
      - у ветви полезен счётчик содержимого (.tree-count)
      - дерево живёт в боковой панели как навигация по разделам
    avoid_when:
      - структура плоская — дерево из одного уровня только добавляет отступы
      - 'вложенность глубже 3–4 уровней: подписи уезжают вправо и обрезаются'
      - разделов немного и они равноправны
      - нужен выбор нескольких значений с поиском
    instead_use:
      - case: плоский список разделов боковой панели
        component: sidebar
      - case: несколько раскрываемых блоков без вложенности
        component: accordion
      - case: множественный выбор значений с поиском
        component: picklist
    anatomy:
      block: .tree
      elements: [tree-item, tree-toggle, "tree-toggle-spacer", tree-count, tree-folder, icon, label, tree-filter, tree-tools, tree-sidebar, tree-sidebar-header, tree-sidebar-title, tree-sidebar-actions, tree-sidebar-btn, tree-empty, tree-empty-icon, tree-empty-text, tree-empty-hint, tree-loading]
      modifiers: [tree-sidebar]
      states: [is-open, selected]
    behavior_contract:
      keyboard:
        - стрелки вверх/вниз — по видимым узлам, вправо/влево — раскрыть/свернуть ветвь, Enter — выбрать
        - в дереве ровно один tabindex="0" (roving tabindex), остальные узлы -1
        - кольцо фокуса на .tree-item; узел обязан быть фокусируемым элементом, а не <div> с onclick
      aria:
        - 'контейнер — role="tree", узел — role="treeitem" с aria-expanded для ветвей, вложенный список — role="group"'
        - 'выбранный узел — aria-selected; класс .selected только визуальный'
        - иконка .icon декоративна (aria-hidden), смысл несёт .label
        - 'заглушки .skeleton внутри .tree-loading помечаются aria-hidden, контейнер — aria-busy'
      js_required:
        - переключать is-open на <li class="tree-folder"> — без этого ветвь не раскрывается
        - синхронизировать aria-expanded и aria-selected с классами
        - фильтрация по .tree-filter — скрытие узлов классом, а не инлайновым display
    tokens: ["--space-px", "--space-1", "--space-2", "--space-3", "--space-4", "--space-5", "--space-8", "--space-10", "--border-w", "--border-w-strong", "--color-border-subtle", "--color-surface-hover", "--color-surface-sunken", "--color-text", "--color-text-secondary", "--color-text-muted", "--color-accent", "--color-accent-soft", "--color-warning", "--radius-sm", "--radius-full", "--shadow-focus", "--fs-xs", "--fs-sm", "--fw-medium", "--fw-semi", "--duration-press", "--duration-dropdown", "--ease-out", "--ease-in-out"]
    showcase: "components.html#tree"
    examples:
      - "дерево папок или групп устройств в боковой панели со счётчиками содержимого (.tree-count)"
      - "иерархия разделов каталога с раскрытием подкатегорий"
      - "в репозитории: components.html#tree — дерево на <div>-строках и то же дерево на строках-кнопках со счётчиками (обработчик в инлайн-скрипте страницы)"
    status: stable
    notes:
      - "Реализация одна: параллельный набор .tree-modern-* (состояние .expanded, раскрытие через max-height: 1000px) удалён, строка узла работает и на <div>, и на <button>."
      - "Раскрытие ветви намеренно без анимации (гейт частоты ui-motion-craft §0); движется только шеврон."
      - "Заглушки загрузки — компонент skeleton; собственных keyframes у дерева больше нет."

  - name: typography
    file: styles/components/typography.css
    summary: Витринный блок образцов типографики — строки «имя тега | живой образец | разрешённый шрифт», показывающие, чем реально рендерится текст в активном бренде.
    use_when:
      - нужно показать шкалу h1–h6/p/small/code как спецификацию, а не как оформление страницы
      - проверяется, какой шрифт подставила тема бренда каждому уровню
      - в документации дизайн-системы нужен раздел «типографика» с живыми примерами
      - сравниваются несколько брендов на одном экране (блок вкладывается в контейнер с data-brand)
    avoid_when:
      - это обычный текст страницы — заголовки и абзацы оформляет base/reset.css и тема
      - нужен блок кода или моноширинная вставка в тексте
      - показывается палитра или токены, а не шрифты
    instead_use:
      - case: моноширинная строка или фрагмент кода в контенте
        component: code-panel
      - case: обычный текстовый контент страницы
        component: null
    anatomy:
      block: .type-specimen
      elements: [type-specimen__row, type-specimen__label, type-specimen__sample, type-specimen__meta]
      modifiers: []
      states: []
    behavior_contract:
      keyboard:
        - блок статичен, фокусируемых элементов не содержит
      aria:
        - 'образцы внутри .type-specimen__sample — настоящие h1–h6: они попадают в структуру заголовков страницы, поэтому блок размещают там, где такая иерархия допустима'
        - '.type-specimen__label — имя тега текстом, не подменяется цветом или начертанием'
        - на узких экранах .type-specimen__meta скрывается через display:none — сведения о шрифте вторичны и не должны быть единственным носителем смысла
      js_required:
