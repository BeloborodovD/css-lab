      - "Легаси .veza-header* (печатная шапка внешнего даташита) удалён из файла: к таблице он отношения не имел, шапка документа — print-sheet/spec-sheet."

  - name: tabs
    file: styles/components/tabs.css
    summary: Переключение равноправных разделов одного экрана в трёх стилях — подчёркивание, пилюли и сегментированный контрол; горизонтально или вертикально.
    use_when:
      - контента больше, чем помещается, но разделы равноправны и порядок обхода произвольный
      - переключается представление одних и тех же данных (день / неделя / месяц — .tabs-boxed)
      - разделов 2–7 и их подписи короткие
      - нужен счётчик у раздела (.tab-badge)
    avoid_when:
      - разделы должны проходиться строго по порядку и фиксировать прогресс
      - разделов больше семи или подписи длинные — лента переполняется
      - все разделы нужно видеть одновременно на одном экране
      - это навигация между страницами, а не внутри одной
    instead_use:
      - case: строгая последовательность этапов с фиксацией прогресса
        component: steps
      - case: много разделов, которые надо разворачивать по одному на месте
        component: accordion
      - case: переход между страницами сайта
        component: nav
      - case: переключение фильтров-значений, а не разделов
        component: filter-pills
    anatomy:
      block: .tabs
      elements: [tabs-list, tab, tab-icon, tab-badge, tab-panel]
      modifiers: [tabs-underline, tabs-pills, tabs-boxed, tabs-sm, tabs-lg, tabs-vertical]
      states: [active, disabled, fade, slide]
    behavior_contract:
      keyboard:
        - стрелки влево/вправо (вверх/вниз в .tabs-vertical) перемещают между вкладками, Home/End — к краям
        - в ленте вкладок ровно один tabindex="0" (roving tabindex), остальные -1
        - Tab из ленты ведёт в активную панель, а не на следующую вкладку
        - отключённая вкладка пропускается при обходе
      aria:
        - '.tabs-list — role="tablist" (+ aria-orientation="vertical" для вертикального варианта)'
        - '.tab — role="tab", aria-selected, aria-controls на панель; .tab-panel — role="tabpanel" + aria-labelledby'
        - неактивные панели скрыты для AT (display:none приходит из .tab-panel без .active)
        - счётчик .tab-badge озвучивается вместе с подписью вкладки
      js_required:
        - переставлять .active на .tab и на соответствующем .tab-panel (без JS видна только первая вкладка)
        - вести roving tabindex и обработку стрелок
        - синхронизировать aria-selected с классом .active
    tokens: ["--space-1", "--space-2", "--space-3", "--space-4", "--space-6", "--border-w", "--border-w-strong", "--color-border", "--color-surface", "--color-surface-hover", "--color-surface-sunken", "--color-text", "--color-text-muted", "--color-text-disabled", "--color-text-on-accent", "--color-accent", "--color-accent-soft", "--color-accent-text", "--radius-xs", "--radius-sm", "--radius-full", "--shadow-xs", "--shadow-focus", "--fs-xs", "--fs-sm", "--fs-base", "--fw-medium", "--fw-semi", "--lh-tight", "--t", "--t-fast", "--ease", "--ease-out"]
    showcase: "components.html#tabs"
    examples:
      - "разделы карточки изделия: описание, характеристики, документы, аналоги"
      - "переключение периода отчёта день / неделя / месяц сегментированным контролом (.tabs-boxed)"
      - "в репозитории: components.html#tabs (три стиля показаны статично, обработчика на витрине нет), pages/datasheet.html (.ds-tabs > .tabs)"
    status: stable

  - name: tag-cloud
    file: styles/components/tag-cloud.css
    summary: Два лёгких блока для пустого состояния поиска — облако тегов текстовыми ссылками с четырьмя ступенями кегля и компактный нумерованный список «популярное».
    use_when:
      - у поиска или каталога пустой стартовый экран и его нужно заполнить точками входа
      - популярность значения передаётся размером и цветом ссылки, а не числом в бейдже
      - нужен компактный рейтинг-список из 3–7 строк со счётчиками справа
      - блоки должны занимать мало высоты и не выглядеть карточками
    avoid_when:
      - теги — это выбранные фильтры, которые можно снять
      - тег — метка-статус внутри карточки или строки таблицы
      - список длинный и по нему нужен поиск и мультивыбор
      - на экране нет данных вообще и нужно объяснить, что делать дальше
    instead_use:
      - case: снимаемые фильтры текущей выборки
        component: filter-pills
      - case: метка или статус внутри карточки
        component: chip
      - case: выбор значений из большого справочника
        component: picklist
      - case: экран без данных с объяснением и действием
        component: empty-state
    anatomy:
      block: .tag-cloud
      elements: [tag-cloud__item, tag-cloud__tag, tag-cloud__count, trending-list, trending-list__item, trending-list__link, trending-list__source, trending-list__count, home-empty-aside, home-empty-aside__block, home-empty-aside__title, skeleton-line]
      modifiers: ["--xs", "--sm", "--md", "--lg", "--top", "--skeleton", "--numbered"]
      states: []
    behavior_contract:
      keyboard:
        - каждый тег — <a> или <button> в Tab-порядке, кольцо фокуса через --shadow-focus
        - список «популярное» — обычные ссылки, порядок обхода совпадает с визуальным
      aria:
        - '.tag-cloud — <ul role="list">, .trending-list — <ol> (порядок значим)'
        - 'размер шрифта не является носителем смысла: вес темы читается из .tag-cloud__count текстом'
        - '.trending-list__source — видимая текстовая метка источника, не только цветовая плашка'
        - скелетон-варианты (--skeleton) помечаются aria-hidden, контейнер — aria-busy
      js_required:
        - раздавать ступени --xs/--sm/--md/--lg по частоте и класс --top для лидеров
        - снимать модификатор --skeleton после загрузки данных
    tokens: ["--space-px", "--space-1", "--space-2", "--space-3", "--space-5", "--border-w", "--border-w-strong", "--color-border-subtle", "--color-surface-sunken", "--color-surface-active", "--color-text", "--color-text-secondary", "--color-text-muted", "--color-text-disabled", "--color-accent", "--color-accent-soft", "--radius-xs", "--shadow-focus", "--fs-xs", "--fs-sm", "--fs-base", "--fs-md", "--fw-regular", "--fw-medium", "--fw-semi", "--lh-snug", "--lh-relaxed", "--tracking-wide", "--duration-pulse", "--t-fast", "--ease"]
    showcase: "components.html#search-home-empty"
    examples:
      - "стартовый экран поиска до первого запроса: облако популярных тем + список частых запросов"
      - "подвал раздела справочника с точками входа по темам"
      - "в репозитории: components.html#search-home-empty (пара «trending + облако тегов»)"
    status: stable
    notes:
      - "Четыре ступени кегля — соседние значения типографической шкалы (--fs-xs → --fs-sm → --fs-base → --fs-md), а не подобранные вручную 12–15px."
      - "Пульс скелетонов общий с компонентом skeleton (keyframes skeleton-pulse, --duration-pulse, linear): собственной анимации у облака нет."

  - name: timeline
    file: styles/components/timeline.css
    summary: 'Лента событий во времени: вертикальная линия с точками, у каждого события время, заголовок, описание и семантический статус.'
    use_when:
      - 'показывается история уже произошедшего: журнал синхронизаций, аудит, этапы заказа'
      - у каждой записи есть отметка времени и исход (успех, предупреждение, ошибка, информация)
      - порядок записей значим и читается сверху вниз
      - нужна компактная лента внутри карточки (.timeline-compact / .timeline-simple)
    avoid_when:
      - это будущий процесс, где важно «где я сейчас и сколько осталось»
      - записей сотни и нужны фильтрация, поиск и уровни логирования
      - события однородны и удобнее читаются построчно в таблице
      - нужны всплывающие уведомления о только что случившемся
    instead_use:
      - case: незавершённый пошаговый процесс с текущим шагом
        component: steps
      - case: большой поток машинных записей с уровнями и фильтрами
        component: logs
      - case: однородный журнал с сортировкой по колонкам
        component: table
      - case: сообщение о результате только что выполненного действия
        component: toast
    anatomy:
      block: .timeline
      elements: [timeline-item, timeline-dot, timeline-content, timeline-time, timeline-title, timeline-description]
      modifiers: [timeline-icon, timeline-alternate, timeline-horizontal, timeline-compact, timeline-simple]
      states: [success, warning, error, info]
    behavior_contract:
      keyboard:
        - лента статична; интерактивные элементы внутри .timeline-content — в обычном Tab-порядке
        - '.timeline-horizontal скроллится вбок: обёртке нужен tabindex="0" и доступное имя'
      aria:
        - 'разметка — <ol>/<li>: порядок событий значим'
        - время в <time datetime="...">, не только текстом
        - исход события назван словом в заголовке или описании — цвет точки не единственный носитель
        - '.timeline-dot декоративен (aria-hidden)'
      js_required:
        - ничего для отображения; при дозагрузке истории новые записи добавляются в конец списка без перерисовки существующих
    tokens: ["--space-1", "--space-2", "--space-3", "--space-4", "--space-6", "--space-8", "--space-10", "--space-12", "--border-w", "--border-w-strong", "--border-w-thick", "--color-border", "--color-border-strong", "--color-surface", "--color-text", "--color-text-secondary", "--color-text-muted", "--color-text-on-accent", "--color-success", "--color-warning", "--color-error", "--color-info", "--radius", "--radius-full", "--fs-xs", "--fs-sm", "--fs-base", "--fw-semi", "--lh-normal", "--z-raised"]
    showcase: "components.html#timeline"
    examples:
      - "лента событий системы: синхронизации, повторы, ошибки подключения с отметками времени"
      - "история обработки заявки: создана → согласована → отгружена"
      - "в репозитории: components.html#timeline, pages/dashboard.html"
