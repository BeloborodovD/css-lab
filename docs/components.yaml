  - name: spinner
    file: styles/components/spinner.css
    summary: Индикаторы неопределённой загрузки — вращающееся кольцо и его варианты (точки, полосы, пульс), плюс контейнеры «загрузка блока» и вуаль поверх области.
    use_when:
      - действие занимает неизвестное время и его нельзя выразить процентами (отправка формы, запрос к API)
      - индикатор нужен внутри кнопки или строки рядом с текстом (.loading-inline)
      - надо перекрыть уже отрисованную область на время обновления (.loading-overlay)
      - место под индикатор маленькое и рисовать форму будущего контента бессмысленно
    avoid_when:
      - грузится крупный блок известной структуры — пустой крутящийся круг на весь экран хуже заглушек
      - прогресс измерим и пользователю важно видеть остаток
      - загрузка заведомо мгновенная (индикатор успеет только мигнуть)
      - нужен статус фонового сохранения в интерфейсе редактирования
    instead_use:
      - case: загрузка списка или карточки известной формы
        component: skeleton
      - case: измеримый прогресс в процентах
        component: progress
      - case: статус автосохранения формы
        component: save-status
    anatomy:
      block: .spinner
      elements: [loading-container, loading-text, loading-overlay, loading-inline]
      modifiers: [spinner-xs, spinner-sm, spinner-md, spinner-lg, spinner-xl, spinner-smooth, spinner-gradient, spinner-dots, spinner-pulse, spinner-bars, spinner-ring, spinner-primary, spinner-white, spinner-success, spinner-warning, spinner-error, spinner-info]
      states: []
    behavior_contract:
      keyboard:
        - индикатор не фокусируется; кнопка с индикатором остаётся в Tab-порядке и получает disabled/aria-disabled
      aria:
        - контейнер загрузки — role="status" с текстовой подписью, сам круг aria-hidden
        - перекрытая .loading-overlay область помечается aria-busy="true"
        - .loading-text обязателен, если индикатор — единственный признак ожидания
      js_required:
        - показывать индикатор только на время реального ожидания и снимать по завершении в любом исходе, включая ошибку
        - блокировать повторную отправку, пока индикатор виден
    tokens: ["--color-border", "--color-accent", "--color-accent-soft", "--color-accent-hover", "--color-success", "--color-success-soft", "--color-warning", "--color-warning-soft", "--color-error", "--color-error-soft", "--color-info", "--color-info-soft", "--color-text-muted", "--surface-veil", "--radius-full", "--space-1", "--space-2", "--space-3", "--space-8", "--fs-sm", "--z-raised", "--ease-in-out"]
    showcase: "components.html#spinner"
    examples:
      - "кнопка отправки формы на время запроса: индикатор внутри кнопки, повторное нажатие заблокировано"
      - "обновление уже отрисованной таблицы под полупрозрачной вуалью (.loading-overlay)"
      - "в репозитории: components.html#spinner, pages/login.html (.login-submit .spinner), pages/form.html (.fp-submit .spinner)"
    status: stable
    notes:
      - "Заглушек здесь нет: прежний мёртвый набор .skeleton/.skeleton-text/.skeleton-avatar/.skeleton-image/.skeleton-button (его целиком перекрывал components/skeleton.css) удалён — скелетон в библиотеке один."

  - name: stats
    file: styles/components/stats.css
    summary: 'Карточка метрики: крупное число, подпись, тренд со знаком и опциональные иконка, мини-прогресс или спарклайн; плюс сетка таких карточек.'
    use_when:
      - на дашборде нужно показать 2–6 ключевых чисел с динамикой к прошлому периоду
      - число важнее контекста и должно читаться с расстояния (табличные цифры, крупный кегль)
      - метрика имеет семантический статус — норма, предупреждение, ошибка (цветной левый кант)
      - нужна компактная встроенная метрика в строке фильтров или шапке (.stat-mini)
    avoid_when:
      - чисел больше десятка и они сравниваются между собой построчно
      - это характеристики изделия, а не измеряемые показатели
      - число само по себе не осмысленно без графика
      - нужен просто счётчик у пункта меню или вкладки
    instead_use:
      - case: много однородных числовых строк для сравнения и сортировки
        component: table
      - case: паспортные характеристики изделия
        component: spec-sheet
      - case: счётчик у элемента навигации или вкладки
        component: badge
      - case: одиночный измеримый прогресс
        component: progress
    anatomy:
      block: .stat-card
      elements: [stat-value, stat-label, stat-trend, stat-icon, stat-content, stat-sparkline, stat-progress, stat-progress-label, stat-mini, stat-mini-value, stat-mini-label, stat-mini-dot, stats-grid]
      modifiers: [stat-card-horizontal, stat-card-icon-right, stat-card-compact, stat-card-tile, stat-card-lg, stat-card-primary, stat-card-success, stat-card-warning, stat-card-error, stat-card-info, stats-grid-2, stats-grid-3, stats-grid-4]
      states: [up, down, neutral, success, warning, error]
    behavior_contract:
      keyboard:
        - карточка по умолчанию не интерактивна; если она ведёт в отчёт — оборачивается в <a>/<button> целиком
      aria:
        - направление тренда дублируется текстом или знаком, не только цветом класса .up/.down
        - '.stat-value и .stat-label связаны в одну доступную подпись (aria-labelledby или порядок чтения)'
        - при живом обновлении числа контейнер получает aria-live="polite"
      js_required:
        - "подставлять значение и класс тренда; полоса внутри .stat-progress — компонент progress, ширину задаёт инлайн-стиль на .progress-bar"
        - при периодическом обновлении менять текст, не пересоздавая карточку (иначе AT читает её заново)
    tokens: ["--space-1", "--space-2", "--space-3", "--space-4", "--space-5", "--space-6", "--border-w", "--border-w-thick", "--color-border", "--color-border-strong", "--color-border-subtle", "--color-surface", "--color-surface-sunken", "--color-text", "--color-text-muted", "--color-accent", "--color-accent-soft", "--color-success", "--color-success-soft", "--color-warning", "--color-warning-soft", "--color-error", "--color-error-soft", "--color-info", "--color-info-soft", "--radius", "--radius-sm", "--radius-full", "--shadow-sm", "--fs-xs", "--fs-sm", "--fs-2xl", "--fs-3xl", "--fs-4xl", "--fw-semi", "--fw-bold", "--lh-tight", "--tracking-tight", "--t", "--t-slow", "--ease"]
    showcase: "components.html#stats"
    examples:
      - "шапка дашборда: 4 ключевых показателя за период с процентом изменения"
      - "сводка по разделу над таблицей: всего записей, успешных, с ошибкой, среднее время"
      - "в репозитории: components.html#stats, pages/dashboard.html; плитка .stat-card-tile — в панели витрины и в components.html#sidebar"
    status: stable
    notes:
      - "Метрика в библиотеке одна: прежний дубль .sidebar-stat* из sidebar.css заменён вариантом .stat-card-tile."
      - "Собственной полосы прогресса у карточки нет: .stat-progress-bar/-fill удалены, внутрь кладётся компонент progress (.progress.progress-xs)."

  - name: steps
    file: styles/components/steps.css
    summary: 'Индикатор пошагового процесса: пронумерованные точки с коннекторами и состояниями «пройден / текущий / предстоит / ошибка», горизонтально или вертикально.'
    use_when:
      - длинная форма разбита на этапы и пользователю нужно видеть, где он и сколько осталось
      - 'порядок этапов обязателен: следующий недоступен, пока не завершён предыдущий'
      - на каком-то шаге возможна ошибка валидации, и её надо показать прямо в индикаторе (.step.error)
      - процесс идёт во времени и шаги отмечаются по мере выполнения
    avoid_when:
      - разделы равноправны и переключаются в любом порядке
      - разделов больше 5–6 — индикатор превращается в мелкую нечитаемую ленту
      - это история уже случившихся событий с временными метками
      - переключается только представление одних и тех же данных
    instead_use:
      - case: равноправные разделы с произвольным порядком переключения
        component: tabs
      - case: лента произошедших событий с временем
        component: timeline
      - case: измеримый прогресс одной операции
        component: progress
    anatomy:
      block: .steps
      elements: [step, step-number, step-icon, step-title, step-description, step-content, step-connector]
      modifiers: [steps-sm, steps-lg, steps-vertical, steps-clickable]
      states: [completed, active, pending, error]
    behavior_contract:
      keyboard:
        - 'при .steps-clickable шаг — <button>: Tab по шагам, Enter/Space переход, кольцо фокуса на .step-number'
        - недоступные шаги получают disabled или aria-disabled и не ловят фокус
        - при переходе фокус уходит на первое поле нового шага, а не остаётся на индикаторе
      aria:
        - 'контейнер: <ol> с aria-label процесса, шаг — <li>'
        - 'текущий шаг помечается aria-current="step"; класс .active — только визуальный'
        - состояние «пройден»/«ошибка» дублируется текстом (.step-description или sr-only), а не только цветом и глифом ✓/!
        - '.step-number::before печатает счётчик — собственный текст номера в разметке дублировать не нужно'
      js_required:
        - переставлять классы completed/active/pending/error по мере прохождения
        - при .steps-clickable — разрешать переход только на уже пройденные шаги
        - синхронизировать aria-current с классом .active
    tokens: ["--space-1", "--space-2", "--space-3", "--space-6", "--border-w-strong", "--color-border", "--color-surface", "--color-text", "--color-text-muted", "--color-text-on-accent", "--color-accent", "--color-accent-text", "--color-error", "--radius-full", "--shadow-focus", "--fs-xs", "--fs-sm", "--fs-base", "--fw-medium", "--fw-semi", "--t-fast", "--ease"]
    showcase: "components.html#steps"
    examples:
      - "мастер длинной технической формы-опросника, разбитой на 3–5 разделов с валидацией на каждом"
      - "оформление заказа: корзина → доставка → оплата → подтверждение"
      - "в репозитории: components.html#steps, pages/form.html (.fp-steps > .steps)"
    status: stable
    notes:
      - "Номер шага — единственный источник: его считает CSS (counter(step) в .step-number::before), поэтому .step-number в разметке остаётся пустым. Цифра текстом накладывается на счётчик."

  - name: swatch-picker
    file: styles/components/swatch-picker.css
    summary: 'Выбор цветов из палитры образцов: контрол с чипами выбранного и панель с поиском, сгруппированной сеткой образцов и массовыми действиями.'
    use_when:
      - 'значение — цвет, и его нельзя выбрать по названию: нужно видеть сам образец'
      - палитра большая и сгруппирована по семействам, требуется поиск по коду и названию
      - можно выбрать несколько цветов (основной, дополнительный) — выбранные показываются чипами
      - у бренда есть частые цвета, которые надо поднять над общей палитрой (.swatch-picker__section)
    avoid_when:
      - варианты различимы текстом — образец только шумит
      - нужен произвольный цвет, а не значение из справочника
      - выбирается ровно одно значение из короткого списка
      - палитра показывается как справочник для чтения, без выбора
    instead_use:
      - case: множественный выбор текстовых значений из справочника
        component: picklist
      - case: одно значение из списка с поиском по вводу
        component: combobox
      - case: показ палитры без выбора (справочник RAL)
        component: null
    anatomy:
      block: .swatch-picker
      elements: [swatch-picker__control, swatch-picker__placeholder, swatch-picker__chip, swatch-picker__chip-color, swatch-picker__chip-remove, swatch-picker__toggle, swatch-picker__caret, swatch-picker__panel, swatch-picker__search, swatch-picker__result-count, swatch-picker__no-match, swatch-picker__grid, swatch-picker__family, swatch-picker__section, swatch-picker__section-title, swatch-picker__selected, swatch-picker__actions, swatch-picker__actions-count, swatch-picker__hint, swatch, swatch__code]
      modifiers: ["--inline", "--top", "--sheet"]
      states: [is-open, is-selected, is-filtered]
    behavior_contract:
      keyboard:
        - '.swatch-picker__toggle — клавиатурная точка входа (цель ≥24px), Enter/Space открывает панель'
        - стрелки перемещают фокус по образцам сетки, Enter/Space переключает выбор
        - Escape закрывает панель и возвращает фокус на контрол; закрытая панель вне Tab-порядка (visibility:hidden)
        - удаление чипа и «очистить всё» доступны с клавиатуры
      aria:
        - 'контрол/тоггл: aria-expanded, aria-controls на панель; панель — role="listbox" aria-multiselectable="true"'
        - 'образец — <button role="option"> с aria-pressed/aria-selected и текстовым кодом внутри (.swatch__code)'
        - код цвета обязателен в разметке — цвет не может быть единственным носителем значения
        - '.swatch-picker__result-count — носитель aria-live для числа найденного'
      js_required:
        - переключать .is-open и синхронизировать aria-expanded
        - фильтровать поиском через класс .is-filtered на .swatch и .swatch-picker__family (не инлайновый display)
        - вести чипы выбранного и счётчики, скрывать .swatch-picker__placeholder при непустом выборе
        - замерять свободное место и ставить модификатор --top при столкновении с нижней кромкой вьюпорта
        - подставлять --transform-origin от триггера; на мобильном использовать вариант --sheet
    tokens: ["--space-px", "--space-1", "--space-2", "--space-3", "--space-4", "--space-8", "--border-w", "--border-w-strong", "--color-border", "--color-border-strong", "--color-surface", "--color-surface-sunken", "--color-text", "--color-text-muted", "--color-text-disabled", "--color-accent", "--color-error", "--color-swatch-inset", "--color-scrim-light", "--color-on-scrim", "--radius-xs", "--radius-sm", "--radius-lg", "--shadow", "--shadow-lg", "--shadow-focus", "--fs-xs", "--fs-sm", "--fs-base", "--fs-lg", "--fw-bold", "--lh-tight", "--tracking-wide", "--z-dropdown", "--z-drawer", "--z-raised", "--transform-origin", "--duration-press", "--duration-dropdown", "--duration-exit", "--duration-modal", "--duration-modal-exit", "--ease-out", "--ease-in-out", "--ease-drawer"]
    showcase: "components.html#swatch-picker"
    examples:
      - "выбор цвета окраски изделия из каталога RAL в форме заказа (несколько цветов: корпус, элементы)"
      - "подбор фирменной палитры: секция «частые цвета бренда» над полной сеткой образцов"
      - "в репозитории: components.html#swatch-picker; справочник цветов без выбора — ral-colors.html"
      - "поле поиска внутри панели переиспользует .search-input/.search-clear из components/search.css (исторический донор компонента — внутренняя форма-опросник)"
    status: new

  - name: table
    file: styles/components/table.css
    summary: 'Таблица данных: заголовки-капсы, тонкие разделители, опциональные полосы/рамки/hover, липкая первая колонка, редактируемый режим и разворот строк в карточки на мобильном.'
    use_when:
      - 'данные однородны: у всех строк один набор колонок, их сравнивают и сортируют'
      - строк много и нужны компактный режим, горизонтальный скролл с тенями-подсказками, липкая первая колонка
      - нужен массив редактируемых однотипных строк с одной шапкой на весь массив (.table--form)
      - таблица уходит в печать (шапка повторяется на каждой странице, строки не режутся)
    avoid_when:
      - у каждой строки свой набор полей — таблица вырождается в разреженную сетку
      - это пары «параметр — значение» одного объекта
      - показываются 3–6 метрик с трендом
      - строка — сложная карточка с картинкой, описанием и действиями
    instead_use:
      - case: характеристики одного объекта парами «параметр — значение»
        component: spec-sheet
      - case: таблица внутри печатного паспорта изделия (.spec-sheet / .print-sheet)
        component: spec-sheet (.spec-table)
      - case: ключевые метрики с динамикой
        component: stats
      - case: строка-карточка со сложным содержимым, где колонки не выравниваются
        component: row-card
      - case: результат поиска с заголовком, сниппетом и метаданными
        component: search-result-card
    anatomy:
      block: .table
      elements: [table-wrap, table-responsive, table-sticky-col, table-card-mobile, table-params, table__actions, unit]
      modifiers: ["--striped", "--hover", "--compact", "--form", "--bordered"]
      states: [is-highlighted, is-selected, scroll-left, scroll-right]
    behavior_contract:
      keyboard:
        - сортируемый заголовок — <button> внутри <th>, работает по Enter/Space
        - в .table--form поля внутри ячеек в естественном Tab-порядке; кольцо фокуса рисует ячейка (td:focus-within), у поля рамки нет
        - '.table-responsive скроллится с клавиатуры: обёртке нужен tabindex="0" и доступное имя'
      aria:
        - настоящая <table> с <thead>, <th scope="col">/<th scope="row"> и <caption> или aria-label
        - 'направление сортировки — aria-sort на <th>'
        - выделенная строка — aria-selected, класс .is-selected только визуальный
        - для .table-card-mobile каждая <td> обязана нести data-label — на узком экране это единственный заголовок колонки
      js_required:
        - переключать .scroll-left/.scroll-right у .table-responsive по позиции прокрутки (иначе тени-подсказки не появятся)
        - сортировка, выделение строк и добавление/удаление строк в .table--form
    tokens: ["--space-1", "--space-2", "--space-3", "--space-4", "--border-w", "--border-w-strong", "--color-border", "--color-border-subtle", "--color-border-strong", "--color-surface", "--color-surface-hover", "--color-text", "--color-text-secondary", "--color-text-muted", "--color-accent", "--color-accent-soft", "--color-warning-soft", "--radius", "--radius-sm", "--fs-xs", "--fs-sm", "--fs-base", "--fs-md", "--fw-regular", "--fw-medium", "--fw-semi", "--fw-bold", "--lh-snug", "--tracking-wide", "--font-sans", "--z-raised", "--t-fast", "--ease"]
