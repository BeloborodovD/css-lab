  - name: search-result-card
    file: styles/components/search-result-card.css
    summary: Карточка результата поиска — заголовок-ссылка, оценка релевантности, сниппет с подсветкой совпадений, метаданные источника и действия.
    use_when:
      - Выдача поиска собирается из разных источников и источник надо различать полосой и бейджем.
      - В сниппете нужно подсвечивать совпадения (mark) и сохранять переносы длинных технических строк.
      - Карточке нужны состояния «выбрана» (мастер-деталь) и «загружается» (скелетон) без отдельного компонента.
      - Нужен компактный вариант для боковой колонки с обрезкой сниппета до двух строк.
    avoid_when:
      - Элементы однородны и сравниваются по колонкам — выдача превращается в таблицу.
      - Карточка описывает товар или сущность, а не найденный документ.
      - Это строка редактируемой формы.
    instead_use:
      - case: однородные данные с сортировкой по колонкам
        component: table
      - case: карточка товара или сущности каталога
        component: cards
      - case: строка массива в форме
        component: row-card
      - case: пустая выдача
        component: empty-state
    anatomy:
      block: .search-result-card
      elements: [__header, __title, __score, __snippet, __meta, "__meta-item", "__source-badge", __actions, __action]
      modifiers: ["--compact", "--selected", "--skeleton", "__source-badge--wiki", "__source-badge--forum", "__source-badge--catalog"]
      states: ["[data-source]", "[aria-pressed]"]
    behavior_contract:
      keyboard:
        - Кликабелен заголовок-ссылка, а не вся карточка; карточка подсвечивается через :focus-within.
        - Кнопки действий — нативные button с видимым фокусом; кнопки-переключатели держат aria-pressed.
      aria:
        - Источник передаётся текстом бейджа, цветная полоса слева — дублирующий носитель.
        - Оценка релевантности нуждается в поясняющем имени, иначе читается как бессмысленное число.
        - Скелетон помечается aria-hidden либо контейнер объявляет состояние загрузки; пульсация смысла не несёт.
        - Подсветка совпадений размечается тегом mark.
      js_required:
        - Проставлять data-source, вставлять подсветку совпадений и снимать модификатор --skeleton по приходу данных.
        - Управлять --selected при мастер-детальной раскладке.
    tokens: ["--color-surface", "--color-surface-sunken", "--color-border", "--color-border-strong", "--color-border-subtle", "--color-text", "--color-text-secondary", "--color-text-muted", "--color-text-disabled", "--color-accent", "--color-accent-soft", "--color-accent-border", "--color-highlight", "--color-highlight-text", "--color-source-wiki", "--color-source-wiki-soft", "--color-source-wiki-text", "--color-source-forum", "--color-source-forum-soft", "--color-source-forum-text", "--color-source-catalog", "--color-source-catalog-soft", "--color-source-catalog-text", "--font-mono", "--border-w", "--border-w-thick", "--border-w-strong", "--radius", "--radius-sm", "--radius-xs", "--radius-full", "--shadow-sm", "--shadow-focus", "--space-1", "--space-2", "--space-3", "--space-4", "--space-5", "--fs-xs", "--fs-sm", "--fs-md", "--fw-medium", "--fw-semi", "--lh-snug", "--lh-normal", "--tracking-tight", "--tracking-wide", "--t", "--t-fast", "--ease", "--ease-in-out"]
    showcase: "components.html#search-result-card"
    examples:
      - "витрина: components.html#search-result-card — выдача по трём источникам, --selected, --skeleton и компактный вариант"
      - Выдача полнотекстового поиска по нескольким источникам (вики, форум, каталог) с подсветкой совпадений
      - "Мастер-деталь: список найденного слева, документ справа (варианты --compact и --selected)"
    status: stable

  - name: search
    file: styles/components/search.css
    summary: Поле ввода поискового запроса с иконкой, кнопкой очистки и опциональным списком подсказок под полем.
    use_when:
      - нужен свободный текстовый запрос по содержимому страницы или раздела (каталог, список, таблица)
      - под полем должны появляться подсказки/автодополнение с группировкой и подсветкой совпавшего фрагмента
      - поиск выносится в hero-блок главной страницы (высокое поле 56px, вариант search-input-hero)
      - иконка поиска в плотной панели должна раскрываться в поле по фокусу (search-input-expandable)
    avoid_when:
      - значение выбирается из известного конечного списка, а не набирается свободно
      - нужен глобальный клавиатурный вход в приложение (Cmd+K) с командами и навигацией
      - это обычное текстовое поле формы без семантики поиска и без кнопки очистки
      - требуется мультивыбор с чипами выбранного
    instead_use:
      - case: выбор одного значения из списка с фильтрацией по вводу
        component: combobox
      - case: глобальный вызов команд и переходов с клавиатуры
        component: command-palette
      - case: множественный выбор значений из справочника с чипами
        component: picklist
      - case: обычное поле формы
        component: inputs
    anatomy:
      block: .search-input
      elements: [search-icon, search-clear, search-btn, search-dropdown, search-dropdown-item, search-dropdown-item-icon, search-dropdown-item-text, search-dropdown-item-meta, search-dropdown-group, search-dropdown-empty, search-highlight]
      modifiers: [search-input-sm, search-input-lg, search-input-hero, search-input-filled, search-input-rounded, search-input-button, search-input-expandable, search-input-loading]
      states: [has-value, expanded, open, highlighted]
    behavior_contract:
      keyboard:
        - Tab фокусирует поле; :focus-within подсвечивает рамку и иконку и раскрывает .search-dropdown
        - стрелки вверх/вниз перемещают .highlighted по .search-dropdown-item, Enter выбирает
        - Escape закрывает список подсказок и не теряет введённый текст
        - кнопка .search-clear достижима с клавиатуры и не является единственным способом очистки
      aria:
        - 'input: type="search" либо role="combobox" + aria-expanded + aria-controls на списке'
        - 'список подсказок: role="listbox", пункты role="option", активный — aria-activedescendant'
        - '.search-clear: aria-label («Очистить поиск»), иконка внутри aria-hidden'
        - изменение числа найденного объявляется через aria-live-контейнер вне компонента
      js_required:
        - ставить/снимать .has-value (иначе крестик работает только через :not(:placeholder-shown))
        - открывать/закрывать .search-dropdown классом .open вне сценария :focus-within
        - двигать .highlighted по клавишам и оборачивать совпадение в span.search-highlight
        - для search-input-expandable — ставить .expanded при клике по свёрнутому полю
    tokens: ["--space-1", "--space-2", "--space-3", "--space-4", "--space-6", "--space-8", "--space-10", "--space-12", "--border-w", "--border-w-strong", "--color-border", "--color-border-subtle", "--radius-xs", "--radius-sm", "--radius", "--radius-full", "--color-surface", "--color-surface-hover", "--color-surface-sunken", "--color-text", "--color-text-muted", "--color-text-on-accent", "--color-accent", "--color-accent-hover", "--color-highlight", "--color-highlight-text", "--fs-xs", "--fs-sm", "--fs-base", "--fs-md", "--fs-lg", "--fw-medium", "--fw-semi", "--tracking-wide", "--shadow-sm", "--shadow", "--shadow-focus", "--z-dropdown", "--t-fast", "--t-slow", "--ease"]
    showcase: "components.html#search"
    examples:
      - "поиск по каталогу товаров или списку записей с подсказками по мере ввода"
      - "крупное поле поиска в hero-блоке стартовой страницы портала"
      - "в репозитории: components.html#search (базовый размер и search-input-sm); демо-страницы поиск не используют — там собственный .search-bar на .input"
    status: stable

  - name: sidebar
    file: styles/components/sidebar.css
    summary: 'Боковая панель приложения: фиксированная колонка, мобильная шторка с подложкой, ручка ресайза и наполнение — навигация, виджеты, карточка пользователя, теги, лента активности.'
    use_when:
      - у страницы есть постоянная левая или правая колонка с разделами и счётчиками
      - в колонке нужны не только ссылки, но и виджеты — карточка пользователя, быстрые метрики, теги, активность
      - панель должна тянуться мышью за край (.sidebar--resizable + .sidebar-resize-handle) с запоминанием ширины
      - на узком экране та же панель обязана уезжать за кромку и возвращаться по кнопке
    avoid_when:
      - панель нужна разово, поверх контента, с фокус-ловушкой и закрытием по Escape
      - это горизонтальная навигация верхнего уровня
      - нужна только каркасная сетка «панель + контент» без содержимого панели
      - контент панели — фильтры каталога с применением/сбросом
    instead_use:
      - case: временная панель поверх контента с модальным поведением
        component: drawer
      - case: только сетка приложения, сдвиг центра и фиксированный подвал
        component: app-layout
      - case: горизонтальное меню страницы
        component: nav
      - case: панель фильтров каталога
        component: filter-panel
      - case: быстрые метрики внутри панели
        component: stats
    anatomy:
      block: .sidebar
      elements: [sidebar-header, sidebar-title, sidebar-subtitle, sidebar-close, sidebar-body, sidebar-footer, sidebar-nav, sidebar-nav-item, sidebar-nav-link, sidebar-nav-badge, sidebar-section, sidebar-section-title, sidebar-widget, sidebar-widget-title, sidebar-widget-content, sidebar-user, sidebar-user-avatar, sidebar-user-info, sidebar-tags, sidebar-tag, sidebar-activity, sidebar-overlay, sidebar-resize-handle]
      modifiers: ["--left", "--right", "--resizable"]
      states: [is-open, is-resizing, "is-visible (на .sidebar-overlay)", active]
    behavior_contract:
      keyboard:
        - .sidebar-close достижима с Tab и имеет цель ≥44px на мобильном
        - открытая мобильная шторка закрывается по Escape, фокус возвращается на кнопку-триггер
        - пункты .sidebar-nav-link — обычные ссылки, порядок Tab совпадает с визуальным
      aria:
        - 'контейнер: <aside> или role="complementary" с aria-label раздела'
        - 'список ссылок: <nav> + <ul>, активный пункт — aria-current="page" (класс .active только визуальный)'
        - '.sidebar-close: aria-label; кнопка-триггер снаружи — aria-expanded + aria-controls'
        - .sidebar-overlay скрыт от AT (aria-hidden) — это подложка, а не элемент
      js_required:
        - переключать is-open на .sidebar и is-visible на .sidebar-overlay
        - при .sidebar--resizable — перетаскивание .sidebar-resize-handle, класс is-resizing на время drag и сохранение ширины
        - "ширину при ресайзе писать и в --sidebar-w-left/--sidebar-w-right, иначе отступ центра отстанет от панели"
        - закрытие по клику в подложку и по Escape на ширине <768px
        - синхронизировать aria-expanded триггера с классом is-open
    tokens: ["--space-px", "--space-1", "--space-2", "--space-3", "--space-4", "--space-5", "--space-8", "--space-10", "--space-16", "--border-w", "--border-w-strong", "--color-border", "--color-border-subtle", "--color-border-strong", "--color-surface", "--color-surface-hover", "--color-surface-sunken", "--color-text", "--color-text-secondary", "--color-text-muted", "--color-text-on-accent", "--color-accent", "--color-accent-soft", "--color-overlay", "--radius-sm", "--radius-full", "--fs-xs", "--fs-sm", "--fs-md", "--fw-medium", "--fw-semi", "--icon-size", "--lh-snug", "--tracking-wide", "--shadow-lg", "--shadow-focus", "--header-h", "--sidebar-w", "--sidebar-w-sm", "--sidebar-width", "--touch-target-min", "--z-drawer", "--z-raised", "--duration-press", "--duration-dropdown", "--duration-modal", "--duration-modal-exit", "--ease-out", "--ease-drawer"]
    showcase: "components.html#sidebar"
    examples:
      - "навигация по разделам документации или справочника в левой колонке"
      - "правая инфо-колонка приложения с виджетами: карточка пользователя, быстрые метрики, лента активности"
      - "витрина: components.html#sidebar — анатомия панели целиком; обе панели самой витрины (#left-sidebar, #right-sidebar) собраны на этом же компоненте"
    status: stable
    notes:
      - "Единственный владелец имени .sidebar: прежние параллельные каркасы .app-sidebar (app-layout.css) и .sidebar (layout.css) удалены."
      - "Метрики в панели — компонент stats (.stat-card.stat-card-tile); собственных .sidebar-stat* больше нет."

  - name: skeleton
    file: styles/components/skeleton.css
    summary: Серые заглушки-плейсхолдеры формы будущего контента с мягким пульсом — показываются, пока данные грузятся.
    use_when:
      - известна структура ответа и её можно нарисовать заранее (карточка результата, строка списка, аватар + текст)
      - загрузка занимает больше доли секунды и без заглушки страница «прыгает» при подстановке данных
      - 'нужно избежать layout shift: заглушка занимает ровно то место, что и будущий блок'
      - грузится целый экран или список, а не одно действие
    avoid_when:
      - идёт короткое точечное действие (отправка формы, сохранение) — заглушка вместо кнопки вводит в заблуждение
      - прогресс измерим в процентах и его стоит показать числом
      - структура ответа заранее неизвестна (произвольный HTML, результат поиска неопределённой формы)
      - данных нет вообще, а не «ещё не пришли»
    instead_use:
      - case: неопределённая по времени загрузка одного действия или кнопки
        component: spinner
      - case: измеримый прогресс (загрузка файла, шаги импорта)
        component: progress
      - case: данных нет и не будет
        component: empty-state
    anatomy:
      block: .skeleton
      elements: [skeleton-card, skeleton-card__row, skeleton-card__body]
      modifiers: ["--text", "--title", "--avatar", "--thumb", "--btn"]
      states: []
    behavior_contract:
      keyboard:
        - заглушка не фокусируется и не попадает в Tab-порядок
      aria:
        - обёртка загружаемой области — aria-busy="true"
        - сами заглушки aria-hidden="true" (это декорация)
        - статус загрузки несёт отдельный видимый или .sr-only элемент с role="status"
      js_required:
        - подменять блок заглушек реальным контентом одним переключением, без промежуточных состояний
        - снимать aria-busy после подстановки данных
        - количество и форма заглушек должны соответствовать ожидаемому ответу
    tokens: ["--color-surface-active", "--color-surface", "--color-border", "--border-w", "--radius-xs", "--radius-sm", "--radius", "--radius-full", "--space-2", "--space-3", "--space-4", "--duration-pulse"]
    showcase: "components.html#skeleton"
    examples:
      - "список результатов поиска, пока идёт запрос: заглушки повторяют форму будущих карточек"
      - "панель фильтров каталога до загрузки справочников"
      - "в репозитории: components.html#skeleton — готовая раскладка «карточка результата» (.skeleton-card); заглушки ветви дерева — .tree-loading > .skeleton"
    status: new
    notes:
      - "Единственная реализация скелетона в бандле и единственное объявление @keyframes skeleton-pulse (--duration-pulse, linear): дубль из spinner.css, собственный tree-skeleton в tree.css и копия правила с одноимёнными keyframes в autotrassir.css удалены. Заглушки .photo-card-skeleton и .trending-list--skeleton — потребители этого компонента."
      - "Остаточные однотипные анимации вне компонента (themes/dark.css skeleton-pulse-dark, base/utilities.css pulse, base/animations.css с .skeleton-* и .skeleton-card) — в беклоге."

  - name: spec-sheet
    file: styles/components/spec-sheet.css
    summary: 'Лист технических характеристик: строки «параметр — значение» в две колонки, таблицы, карточки параметров и доменные бейджи; печатается на A4 в светлой палитре независимо от темы.'
    use_when:
      - 'нужно показать паспорт изделия: десятки пар «параметр — значение», сгруппированных по разделам'
      - тот же документ обязан корректно печататься (шапка таблицы повторяется, строки не режутся)
      - в даташите нужны ключевые параметры крупно (карточки .param-card) над подробным списком
      - надо отличить «значение не заполнено» от «не требуется» (.spec-row__value--empty)
    avoid_when:
      - 'данные табличные и однородные: много строк с одинаковыми колонками и сортировкой'
      - показываются метрики-KPI с динамикой, а не характеристики изделия
      - нужна только геометрия бумаги без содержимого листа
      - параметры редактируются, а не читаются
    instead_use:
      - case: массив однородных строк с сортировкой, скроллом и hover на экране
        component: table (.table)
      - case: числовые метрики с трендом на дашборде
        component: stats
      - case: только «бумага» A4 (геометрия листа, колонтитулы, видимость экран/печать)
        component: print-sheet
      - case: редактируемый набор параметров
        component: form-section
    anatomy:
      block: .spec-sheet
      elements: [spec-sheet__header, spec-sheet__title, spec-sheet__meta, spec-sheet__footer, spec-sheet__text, spec-sheet__empty, spec-section, spec-section__title, spec-grid, spec-row, spec-row__label, spec-row__value, spec-table, spec-table__cell--highlight, param-grid, param-card, param-card__icon, param-card__label, param-card__value, ie-badge]
      modifiers: ["--full", "--empty", "--ie1", "--ie2", "--ie3", "--ie4", "--ex"]
      states: []
    behavior_contract:
      keyboard:
        - лист статичен и не требует клавиатурного взаимодействия
        - если внутри есть ссылки/кнопки печати — они в обычном Tab-порядке
      aria:
        - разделы листа — заголовки нужного уровня, .spec-section__title не подменяет <h*>
        - .spec-table — настоящая <table> с <thead>/<th scope>
        - '.ie-badge несёт текстовую подпись класса; цвет — не единственный носитель значения'
        - незаполненное значение помечено видимым прочерком, а не только курсивом и цветом
