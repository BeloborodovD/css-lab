  - name: filter-pills
    file: styles/components/filter-pills.css
    summary: "Полоса применённых фильтров — пилюли «поле: значение ×» и кнопка «сбросить все»."
    use_when:
      - Над списком результатов надо показать, какие фильтры уже применены, и дать снять каждый по отдельности.
      - Фильтры задаются в другом месте (боковая панель, дропдауны), и пользователь теряет из виду текущий отбор.
      - Значение фильтра требует пары «имя поля + значение», а не одного слова.
    avoid_when:
      - Полоса используется для ВЫБОРА фильтров — пилюля здесь всегда удаляемая, у неё нет состояния «не выбрана».
      - Нужен просто набор меток/тегов без действия удаления.
      - Активный фильтр ровно один и его видно в самом контроле.
    instead_use:
      - case: выбрать значение фильтра, а не снять его
        component: chip (.chip-choice в chip.css)
      - case: неинтерактивная метка статуса или категории
        component: badge
      - case: задать фильтры целиком (группы, пресеты, диапазоны)
        component: filter-panel
    anatomy:
      block: .filter-pills
      elements: [__label, __clear]
      modifiers: []
      states: []
    behavior_contract:
      keyboard:
        - Крестик каждой пилюли — button 24x24, достижим Tab, срабатывает Enter/Space.
        - После удаления пилюли фокус переносится на следующий крестик, а при удалении последней — на кнопку «сбросить все» (иначе фокус улетает на body).
      aria:
        - У крестика доступное имя вида «убрать фильтр Серия — АДМ», а не «×».
        - Изменение состава результатов сообщается live-областью списка, а не самой полосой.
      js_required:
        - Удалять DOM-узел пилюли и синхронно снимать соответствующий фильтр в источнике (панель/URL).
        - Переносить фокус после удаления; скрывать полосу целиком, когда пилюль не осталось.
    tokens: ["--color-accent", "--color-accent-soft", "--color-accent-soft-hover", "--color-accent-border", "--color-text-muted", "--color-error", "--border-w", "--border-w-strong", "--radius-full", "--radius-sm", "--shadow-focus", "--space-1", "--space-2", "--space-3", "--fs-xs", "--fs-sm", "--fw-medium", "--fw-semi", "--tracking-wide", "--duration-press", "--ease-out"]
    showcase: "components.html#filter-pills"
    examples:
      - "Витрина: components.html#filter-pills"
      - "Каталог с фасетными фильтрами: pages/catalog.html"
      - "Панель мониторинга с фильтром по уровню/источнику: pages/dashboard.html"
    status: stable

  - name: footer
    file: styles/components/footer.css
    summary: Контентный подвал страницы — колонки ссылок, копирайт, соцсети, индикатор статуса и версии.
    use_when:
      - Странице нужен развёрнутый маркетинговый или навигационный подвал (несколько колонок ссылок, разделы).
      - Требуется компактная полоса статуса внизу приложения — точка состояния, версия сборки, копирайт.
      - Нужен вариант липкого подвала, остающегося на экране при прокрутке.
    avoid_when:
      - Речь про служебную полосу-каркас сайта — она уже реализована отдельно и подключена во всех страницах репозитория.
      - Нужно единственное сообщение о состоянии системы — подвал ради него не нужен.
      - Внизу экрана должны быть кнопки действий формы (сохранить/отправить).
    instead_use:
      - case: служебная фиксированная полоса сайта
        component: layout/site-footer.css (.site-footer)
      - case: закреплённая внизу панель действий формы
        component: layout (.header--accent как app-bar) либо modal-footer у модального сценария
      - case: разовое сообщение о состоянии
        component: alerts
    anatomy:
      block: .footer
      elements: [footer-left, footer-center, footer-right, footer-nav, footer-link, footer-copyright, footer-social, footer-social-link, footer-status, footer-version, footer-row, footer-columns, footer-column-title, footer-column-links]
      modifiers: [footer-sticky, footer-compact, footer-centered, footer-multi]
      states: []
    behavior_contract:
      keyboard:
        - Все ссылки — нативные a, порядок Tab совпадает с визуальным; на узком экране цель ссылки не ниже 44px (задано в медиазапросе).
        - Иконки соцсетей — ссылки с текстовой альтернативой, не пустые квадраты.
      aria:
        - Блок оформляется тегом footer (либо role="contentinfo"), навигационная группа — nav с aria-label.
        - "Точка статуса внутри .footer-status — общий примитив .badge-dot (badge.css) с семантическим модификатором; она декоративна, состояние обязано дублироваться текстом рядом."
      js_required:
        - Ничего; статичный компонент. Подстановка версии и переключение статуса — на стороне приложения.
    tokens: ["--color-surface", "--color-surface-sunken", "--color-border", "--color-border-subtle", "--color-text", "--color-text-muted", "--color-accent", "--color-text-on-accent", "--color-success", "--color-warning", "--color-error", "--border-w", "--radius-full", "--z-sticky", "--space-1", "--space-2", "--space-3", "--space-4", "--space-5", "--space-6", "--fs-xs", "--fs-sm", "--fw-semi", "--t-fast", "--ease"]
    showcase: "components.html#footer"
    examples:
