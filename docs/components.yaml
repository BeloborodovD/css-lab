  - name: code-panel
    file: styles/components/code-panel.css
    summary: "Панель результата генерации: моноширинная итоговая строка с кнопкой копирования, таблица расшифровки «код — параметр — значение» и блок предупреждений о значениях без кода; печатается корректно."
    use_when:
      - Форма собирает из выбранных параметров машинную строку (артикул, шифр заказа, код исполнения), и её нужно показать и скопировать.
      - Результат должен оставаться на экране, пока пользователь правит поля — варианты "--aside" (боковая колонка) и "--sticky" (липнет под шапкой).
      - Часть выбранных значений не имеет кода и об этом нужно предупредить отдельным блоком.
    avoid_when:
      - Показывается исходный код или лог — здесь оформление под короткую строку-шифр, а не под многострочный текст.
      - Расшифровка не нужна и достаточно одной строки с кнопкой копирования.
      - Данных много и они сравниваются между собой — нужна полноценная таблица.
    instead_use:
      - case: паспорт изделия с характеристиками под печать
        component: spec-sheet
      - case: многострочный вывод, журнал, поток событий
        component: logs
      - case: сравнение множества значений по колонкам
        component: table
    anatomy:
      block: .code-panel
      elements: ["__title", "__hint", "__count", "__string", "__string-row", "__copy", "__table", "__code", "__param", "__warn", "__empty"]
      modifiers: ["--sticky", "--aside"]
      states: ["is-copied"]
    behavior_contract:
      keyboard:
        - Кнопка копирования — button с видимым кольцом фокуса, построенным от цвета текста на акцентной подложке.
        - Липкая и боковая раскладки на экране до 767px становятся обычным блоком в потоке — на мобильном они не должны съедать половину экрана.
      aria:
        - Кнопке копирования нужен aria-label ("Копировать код …"), а также связь с копируемым элементом (например, data-атрибут с его id).
        - "Подтверждение копирования не должно жить только в цвете: текст кнопки обязан меняться."
        - Заголовки таблицы расшифровки обязаны существовать (допустимо визуально скрытые).
        - Блок предупреждений на печати получает префикс "!" — смысл сохраняется без цвета.
      js_required:
        - Записывать строку в буфер обмена и на время вешать класс "is-copied", затем снимать его и возвращать исходный текст кнопки.
        - Пересобирать строку и таблицу при изменении полей формы.
    tokens: ["--space-1", "--space-2", "--space-3", "--space-4", "--space-5", "--space-8", "--header-h", "--fs-xs", "--fs-sm", "--fs-md", "--fw-semi", "--fw-bold", "--font-mono", "--tracking-wide", "--color-accent", "--color-accent-soft", "--color-accent-text", "--color-on-accent-soft", "--color-on-accent-strong", "--color-on-accent-border", "--color-border", "--color-border-subtle", "--color-text", "--color-text-muted", "--color-text-secondary", "--color-surface", "--color-error", "--color-error-soft", "--border-w", "--border-w-thick", "--border-w-strong", "--radius", "--radius-sm", "--duration-press", "--ease-out"]
    showcase: "components.html#code-panel"
    examples:
      - "витрина: components.html#code-panel — панель целиком, боковая колонка и липкий вариант"
      - "класс задач: длинная техническая форма-опросник, из ответов которой собирается шифр исполнения изделия (исторический донор — внутренний опросный лист)"
    status: stable

  - name: combobox
    file: styles/components/combobox.css
    summary: Раскрывающийся список значений с поиском внутри панели, одиночным и множественным выбором (теги в поле), группами, состояниями загрузки, пустоты и ошибки; на мобильном превращается в нижнюю шторку.
    use_when:
      - Одно значение из списка, который слишком длинный для видимого набора кнопок, но нуждается в поиске.
      - Несколько значений с показом выбранного тегами прямо в поле ("combobox-multi").
      - Значения сгруппированы по категориям и группы можно сворачивать.
    avoid_when:
      - Вариантов три-четыре и все влезают на экран — раскрытие лишний шаг.
      - Выбор идёт по визуальному признаку (цвет, изображение) — текстовая строка его не передаёт.
      - Нужен массовый выбор из сотен значений с групповыми операциями и колонками.
      - Нужен не выбор значения, а запуск действия.
    instead_use:
      - case: массовый множественный выбор с колонками, группами и режимом «выбрать всё»
        component: picklist
      - case: короткий набор значений, все видны сразу
        component: chip
      - case: выбор цвета из палитры образцов
        component: swatch-picker
      - case: меню действий, а не значений
        component: dropdown
      - case: глобальный поиск команд и переходов с клавиатуры
        component: command-palette
    anatomy:
      block: .combobox
      elements: [combobox-trigger, combobox-value, combobox-placeholder, combobox-arrow, combobox-clear, combobox-dropdown, combobox-search, combobox-search-input, combobox-options, combobox-option, combobox-option-label, combobox-option-description, combobox-option-check, combobox-option-checkbox, combobox-group, combobox-group-header, combobox-tag, combobox-tag-remove, combobox-tag-more, combobox-empty, combobox-footer, combobox-create, combobox-spinner, combobox-error-message]
      modifiers: ["combobox-multi", "combobox-sm", "combobox-lg", "combobox-dropdown-top"]
      states: [open, "is-open", highlighted, selected, "is-selected", "has-value", loading, disabled, error, collapsed]
    behavior_contract:
      keyboard:
        - "Триггер — button: открытие Enter/Space, закрытие Escape с возвратом фокуса на триггер."
        - Стрелки вверх/вниз перемещают подсветку опции, Enter выбирает; подсвеченная опция обязана прокручиваться в видимую область.
        - Кнопки очистки и удаления тега — отдельные точки табуляции с видимым кольцом фокуса (кнопка очистки не должна прятаться при фокусе).
      aria:
        - Триггер несёт aria-expanded и aria-haspopup="listbox".
        - Панель — role="listbox", опции — role="option" с aria-selected; для множественного выбора aria-multiselectable.
        - Активная опция связывается с полем поиска через aria-activedescendant.
        - Сообщение об ошибке связывается с триггером через aria-describedby, состояние ошибки — aria-invalid.
        - Пустой результат поиска объявляется живой областью, а не только меняется визуально.
      js_required:
        - Переключать класс "open"/"is-open" на корне; вся анимация раскрытия описана в CSS.
        - Фильтровать опции по вводу и скрывать опустевшие группы.
        - Помечать выбранное классом "selected"/"combobox-option-selected", вести подсветку "highlighted".
        - Собирать теги выбранных значений и обрабатывать их удаление.
        - Закрывать панель по клику вне и по Escape.
    tokens: ["--space-1", "--space-2", "--space-3", "--space-4", "--space-5", "--space-6", "--fs-xs", "--fs-sm", "--fs-base", "--fs-md", "--fw-medium", "--fw-semi", "--tracking-wide", "--color-text", "--color-text-secondary", "--color-text-muted", "--color-text-disabled", "--color-surface", "--color-surface-hover", "--color-surface-active", "--color-surface-sunken", "--color-surface-elevated", "--color-surface-elevated-hover", "--color-border", "--color-border-subtle", "--color-border-strong", "--color-accent", "--color-accent-soft", "--color-accent-soft-hover", "--color-error", "--border-w", "--border-w-strong", "--radius", "--radius-sm", "--radius-xs", "--radius-lg", "--radius-full", "--shadow", "--shadow-lg", "--shadow-focus", "--shadow-focus-error", "--z-dropdown", "--duration-press", "--duration-dropdown", "--duration-exit", "--duration-modal", "--duration-modal-exit", "--ease-out", "--ease-in-out", "--ease-drawer", "--t-fast", "--ease"]
    showcase: "components.html#combobox"
    examples:
      - "витрина: components.html#combobox — базовый, с поиском, мультивыбор, группировка"
      - "класс задач: поле «производитель» или «город» в форме заявки, где значений сотни"
    status: stable

  - name: command-palette
    file: styles/components/command-palette.css
    summary: "Полноэкранный поиск команд и переходов, вызываемый с клавиатуры: строка ввода, результаты по категориям с подсветкой совпадений и сочетаниями клавиш, подвал с подсказками; открывается и закрывается мгновенно, без анимации."
    use_when:
      - В приложении десятки действий и переходов, и опытному пользователю нужен путь быстрее меню.
      - Нужен единый вход в поиск по разнородным сущностям с группировкой по категориям.
      - Нужно показать пользователю сочетания клавиш рядом с командами (элементы "kbd").
    avoid_when:
      - Действий мало и они уже видны в интерфейсе.
      - Требуется выбрать значение для поля формы, а не выполнить действие.
      - Пользователь работает только мышью или с тач-экрана — палитра остаётся невидимой функцией.
    instead_use:
      - case: короткое меню действий у конкретного элемента
        component: dropdown
      - case: выбор значения в поле формы
        component: combobox
      - case: поиск по контенту с результатами на странице
        component: search
      - case: диалог, требующий решения
        component: modal
    anatomy:
      block: .command-palette
      elements: [command-palette-overlay, command-palette-header, command-palette-search-icon, command-palette-input, command-palette-close-hint, command-palette-body, command-palette-category, command-palette-separator, command-palette-item, command-palette-item-icon, command-palette-item-title, command-palette-item-meta, command-palette-item-shortcut, command-palette-highlight, command-palette-empty, command-palette-no-results, command-palette-footer, command-palette-hint, command-palette-loading, kbd]
      modifiers: ["command-palette-sm", "command-palette-lg", "kbd-lg", "kbd-group", "kbd-plus"]
      states: [open, active, highlighted]
    behavior_contract:
      keyboard:
        - Вызов и закрытие клавишами; закрытие по Escape обязательно, фокус возвращается туда, откуда палитру вызвали.
        - Стрелки ведут по результатам, Enter выполняет команду; фокус при этом остаётся в поле ввода.
        - Открытие и закрытие принципиально не анимируются — это действие частотное и клавиатурное.
      aria:
        - Контейнер — role="dialog" с aria-modal="true" и заголовком/меткой.
        - Список результатов — role="listbox", пункт — role="option"; активный пункт связывается с полем через aria-activedescendant.
        - Количество найденного объявляется живой областью, иначе смена списка беззвучна.
        - Пока палитра открыта, остальная страница должна быть исключена из дерева доступности.
      js_required:
        - Переключать класс "open" на оверлее; ловить фокус внутри и возвращать его при закрытии.
        - Фильтровать команды, оборачивать совпадения в "command-palette-highlight", вести подсветку "highlighted"/"active".
        - Блокировать прокрутку страницы под оверлеем.
    tokens: ["--space-1", "--space-2", "--space-3", "--space-4", "--space-5", "--space-6", "--space-8", "--space-10", "--space-12", "--fs-xs", "--fs-sm", "--fs-base", "--fs-md", "--fs-lg", "--fw-medium", "--fw-semi", "--font-sans", "--tracking-wide", "--color-overlay", "--color-surface-overlay", "--color-surface-sunken", "--color-surface-elevated-hover", "--color-accent", "--color-accent-soft", "--color-border", "--color-border-subtle", "--color-border-strong", "--color-text", "--color-text-muted", "--color-highlight", "--color-highlight-text", "--border-w", "--border-w-strong", "--radius-xs", "--radius-sm", "--radius-lg", "--radius-full", "--shadow-lg", "--z-modal", "--t-fast", "--ease"]
    showcase: "components.html#command-palette"
    examples:
      - "витрина: components.html#command-palette — статичный вид палитры, набор клавиш, кнопка вызова"
      - "класс задач: внутренний портал с десятками разделов, где нужен быстрый переход по названию"
    status: stable
    notes:
      - "Кнопка вызова #open-command-palette в скриптах витрины обработчика не имеет: живого открытия палитры в репозитории нет, демо статичное."

  - name: date-picker
    file: styles/components/date-picker.css
    summary: "Выбор даты или периода: поле-триггер, выпадающий календарь с сеткой дней, навигацией по месяцам, выбором месяца и года, подвалом «сегодня / очистить»; есть встроенный в поток вариант, на мобильном — нижняя шторка с перетаскиванием."
    use_when:
      - В форме нужна дата, и календарь помогает не ошибиться с форматом и днём недели.
      - Нужен период — режим диапазона подсвечивает промежуток и края.
      - Календарь должен быть постоянно виден в фильтрах или на панели — вариант "--inline".
    avoid_when:
      - Дата вводится профессионалом сериями и быстрее набирается с клавиатуры — тогда основным должно быть текстовое поле.
      - Нужны только месяц и год без дней.
      - Нужны время суток или интервал времени — компонент их не содержит.
    instead_use:
      - case: свободный ввод даты и маска формата
        component: inputs
      - case: выбор года или месяца как обычного значения из списка
        component: combobox
      - case: пресеты периода («сегодня», «неделя», «месяц») кнопками
        component: filter-pills
    anatomy:
      block: .date-picker
      elements: [date-picker-input, date-picker-input-text, date-picker-icon, date-picker-dropdown, date-picker-header, date-picker-title, date-picker-nav, date-picker-nav-btn, date-picker-weekdays, date-picker-weekday, date-picker-days, date-picker-day, date-picker-months, date-picker-years, date-picker-footer, date-picker-today-btn, date-picker-clear-btn]
      modifiers: ["date-picker-sm", "date-picker-lg", "date-picker-right", "date-picker-inline", "date-picker-dropdown--inline"]
      states: [open, selected, today, current, disabled, "other-month", "range-start", "range-end", "in-range", "range-preview", "date-picker-input-placeholder"]
    behavior_contract:
      keyboard:
        - "Триггер — button: открытие Enter/Space, закрытие Escape с возвратом фокуса."
        - Кнопки навигации и дни — настоящие button с видимым кольцом фокуса; после смены месяца фокус остаётся на кнопке навигации.
        - Дни в сетке должны обходиться стрелками, иначе выбор даты клавиатурой превращается в перебор Tab.
      aria:
        - Панель — role="dialog" с aria-label; триггер несёт aria-haspopup="dialog" и aria-expanded.
        - Выбранный день помечается aria-selected либо aria-pressed; «сегодня» — отдельная пометка, не только точка под числом.
        - Смена месяца объявляется (заголовок в живой области), иначе переход беззвучен.
      js_required:
        - "Компонент рендерится скриптом: содержимое панели (шапка, недели, сетка дней) генерируется, в разметке остаётся пустой контейнер."
        - Переключать класс "open", писать aria-expanded, ставить классы дней (selected, today, in-range, range-start/end).
        - "На мобильном обрабатывать перетаскивание шторки: закрытие по скорости жеста, а не только по расстоянию."
    tokens: ["--space-1", "--space-2", "--space-3", "--space-4", "--fs-xs", "--fs-sm", "--fs-base", "--fs-md", "--fw-medium", "--fw-semi", "--fw-bold", "--tracking-wide", "--color-surface", "--color-surface-hover", "--color-surface-elevated", "--color-text", "--color-text-muted", "--color-text-disabled", "--color-text-on-accent", "--color-accent", "--color-accent-soft", "--color-accent-soft-hover", "--color-border", "--color-border-subtle", "--color-border-strong", "--border-w", "--border-w-strong", "--radius", "--radius-sm", "--radius-lg", "--radius-full", "--shadow", "--shadow-lg", "--shadow-focus", "--z-dropdown", "--duration-dropdown", "--duration-modal", "--duration-modal-exit", "--ease", "--ease-drawer"]
    showcase: "components.html#date-picker"
    examples:
      - "витрина: components.html#date-picker — одиночная дата, диапазон, встроенный календарь"
      - "класс задач: фильтр периода над журналом событий, поле срока в заявке"
    status: stable

  - name: divider
    file: styles/components/divider.css
    summary: Разделитель контента — горизонтальный и вертикальный, сплошной, пунктирный или точечный, с необязательным текстом или иконкой посередине и набором шагов отступа.
    use_when:
      - Нужно разделить два смысловых блока, между которыми нет заголовка.
      - Нужна подпись-разделитель по центру линии («или», «продолжение»).
      - Нужен вертикальный разделитель между элементами панели инструментов ("divider-vertical-inline").
    avoid_when:
      - Блоки уже разделены отступом или рамкой контейнера — линия добавляет шум.
      - Разделитель несёт смысл структуры — лучше заголовок раздела.
      - Разделяются пункты меню внутри выпадающего списка — там свой элемент.
    instead_use:
      - case: разделение пунктов внутри выпадающего меню
        component: dropdown
      - case: смысловая граница разделов формы с заголовком
        component: form-section
      - case: заголовок уровня раздела
        component: typography
    anatomy:
      block: .divider
      elements: [divider-text]
      modifiers: ["divider-dashed", "divider-dotted", "divider-left", "divider-right", "divider-sm", "divider-lg", "divider-xl", "divider-flush", "divider-vertical", "divider-vertical-inline", "divider-vertical-sm", "divider-vertical-lg", "divider-accent", "divider-subtle", "divider-strong", "divider-icon"]
      states: []
    behavior_contract:
      keyboard:
        - Не интерактивен, из порядка табуляции исключён.
      aria:
        - Чисто декоративный разделитель скрывается от скринридера (aria-hidden) либо получает role="separator".
        - Разделитель с текстом несёт смысл — текст обязан быть в разметке, а не только в оформлении.
      js_required:
        - Ничего.
    tokens: ["--space-2", "--space-3", "--space-4", "--space-6", "--space-8", "--fs-sm", "--color-text-muted", "--color-border", "--color-border-subtle", "--color-border-strong", "--color-accent", "--border-w"]
    showcase: "components.html#divider"
    examples:
      - "витрина: components.html#divider — горизонтальный, с текстом, стили линии, вертикальный"
      - "класс задач: разделение блоков формы входа («или войти через…»), панель инструментов с группами кнопок"
    status: stable
    notes:
      - "Подпись разделителя — вложенный элемент .divider-text с текстом внутри; атрибута data-text компонент не читает."

  - name: drawer
    file: styles/components/drawer.css
    summary: "Модальная шторка поверх страницы с затемнением — единственная в библиотеке: входит от правого края, левого края или снизу (нижний лист) и уходит тем же путём; внутри — шапка с заголовком и закрытием, прокручиваемое тело и подвал с действиями."
    use_when:
      - Нужно показать подробности или форму, не теряя контекст списка под ней.
      - Содержимое длинное и нуждается в собственной прокрутке с действиями, закреплёнными в подвале.
      - Нужна мобильная навигация, выезжающая слева ("drawer--left").
      - Нужен нижний лист действий на мобильном ("drawer--sheet") — палец достаёт до низа экрана.
    avoid_when:
      - Нужно короткое решение «да/нет» — панель во весь экран избыточна.
      - Панель должна оставаться открытой параллельно с работой в основной области.
      - Содержимое — просто пояснение к элементу.
    instead_use:
      - case: короткое подтверждение или решение по центру экрана
        component: modal
      - case: немодальная боковая панель, живущая постоянно и сдвигающая контент
        component: sidebar
      - case: небольшая панель, привязанная к своему триггеру
        component: dropdown
      - case: пояснение к элементу по наведению
        component: tooltip
    anatomy:
      block: .drawer
      elements: ["__overlay", "__panel", "__grabber", "__header", "__title", "__close", "__body", "__footer"]
      modifiers: ["--left", "--sheet"]
      states: ["is-open"]
    behavior_contract:
      keyboard:
        - Закрытие по Escape обязательно; фокус возвращается на элемент, открывший панель.
        - При открытии фокус переводится внутрь (на кнопку закрытия) и удерживается в панели.
        - "Закрытая панель невидима для Tab: CSS ставит visibility: hidden, скрипт дополнительно выключает поддерево."
      aria:
        - Панель — role="dialog" с aria-modal="true" и aria-labelledby на заголовок.
        - Кнопке закрытия нужен aria-label.
        - Затемнение закрывает панель по клику — это должно дублироваться доступной кнопкой закрытия.
      js_required:
        - Переключать класс "is-open" на корне .drawer.
        - Выключать закрытое поддерево (inert) и включать при открытии.
        - Обрабатывать Escape и клики по элементам с признаком закрытия.
        - Тело панели гасит прокрутку страницы через overscroll-behavior, но саму блокировку скролла body ставит скрипт.
    tokens: ["--z-modal", "--color-overlay", "--color-surface-overlay", "--color-surface-hover", "--color-border", "--color-text", "--color-text-muted", "--drawer-w", "--border-w", "--border-w-strong", "--radius-sm", "--radius-lg", "--radius-full", "--shadow-xl", "--shadow-focus", "--space-1", "--space-2", "--space-3", "--space-4", "--space-5", "--space-10", "--fs-lg", "--fw-semi", "--duration-modal", "--duration-modal-exit", "--duration-dropdown", "--duration-press", "--ease-drawer", "--ease-out"]
    showcase: "components.html#drawer"
    examples:
      - "витрина: components.html#drawer — боковая панель карточки документа и нижний лист действий (--sheet)"
      - "страница-пример: pages/dashboard.html — боковая панель подробностей события"
      - "класс задач: карточка записи, открываемая из списка без ухода со страницы; мобильное меню навигации; лист действий над позицией на телефоне"
    status: stable
    notes:
      - "Нижний лист — модификатор этого компонента. Прежние .modal-bottom-sheet / .modal-drawer из modal.css удалены как вторая реализация."

  - name: dropdown
    file: styles/components/dropdown.css
    summary: "Плавающая панель, привязанная к триггеру: меню действий с пунктами, иконками и разделителями, а также поповер произвольного содержимого (например, набор фильтров) с кнопками применения."
    use_when:
      - У элемента есть несколько действий, которые незачем держать на экране постоянно.
      - Нужен компактный набор настроек или фильтров рядом с кнопкой, применяемый по кнопке в поповере.
      - "Панель должна открываться только по клику: открытие по наведению здесь намеренно убрано."
    avoid_when:
      - Нужно выбрать значение поля формы, особенно с поиском.
      - Содержимого много, оно требует прокрутки и собственных действий — панель перекроет полстраницы.
      - Пункты — навигация верхнего уровня, которая должна быть видна всегда.
    instead_use:
      - case: выбор значения с поиском и мультивыбором
        component: combobox
      - case: массовый выбор значений с группами и колонками
        component: picklist
      - case: длинное содержимое с прокруткой и действиями внизу
        component: drawer
      - case: меню текущего пользователя
        component: user-menu
      - case: поиск команд с клавиатуры
        component: command-palette
      - case: панель фильтров, встроенная в поток страницы и видимая постоянно
        component: filter-panel
    anatomy:
      block: .dropdown
      elements: [dropdown-trigger, dropdown-menu, dropdown-item, dropdown-divider, popover, popover-row, popover-col, popover-title, popover-actions]
      modifiers: ["dropdown-left"]
      states: [open, active]
    behavior_contract:
      keyboard:
        - "Триггер — button: Enter/Space открывают, Escape закрывает с возвратом фокуса."
        - Пункты меню обходятся стрелками; у каждого видимое кольцо фокуса.
        - Панель закрывается по клику вне и по потере фокуса.
      aria:
        - Триггер несёт aria-expanded и aria-haspopup="menu" (для поповера — "dialog").
        - Меню — role="menu", пункты — role="menuitem"; выбранный пункт помечается aria-checked/aria-current, а не только классом "active".
        - Поповеру нужна метка (aria-label или связь с заголовком .popover-title).
      js_required:
        - Переключать класс "open" на .dropdown (или на .popover) — вся анимация в CSS.
        - Закрывать по клику вне, по Escape и после выбора пункта.
        - Для якорения к триггеру задавать "--transform-origin", если панель позиционируется скриптом.
    tokens: ["--space-1", "--space-2", "--space-3", "--space-4", "--space-5", "--space-8", "--fs-sm", "--fs-base", "--fw-medium", "--fw-semi", "--color-surface-elevated", "--color-surface-elevated-hover", "--color-surface-active", "--color-border", "--color-border-subtle", "--color-border-strong", "--color-text", "--color-text-secondary", "--color-text-muted", "--color-accent", "--color-accent-soft", "--border-w", "--border-w-strong", "--radius", "--radius-sm", "--radius-lg", "--shadow", "--shadow-focus", "--z-dropdown", "--z-modal", "--duration-dropdown", "--duration-exit", "--ease-out"]
    showcase: "components.html#dropdown"
    examples:
      - "витрина: components.html#dropdown"
      - "витрина: шапка страницы витрины использует то же меню (настройки / выход)"
      - "класс задач: меню строки в таблице («редактировать», «дублировать», «удалить»), поповер с набором фильтров над списком"
    status: stable
    notes:
      - "Роли внутри файла разведены явно. '.dropdown-menu' — меню действий: однородный список .dropdown-item, выбор пункта закрывает панель, ширина от содержимого. '.popover' — панель произвольного содержимого у триггера (колонки, поля, «Применить/Сбросить»), по клику внутрь не закрывается. '.filter-panel' — та же фильтрация, но панель встроена в поток страницы и видна постоянно."

  - name: empty-state
    file: styles/components/empty-state.css
    summary: "Заглушка на месте отсутствующего содержимого: иллюстрация, заголовок, поясняющий текст и кнопки выхода из ситуации; три размера, горизонтальная раскладка и смысловые типы (нет данных, ничего не найдено, ошибка, успех)."
    use_when:
      - Список пуст, потому что данных ещё нет — состояние обязано предлагать первое действие.
      - Фильтры или поиск не дали результата — нужен явный выход (сбросить фильтры, изменить запрос).
      - Загрузка провалилась и пользователю нужно объяснение плюс кнопка повтора.
    avoid_when:
      - Данные ещё грузятся — пустое состояние выглядит как окончательный ответ.
      - Пустота — норма и уже понятна из подписи блока.
      - Ошибка относится к отправке формы, а не к отсутствию содержимого.
    instead_use:
      - case: ожидание данных, плейсхолдеры блоков
        component: skeleton
      - case: сообщение об ошибке действия в потоке страницы
        component: alerts
      - case: сводка ошибок валидации формы
        component: form-error-summary
      - case: пустой результат внутри выпадающего списка
        component: combobox
    anatomy:
      block: .empty-state
      elements: [empty-state-illustration, empty-state-title, empty-state-description, empty-state-action, empty-state-content]
      modifiers: ["empty-state-sm", "empty-state-md", "empty-state-lg", "empty-state-inline", "empty-state-bordered", "empty-state-card", "empty-state-subtle", "empty-state-no-data", "empty-state-no-results", "empty-state-error", "empty-state-success", "empty-state-animated", "empty-state-float"]
      states: []
    behavior_contract:
      keyboard:
        - Кнопки выхода — обычные кнопки, достижимы по Tab.
      aria:
        - Появление пустого состояния после фильтрации обязано объявляться живой областью, иначе смена беззвучна.
        - Иллюстрация декоративна — скрывается от скринридера.
        - Заголовок пустого состояния должен быть заголовком нужного уровня в структуре страницы.
      js_required:
        - Показ и скрытие блока при изменении выборки; классы анимации входа необязательны.
    tokens: ["--space-1", "--space-2", "--space-3", "--space-4", "--space-5", "--space-6", "--space-8", "--space-12", "--space-20", "--fs-sm", "--fs-base", "--fs-md", "--fs-xl", "--fs-2xl", "--fw-semi", "--lh-normal", "--tracking-tight", "--color-text", "--color-text-muted", "--color-surface", "--color-border", "--color-accent", "--color-accent-soft", "--color-error", "--color-success", "--border-w", "--radius", "--radius-lg", "--shadow-sm", "--t-slow", "--ease-out", "--ease-in-out"]
    showcase: "components.html#empty-state"
    examples:
      - "витрина: components.html#empty-state — нет данных, ничего не найдено, ошибка, компактный вариант"
      - "страница-пример: pages/catalog.html — «Ничего не подобрано» с кнопкой сброса всех фильтров"
      - "класс задач: каталог с фасетными фильтрами, где комбинация условий часто даёт пустую выдачу"
    status: stable
    notes:
      - "Имена элементов: иллюстрация — .empty-state-illustration (внутрь кладётся svg или img), текст — .empty-state-description, кнопки — .empty-state-action; компактный вид — .empty-state-sm."

  - name: file-upload
    file: styles/components/file-upload.css
    summary: "Загрузка файлов: зона перетаскивания со скрытым полем выбора, список файлов с иконкой по типу, размером, прогрессом и действиями, а также сетка превью изображений; состояния успеха и ошибки на уровне файла и всей зоны."
    use_when:
      - Пользователь прикладывает документы к заявке или карточке и должен видеть, что именно приложено.
      - Нужен показ хода загрузки по каждому файлу, включая неопределённый прогресс.
      - Загружаются изображения и нужен предпросмотр плиткой с удалением.
    avoid_when:
      - Файл ровно один и его судьба тривиальна — достаточно обычного поля выбора файла.
      - Загрузка идёт фоново без участия пользователя.
      - Нужен разбор содержимого файла с предпросмотром таблицы — это отдельная задача.
    instead_use:
      - case: одиночный файл в обычной форме
        component: inputs
      - case: показ хода долгой операции без файлов
        component: progress
      - case: сообщение о неудачной загрузке в потоке страницы
        component: alerts
      - case: список записей с действиями справа (не файлов)
        component: row-card
    anatomy:
      block: .file-upload
      elements: [file-dropzone, file-dropzone-icon, file-dropzone-title, file-dropzone-subtitle, file-list, file-item, file-icon, file-info, file-name, file-meta, file-size, file-type, file-actions, file-action, file-progress, file-progress-bar, file-progress-text, file-progress-percent, file-preview, file-preview-overlay, file-preview-grid, file-preview-card, file-preview-card-remove]
      modifiers: ["file-dropzone-sm", "file-dropzone-lg", "file-item-compact", "file-icon-pdf", "file-icon-doc", "file-icon-xls", "file-icon-image", "file-icon-video", "file-icon-audio", "file-icon-zip", "file-action-remove", "file-progress-indeterminate"]
      states: ["drag-over", "file-item-uploading", "file-item-success", "file-item-error", "file-dropzone-error", "file-dropzone-success", "file-dropzone-disabled", disabled]
    behavior_contract:
      keyboard:
        - "Зона перетаскивания обязана содержать настоящий input[type=file]: он растянут на всю зону и прозрачен, поэтому фокус на нём подсвечивает зону через :focus-within."
        - "Перетаскивание — не единственный способ: клик и клавиатурный выбор файла обязаны работать."
        - Кнопки действий над файлом — обычные кнопки в порядке табуляции.
      aria:
        - Полю выбора файла нужна связанная подпись; заголовок зоны сам по себе меткой не является.
        - Прогресс загрузки — role="progressbar" со значениями либо текстовое объявление процента.
        - Ошибка по файлу связывается с его строкой (aria-describedby), цвет рамки не единственный носитель.
        - Добавление и удаление файлов из списка объявляется живой областью.
      js_required:
        - Обрабатывать dragenter/dragover/drop и ставить класс "drag-over" (поддержан и атрибут data-drag-over).
        - Строить строки списка, подставлять класс иконки по типу файла.
        - Двигать прогресс через ширину .file-progress-bar; для неопределённого — класс "file-progress-indeterminate".
        - Ставить состояния "file-item-success"/"file-item-error" по результату отправки.
    tokens: ["--space-1", "--space-2", "--space-3", "--space-4", "--space-5", "--space-6", "--space-8", "--space-12", "--fs-xs", "--fs-sm", "--fs-md", "--fw-medium", "--fw-semi", "--tracking-wide", "--color-surface", "--color-surface-hover", "--color-surface-sunken", "--color-border", "--color-border-strong", "--color-border-subtle", "--color-overlay", "--color-text", "--color-text-muted", "--color-accent", "--color-accent-soft", "--color-accent-soft-hover", "--color-error", "--color-error-soft", "--color-success", "--color-success-soft", "--color-info", "--color-info-soft", "--color-warning", "--color-warning-soft", "--color-source-forum", "--color-source-forum-soft", "--border-w", "--border-w-strong", "--radius", "--radius-sm", "--radius-lg", "--radius-full", "--shadow-sm", "--shadow-focus", "--t", "--t-fast", "--ease", "--ease-in-out"]
    showcase: "components.html#file-upload"
    examples:
      - "витрина: components.html#file-upload — зона перетаскивания, список файлов, прогресс, сетка превью"
      - "класс задач: приложение документов к заявке или к карточке изделия, загрузка фотографий в отчёт"
    status: stable
    notes:
      - "Два разных превью: миниатюра в строке списка — .file-preview с наложением .file-preview-overlay (раскрывается по наведению), карточка сетки — .file-preview-card с .file-preview-card-remove и подписью .file-preview-card-info; смешивать их элементы нельзя."

  - name: filter-panel
    file: styles/components/filter-panel.css
    summary: Боковая панель фасетных фильтров со счётчиком результатов, быстрыми пресетами и групповым сбросом.
    use_when:
      - Каталог или список результатов, где фильтров больше 3-4 групп и они должны быть видны постоянно, а не в дропдауне.
      - Нужен постоянный счётчик «N из M» рядом с заголовком фильтров, чтобы пользователь видел эффект каждого переключения.
      - Есть типовые комбинации фильтров, которые стоит вынести в один клик (пунктирные чипы-пресеты).
      - Требуется сброс отдельной группы фильтров, а не только «сбросить всё».
    avoid_when:
      - Фильтров 1-3 и они помещаются в панель инструментов над списком.
      - Нужно показать уже применённые фильтры над результатами — это другая задача.
      - Экран мобильный и панель обязана быть модальной шторкой — сама панель этого не умеет, нужна обёртка.
      - Выбор одного значения из перечня (сортировка, режим показа).
    instead_use:
      - case: показать и снять уже применённые фильтры над результатами
        component: filter-pills
      - case: панель фильтров должна выезжать шторкой на мобильном
        component: drawer
      - case: одиночный выбор из списка значений
        component: combobox
      - case: набор переключаемых опций без обвязки панели (шапка, пресеты, сброс)
        component: chip (.chips / .chip-choice)
      - case: та же фильтрация, но всплывающей панелью от кнопки
        component: dropdown (.popover)
      - case: пара полей «от — до» внутри группы фильтров
        component: inputs (.input-range)
    anatomy:
      block: .filter-panel
      elements: [__header, __title, __stats, __quick, __quick-label, __body, __footer, __reset-all]
      modifiers: []
      states: [has-active]
    behavior_contract:
      keyboard:
        - Пресеты, кнопки сброса группы и «сбросить все» — нативные button, достижимы Tab и срабатывают Enter/Space.
        - Видимый фокус у каждой кнопки — кольцо через box-shadow плюс прозрачный outline (переживает forced-colors).
      aria:
        - Панель обёрнута секцией с доступным именем (заголовок панели), группы фильтров — fieldset/legend или role="group" с меткой из __label.
        - Счётчик результатов «N из M» обязан обновляться в live-области, иначе изменение выдачи не озвучивается.
        - Кнопка сброса группы получает имя с названием группы, а не просто «сбросить».
      js_required:
        - Пересчитывать __stats и счётчики на чипах-опциях после каждого изменения фильтра.
        - Вешать и снимать класс .has-active на .filter-group — от него зависит показ кнопки сброса группы.
        - Реализовать сами пресеты, сброс группы и сброс всех фильтров, а также фильтрацию выдачи.
