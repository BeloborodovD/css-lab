  - name: picklist
    file: styles/components/picklist.css
    summary: Мультивыбор из перечня — контрол с чипами выбранного и панель с чекбоксами, поиском по списку, группами и полем «другое».
    use_when:
      - Из фиксированного перечня надо выбрать несколько значений и видеть их прямо в контроле.
      - Позиций много (десятки), нужны поиск-фильтр, группировка и массовые действия «выбрать все / снять все».
      - У опции есть код и расшифровка, и в контрол должен уходить только код.
      - Требуется разрешить ввод значения, которого нет в списке (поле «другое»).
    avoid_when:
      - Выбирается ровно одно значение.
      - Значения — цвета и различаются образцами, а не текстом.
      - Нужен список действий, а не выбор значений.
      - Вариантов 2-5 и они помещаются в ряд переключаемых чипов без панели.
    instead_use:
      - case: одиночный выбор с вводом и автодополнением
        component: combobox
      - case: выбор цвета из палитры
        component: swatch-picker
      - case: меню действий
        component: dropdown
      - case: 2-5 вариантов прямо в потоке формы
        component: chip (.chips / .chip-choice)
    anatomy:
      block: .picklist
      elements: [__control, __placeholder, __toggle, __caret, __chip, "__chip-remove", __panel, __search, __option, "__option-label", "__option-desc", "__option-body", __group, "__group-label", "__no-match", __actions, "__actions-count", "__chip-options", __other]
      modifiers: ["__panel--columns", "__panel--top", "__panel--sheet"]
      states: [is-open, is-filtered]
    behavior_contract:
      keyboard:
        - Клавиатурная точка входа — отдельная кнопка .picklist__toggle (интерактив не вкладывается в интерактив); контрол-контейнер кликабелен только мышью.
        - Escape закрывает панель; по опциям идёт обход нативными чекбоксами, подсветка строки даётся :focus-within без анимации.
        - Крестик чипа — кнопка 24x24 с собственным именем «убрать <значение>».
        - Закрытая панель выведена из Tab-порядка через visibility.
      aria:
        - Кнопка-раскрыватель держит aria-expanded, aria-controls на панели и aria-labelledby на метке поля.
        - Панель размечается группой с меткой; опции — нативные checkbox внутри label.
        - Поиск по списку и поле «другое» получают собственные aria-label.
      js_required:
        - Переключать .is-open, синхронизируя aria-expanded; закрывать по клику вне и по Escape.
        - Синхронизировать чипы контрола с состоянием чекбоксов и чипов-опций в обе стороны.
        - Фильтровать опции классом .is-filtered, показывать .picklist__no-match, обновлять счётчик выбранного.
        - Замерять свободное место и ставить .picklist__panel--top, а также задавать --transform-origin от триггера.
    tokens: ["--color-surface", "--color-text", "--color-text-muted", "--color-text-disabled", "--color-border", "--color-border-strong", "--color-accent", "--color-accent-soft", "--color-accent-soft-hover", "--color-accent-border", "--border-w", "--border-w-strong", "--radius-sm", "--radius-xs", "--radius-lg", "--shadow-focus", "--shadow-lg", "--transform-origin", "--z-dropdown", "--z-drawer", "--z-raised", "--space-px", "--space-1", "--space-2", "--space-8", "--fs-xs", "--fs-sm", "--fs-base", "--fw-semi", "--fw-bold", "--lh-snug", "--tracking-wide", "--duration-press", "--duration-dropdown", "--duration-exit", "--duration-modal", "--duration-modal-exit", "--ease-out", "--ease-in-out", "--ease-drawer"]
    showcase: "components.html#picklist"
    examples:
      - "Витрина: базовый список, вариант с чипами-опциями, группы, многоколоночная панель, переключатель размещения — components.html#picklist"
      - Анкетные поля технической формы, где у параметра допустимо несколько значений из справочника
    status: stable
    notes:
      - "'__panel--sheet' — не шторка из компонента drawer, а мобильная раскладка панели самого контрола: у неё нет оверлея, ловушки фокуса и закрытия по Escape как у модальной поверхности. Для модального листа действий берётся '.drawer--sheet'."

  - name: presence-strip
    file: styles/components/presence-strip.css
    summary: Индикатор присутствия — стек наложенных аватаров с «+N» и выпадающий список «кто сейчас работает и в каком разделе».
    use_when:
      - На портале или в приложении нужно показать, кто сейчас онлайн, компактно в шапке.
      - Кроме имени полезны должность и текущее местоположение пользователя в системе.
      - Список коротких участников нужно свернуть в «+N» и раскрывать по клику.
    avoid_when:
      - Нужен один аватар пользователя (свой или автора записи).
      - Нужно меню профиля с действиями (выйти, настройки).
      - Список участников большой и требует поиска и прокрутки как отдельная страница.
      - Ширина экрана меньше планшета — компонент намеренно скрывается ниже 1024px.
    instead_use:
      - case: одиночный аватар или группа без дропдауна
        component: avatar
      - case: меню текущего пользователя
        component: user-menu
      - case: полноценный список людей с поиском
        component: table / search-result-card
    anatomy:
      block: .presence-strip
      elements: [__label, __trigger, __list, __avatar, __dropdown, __head, __item, __who, __name, __role, __where]
      modifiers: ["__avatar--more", "__avatar--c1", "__avatar--c2", "__avatar--c3", "__avatar--c4"]
      states: [is-open]
    behavior_contract:
      keyboard:
        - Триггер — нативная кнопка; Escape закрывает список и возвращает фокус на триггер.
        - Закрытый список выведен из Tab-порядка через visibility.
      aria:
        - Триггер держит aria-expanded и осмысленное имя вида «на портале 5 человек — показать список».
        - Аватары в стеке декоративны (aria-hidden), смысл несёт подпись и содержимое списка.
        - Зелёная точка у строки — не единственный носитель: рядом текстом указан раздел.
      js_required:
        - Переключать .is-open и aria-expanded, закрывать по клику вне и по Escape с возвратом фокуса.
        - Наполнять список данными присутствия и поддерживать счётчик «+N».
    tokens: ["--color-surface", "--color-surface-hover", "--color-surface-active", "--color-border", "--color-text", "--color-text-muted", "--color-accent", "--color-success", "--color-warning", "--border-w", "--border-w-strong", "--radius", "--radius-sm", "--radius-full", "--shadow-focus", "--shadow-lg", "--transform-origin", "--z-dropdown", "--space-px", "--space-1", "--space-2", "--space-3", "--fs-xs", "--fs-sm", "--fw-medium", "--fw-semi", "--tracking-wide", "--duration-press", "--duration-dropdown", "--duration-exit", "--ease-out"]
    showcase: "components.html#presence-strip"
    examples:
      - "витрина: components.html#presence-strip — раскрывающийся список; второй живой экземпляр стоит в шапке витрины (#header-presence)"
      - Корпоративный портал, показывающий коллег онлайн и раздел, в котором они находятся
    status: stable

  - name: progress
    file: styles/components/progress.css
    summary: Индикатор прогресса — линейная полоса (в том числе неопределённая, полосатая, составная) и кольцевой вариант с подписью значения.
    use_when:
      - Операция имеет измеримую долю выполнения и её надо показать числом или полосой.
      - Прогресс неизвестен по длительности, но процесс идёт — нужен неопределённый вариант.
      - Значение состоит из нескольких долей одного целого (составная полоса).
      - Нужен компактный кольцевой индикатор в карточке или таблице.
    avoid_when:
      - Загрузка короткая и точной доли нет — полоса будет врать.
      - Ожидается контент, форму которого можно показать заранее.
      - Показывается положение в многошаговом сценарии, а не доля выполнения.
      - Прогресс относится к прохождению теста и живёт в его шапке.
    instead_use:
      - case: неопределённое короткое ожидание
        component: spinner
      - case: ожидание контента известной структуры
        component: skeleton
      - case: положение в многошаговом сценарии
        component: steps
      - case: прогресс прохождения теста
        component: quiz ("quiz-header__progress")
    anatomy:
      block: .progress
      elements: [progress-bar, progress-label, progress-container, progress-header, progress-title, progress-value, progress-circle, progress-circle-track, progress-circle-bar, progress-circle-value]
      modifiers: [progress-xs, progress-sm, progress-md, progress-lg, progress-xl, progress-success, progress-warning, progress-error, progress-info, progress-striped, progress-animated, progress-shimmer, progress-labeled, progress-with-label, progress-indeterminate, "progress-indeterminate-dual", progress-stacked, progress-gradient, "progress-gradient-rainbow", progress-circle-sm, progress-circle-lg]
      states: []
    behavior_contract:
      keyboard:
        - Собственного фокуса нет — компонент неинтерактивный.
      aria:
        - Разметка 'role="progressbar"' с aria-valuenow / aria-valuemin / aria-valuemax и доступным именем.
        - Для неопределённого варианта aria-valuenow не ставится.
        - Значение обязано быть доступно текстом (подпись или aria-valuetext), а не только длиной полосы.
      js_required:
        - Задавать ширину .progress-bar (или stroke-dashoffset у кольца) и синхронно обновлять aria-valuenow и текстовую подпись.
    tokens: ["--color-surface-sunken", "--color-accent", "--color-success", "--color-warning", "--color-error", "--color-info", "--color-text", "--color-text-muted", "--radius-full", "--space-2", "--space-3", "--fs-xs", "--fs-sm", "--fw-medium", "--fw-semi", "--t-slow", "--ease-out", "--ease-in-out"]
    showcase: "components.html#progress"
    examples:
      - "Витрина всех вариантов: components.html#progress"
      - Загрузка файла, выполнение фоновой задачи, заполненность квоты
      - "мини-полоса внутри карточки метрики: .stat-progress > .progress.progress-xs (stats собственной полосы не имеет)"
    status: stable

  - name: quiz
    file: styles/components/quiz.css
    summary: Прохождение теста — липкая акцентная шапка с таймером, прогрессом, статистикой и навигацией по блокам плюс карточки вопросов с состояниями «верно/неверно».
    use_when:
      - Нужен тест или проверка знаний с вариантами ответа и мгновенной обратной связью по правильности.
      - Прохождение ограничено временем и нужен видимый таймер и доля пройденного.
      - Вопросы сгруппированы в блоки и по ним нужна быстрая навигация.
      - После ответа вариант должен окраситься как верный/неверный, а вопрос — получить бейдж итога.
    avoid_when:
      - Собираются данные пользователя, а не проверяются знания — правильных ответов нет.
      - Нужен просто список вариантов выбора внутри формы.
      - Требуется опрос без подсчёта результата и без таймера.
    instead_use:
      - case: сбор данных формой с разделами
        component: form-section
      - case: выбор варианта в обычной форме
        component: inputs (radio / checkbox)
      - case: индикатор доли выполнения вне теста
        component: progress
      - case: общая акцентная шапка приложения
        component: layout (".header--accent")
    anatomy:
      block: .quiz-question
      elements: ["quiz-header", "quiz-header__top", "quiz-header__title", "quiz-header__sub", "quiz-header__timer", "quiz-header__progress", "quiz-header__progress-fill", "quiz-header__stats", "quiz-stat", "quiz-header__nav", "quiz-header__nav-btn", "quiz-question__id", "quiz-question__text", "quiz-options", "quiz-option", "quiz-option__letter", "quiz-result"]
      modifiers: ["quiz-stat--correct", "quiz-stat--wrong", "quiz-result--ok", "quiz-result--fail"]
      states: [is-active, is-selected, is-correct, is-wrong, is-disabled]
    behavior_contract:
      keyboard:
        - Варианты ответа — нативные кнопки: Tab обходит их, Enter/Space отвечает, фокус-кольцо видно.
        - Кнопки навигации по блокам достижимы Tab; на акцентном фоне контур рисуется цветом текста шапки, а не акцентом.
        - Отвеченный вариант выключается pointer-events и disabled, чтобы повторный ответ был невозможен.
      aria:
        - Группа вариантов размечается как radiogroup (или fieldset) с меткой из текста вопроса.
        - Итог ответа передаётся текстом бейджа .quiz-result, а не только цветом рамки и фона.
        - Таймер обновляется в live-области с вежливым режимом, иначе каждая секунда будет озвучиваться.
        - Полоса прогресса получает role="progressbar" со значениями.
      js_required:
        - Масштабировать .quiz-header__progress-fill через scaleX (0…1) — заполнение не через ширину.
        - Проставлять .is-selected / .is-correct / .is-wrong, вставлять бейдж итога и блокировать повторный ответ.
        - Вести таймер и статистику, переключать .is-active у кнопок навигации по блокам.
    tokens: ["--color-accent", "--color-accent-text", "--color-accent-soft", "--color-accent-border", "--color-on-accent-soft", "--color-on-accent-strong", "--color-on-accent-dim", "--color-on-accent-border", "--color-surface", "--color-border", "--color-text", "--color-text-muted", "--color-success", "--color-success-soft", "--color-success-text", "--color-error", "--color-error-soft", "--color-error-text", "--border-w", "--border-w-thick", "--border-w-strong", "--radius", "--radius-sm", "--radius-xs", "--radius-full", "--shadow", "--shadow-xs", "--shadow-focus", "--z-sticky", "--space-px", "--space-1", "--space-2", "--space-3", "--space-4", "--fs-xs", "--fs-sm", "--fs-base", "--fs-lg", "--fw-semi", "--fw-bold", "--lh-tight", "--lh-snug", "--tracking-wide", "--duration-press", "--duration-dropdown", "--duration-modal", "--ease-out", "--ease-in-out"]
    showcase: "components.html#quiz"
    examples:
      - "Витрина с рабочим примером ответа: components.html#quiz"
      - Аттестация или обучающий тест сотрудников с ограничением по времени
    status: stable

  - name: row-card
    file: styles/components/row-card.css
    summary: Повторяемая строка формы в виде карточки с номером и кнопками «добавить строку» / «удалить строку».
    use_when:
      - В форме есть массив однотипных записей переменной длины (позиции, аналоги, вложения, контакты).
      - У каждой записи несколько разнородных полей с собственными метками — таблица заставила бы дублировать метки.
      - Строки нужно нумеровать и перенумеровывать при удалении.
    avoid_when:
      - "Каждая запись — 5-7 однотипных числовых значений: одной шапки таблицы достаточно."
      - Записей десятки и их надо сортировать и сравнивать по колонкам.
      - Это не форма, а витрина карточек контента.
    instead_use:
      - case: массив однотипных числовых параметров
        component: table (".table--form", на мобильном разворачивается обликом row-card)
      - case: карточки контента
        component: cards
      - case: раздел формы с полями (не массив)
        component: form-section
    anatomy:
      block: .row-card
      elements: [__head, __n, __remove, "form-rows", "form-rows__add"]
      modifiers: []
      states: [is-entering, is-removing]
    behavior_contract:
      keyboard:
        - «Добавить» и «удалить» — нативные кнопки; после добавления фокус переносится в первое поле новой строки, после удаления — на соседнюю кнопку удаления или на «добавить».
      aria:
        - Кнопка удаления получает имя с номером строки («удалить аналог 2»), а не просто «удалить».
        - Контейнер строк объявляется live-областью либо изменение состава сообщается отдельно.
        - Номер строки в __n обязан обновляться в разметке, а не только визуально.
      js_required:
        - Клонировать шаблон строки, вешать .is-entering на вход и .is-removing на выход с удалением по transitionend (плюс страховка для reduced-motion).
        - Перенумеровывать строки после каждого добавления/удаления.
        - Обновлять имена и id полей внутри клонированной строки.
    tokens: ["--color-surface-sunken", "--color-border", "--color-accent", "--color-accent-soft", "--color-accent-soft-hover", "--color-accent-border", "--color-error", "--color-error-soft", "--color-error-soft-hover", "--border-w", "--radius-sm", "--radius-xs", "--space-1", "--space-2", "--space-3", "--fs-xs", "--fs-sm", "--fw-semi", "--duration-press", "--duration-dropdown", "--duration-exit", "--ease-out"]
    showcase: "components.html#row-card"
    examples:
      - "витрина: components.html#row-card — строка массива «аналоги» с добавлением и удалением"
      - "Сравнение с табличной формой массива: components.html#table-form"
      - Форма с перечнем аналогов, применений или вложений переменной длины
    status: stable

  - name: rte
    file: styles/components/rte.css
    summary: Мини-редактор форматированного текста — панель кнопок (жирный, курсив, списки, очистка) и редактируемая область с плейсхолдером.
    use_when:
      - Примечанию или описанию нужно минимальное форматирование: выделение, списки.
      - Обычного textarea мало, но полноценный редактор с таблицами и медиа избыточен.
      - Нужен плейсхолдер в редактируемой области, устойчивый к пустому переводу строки.
    avoid_when:
      - Текст простой и форматирование не требуется.
      - Нужен ввод кода или конфигурации с подсветкой.
      - Требуется редактор с таблицами, изображениями, вставкой из внешних источников — это отдельная библиотека.
    instead_use:
      - case: простой многострочный текст
        component: inputs (.textarea)
      - case: отображение кода или конфигурации
        component: code-panel
      - case: короткое однострочное значение
        component: inputs (.input)
    anatomy:
      block: .rte-area
      elements: ["rte-toolbar", "rte-toolbar__btn", "rte-toolbar__sep"]
      modifiers: ["rte-toolbar__btn--b", "rte-toolbar__btn--i"]
      states: ["[aria-pressed=true]", "[data-empty]"]
    behavior_contract:
      keyboard:
        - Кнопки панели — нативные button, достижимы Tab; нажатие не должно уводить фокус из области (mousedown гасится).
        - Редактируемая область фокусируется Tab и показывает то же кольцо, что и обычные поля ввода.
      aria:
        - Панель размечается 'role="toolbar"' с aria-label и связывается с областью (в витрине — через data-атрибут).
        - Каждая кнопка-переключатель держит aria-pressed и текстовое имя (символы «Ж»/«К» именем не являются).
        - Редактируемая область получает доступное имя и, при ограничении длины, связанный счётчик символов.
      js_required:
        - Применять команды форматирования и синхронизировать aria-pressed по состоянию выделения.
        - Ставить data-empty на области при вводе — селектор :empty оставлен лишь фолбэком и ложно срабатывает после Enter+Backspace.
        - Гасить mousedown на кнопках, чтобы не терять выделение.
    tokens: ["--color-surface", "--color-border", "--color-text-secondary", "--color-text-disabled", "--color-accent", "--color-accent-soft", "--color-accent-border", "--border-w", "--border-w-strong", "--radius-xs", "--radius-sm", "--shadow-focus", "--space-px", "--space-1", "--space-2", "--space-3", "--fs-sm", "--fs-base", "--fw-bold", "--lh-relaxed", "--duration-press", "--ease-out"]
    showcase: "components.html#rte"
    examples:
      - "витрина: components.html#rte — панель форматирования и редактируемая область"
      - Поле «примечание» или «особые требования» в технической форме
    status: stable

  - name: save-status
    file: styles/components/save-status.css
    summary: Пилюля состояния автосохранения черновика с отметкой времени и индикатором «данные не отправлены».
    use_when:
      - Форма сохраняет черновик автоматически и пользователь должен видеть, что изменения не потеряются.
      - Нужно честно предупредить, что данные лежат локально и на сервер ещё не ушли.
      - Отметка времени обновляется часто и вёрстку не должно дёргать — ширина зарезервирована, цифры моноширинные.
    avoid_when:
      - Сохранение разовое по кнопке — результат уместнее показать всплывающим сообщением.
      - Нужно сообщить об ошибке сохранения, требующей действия.
      - Нужна произвольная статусная метка сущности.
    instead_use:
      - case: результат разового действия
        component: toast
