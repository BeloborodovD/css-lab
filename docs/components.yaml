# Реестр паспортов компонентов css-lab.
#
# Источник истины о содержимом библиотеки: что есть, когда это применять и чем
# оно отличается от соседнего компонента. Рассчитан на потребителя, у которого
# есть только этот репозиторий — без доступа к внутренним проектам.
#
# Поля паспорта:
#   summary            — назначение одной строкой
#   use_when           — когда компонент уместен
#   avoid_when         — когда он не подходит
#   instead_use        — чем заменить в этих случаях
#   anatomy            — блок, элементы, модификаторы (варианты), состояния is-*
#   behavior_contract  — клавиатура, aria и что обязан делать JS
#   tokens             — потребляемые CSS-переменные
#   showcase           — якорь живого образца на витрине (null — образца нет)
#   examples           — класс задач, для которых компонент делался
#   status             — stable | new | legacy
#
# Обновляется при каждом пополнении библиотеки (шаг 03 пайплайна редизайна).
# Компонент без паспорта считается недоделанным.

components:
  - name: accordion
    file: styles/components/accordion.css
    summary: Список сворачиваемых секций с заголовком-кнопкой, счётчиком выбранного и шевроном; раскрытие через grid-template-rows 0fr→1fr.
    use_when:
      - Длинная страница с несколькими смысловыми блоками, из которых одновременно нужен один-два (FAQ, справка, разделы формы).
      - Панель фасетных фильтров, где каждая группа критериев должна показывать счётчик выбранных значений (модификатор "__count").
      - Контент внутри секции короткий и не содержит вложенного скролла — анимация высоты локализована через contain.
    avoid_when:
      - Нужно показать содержимое поверх страницы, не сдвигая соседей — аккордеон толкает поток вниз.
      - Секций больше десятка и пользователь ищет одну по названию — список поиска/навигации эффективнее.
      - Внутри секции лежит виртуализированный список или таблица с собственным скроллом — 0fr→1fr будет дёргаться.
    instead_use:
      - case: нужно раскрыть панель поверх контента от триггера
        component: dropdown
      - case: нужен многошаговый линейный процесс, а не произвольное раскрытие
        component: steps
      - case: нужна группировка полей формы без сворачивания
        component: form-section
      - case: нужен выбор значений из свёрнутого списка, а не показ текста
        component: picklist
    anatomy:
      block: .accordion
      elements: [__item, __header, __count, __chevron, __panel, __panel-inner, __body]
      modifiers: ["__count--empty"]
      states: [is-open]
    behavior_contract:
      keyboard:
        - Заголовок секции — настоящий button, доступен по Tab, срабатывает по Enter и Space.
        - Видимый фокус на заголовке через box-shadow inset (кольцо не обрезается overflow контейнера).
      aria:
        - На .accordion__header обязателен aria-expanded, синхронный с классом is-open.
        - На .accordion__header — aria-controls на id панели; у панели этот id обязан существовать.
        - "Счётчик .accordion__count несёт aria-label с расшифровкой (\"выбрано: 3\"), иначе цифра без контекста."
      js_required:
        - Переключать класс is-open на .accordion__item по клику на заголовке.
        - Синхронно переписывать aria-expanded на кнопке-заголовке.
        - Ничего анимировать из JS не нужно — вся высота и шеврон анимируются CSS.
    tokens: ["--border-w", "--border-w-strong", "--color-border", "--color-border-subtle", "--color-surface", "--color-surface-hover", "--color-surface-active", "--color-text", "--color-text-muted", "--color-text-secondary", "--color-accent", "--color-accent-text", "--radius", "--radius-full", "--shadow-focus", "--space-px", "--space-2", "--space-3", "--space-4", "--fs-xs", "--fs-sm", "--fs-base", "--fw-semi", "--lh-relaxed", "--duration-press", "--duration-dropdown", "--ease-out", "--ease-in-out"]
    showcase: "components.html#accordion"
    examples:
      - "витрина: components.html#accordion — три секции с счётчиками выбранного"
      - "страница-пример: pages/datasheet.html — блок «Вопросы и ответы» под карточкой изделия"
      - "класс задач: панель фасетных фильтров каталога, где группы критериев сворачиваются и показывают число выбранного"
    status: stable

  - name: alerts
    file: styles/components/alerts.css
    summary: Статичный баннер сообщения в потоке страницы — info/success/warning/error, мягкая заливка плюс акцентная левая граница; единственная плашка сообщения в библиотеке.
    use_when:
      - Нужно объяснить состояние страницы или формы прямо в месте, к которому сообщение относится.
      - Сообщение должно остаться на экране до реакции пользователя (ошибка входа, предупреждение о нестандартном значении).
      - Требуется закрываемое сообщение с крестиком — вариант "alert-dismissible" плюс "alert-close".
      - Нужна строка «иконка + текст + крестик»: раскладка включается сама, как только внутри есть .alert-icon или .alert-dismissible.
    avoid_when:
      - Сообщение кратковременное и не требует действия — баннер в потоке сдвигает вёрстку.
      - Нужно перечислить ошибки нескольких полей формы со ссылками на них.
      - Сообщение относится к одному полю ввода — там работает подпись ошибки самого поля.
    instead_use:
      - case: кратковременное уведомление поверх интерфейса, само исчезает
        component: toast
      - case: сводка ошибок формы со ссылками на невалидные поля
        component: form-error-summary
      - case: ошибка конкретного поля рядом с ним
        component: inputs
      - case: сообщение требует решения и блокирует работу
        component: modal
    anatomy:
      block: .alert
      elements: [alert-title, alert-icon, alert-content, alert-close]
      modifiers: ["alert-info", "alert-success", "alert-warning", "alert-error", "alert-danger", "alert-dismissible", "note"]
      states: [alert-animate-in, alert-animate-out, alert-dismissing]
    behavior_contract:
      keyboard:
        - Кнопка закрытия — button, достижима по Tab, имеет видимое кольцо фокуса.
      aria:
        - Динамически появившийся баннер обязан лежать в контейнере с role="alert" или aria-live, иначе скринридер его не озвучит.
        - Кнопке закрытия нужен aria-label — символ крестика не читается.
        - Тип сообщения нельзя нести только цветом — вариант дублируется текстом заголовка (.alert-title).
      js_required:
        - Для закрытия — навесить класс "alert-dismissing" либо "alert-animate-out" и удалить узел по transitionend/animationend.
        - Для появления — добавить "alert-animate-in" после вставки в DOM.
    tokens: ["--space-1", "--space-2", "--space-3", "--space-4", "--fs-sm", "--fs-lg", "--fw-semi", "--lh-normal", "--border-w", "--border-w-thick", "--border-w-strong", "--color-border", "--color-surface-sunken", "--color-text-muted", "--color-text-secondary", "--color-info", "--color-info-soft", "--color-info-text", "--color-success", "--color-success-soft", "--color-success-text", "--color-warning", "--color-warning-soft", "--color-warning-text", "--color-error", "--color-error-soft", "--color-error-text", "--radius-sm", "--radius-xs", "--shadow-focus", "--t", "--t-fast", "--t-slow", "--ease", "--ease-out"]
    showcase: "components.html#alerts"
    examples:
      - "витрина: components.html#alerts — четыре семантических варианта плюс строчный вид с иконкой и крестиком"
      - "страница-пример: pages/login.html — сообщение об ошибке авторизации над формой"
      - "класс задач: предупреждение о нестандартных значениях в длинной технической форме-опроснике"
    status: stable
    notes:
      - "2026-07-30: сюда сведена вторая реализация плашки — .alert-box из logs.css. Соответствие имён: .alert-box → .alert + .alert-info/.alert-warning/.alert-error/.alert-success, .alert-box-content → .alert-content, .alert-box-close → .alert-close, иконка получает класс .alert-icon."
      - "Тип сообщения задаётся модификатором .alert-info/…, а не голым .info: односложные имена состояний зарезервированы за другими блоками."

  - name: app-layout
    file: styles/components/app-layout.css
    summary: Каркас приложения с фиксированной шапкой, двумя выдвижными боковыми панелями (левая навигация, правая — служебная), центральной колонкой и фиксированным подвалом.
    use_when:
      - Страница-приложение, где навигация и служебная панель должны открываться и закрываться, не унося пользователя с текущего экрана.
      - На широком экране открытая панель должна сдвигать контент, а не перекрывать его (push-поведение через ":has()").
      - Пользователю нужна ручная ширина боковой панели (ручка ресайза) и переключение ширины центральной колонки.
    avoid_when:
      - Обычная контентная страница без постоянной навигации — достаточно каркаса страницы.
      - "Панель модальная по смыслу: должна перехватывать фокус и закрываться по Escape."
      - Нужен только мобильный ящик навигации без десктопного push-режима.
    instead_use:
      - case: модальная выдвижная панель с оверлеем и ловушкой фокуса
        component: drawer
      - case: только контентная колонка с полями и отступами
        component: page-shell
      - case: сама боковая панель — каркас, шторка, ручка ресайза и наполнение
        component: sidebar
    anatomy:
      block: .app-layout
      elements: [app-content, width-control, site-footer]
      modifiers: []
      states: ["sidebar-left-open", "sidebar-right-open", "sidebar-both-open", "width-fixed", "width-fluid", "width-full"]
    behavior_contract:
      keyboard:
        - Кнопка-переключатель панели достижима по Tab и меняет aria-expanded.
        - Закрытая панель не должна ловить Tab — её нужно выключать (inert/hidden), CSS этого не делает.
        - Ручка ресайза мышиная; ширину обязан дублировать доступный элемент управления либо она остаётся необязательной.
      aria:
        - Боковая панель — landmark (aside/nav) с aria-label, иначе двух «боковин» не различить.
        - Кнопка переключения ширины нуждается в понятном названии и в объявлении текущего режима.
      js_required:
        - "Переключать is-open на панели .sidebar (см. паспорт sidebar) — раскладка реагирует на это состояние сама."
        - Для браузеров без ":has()" — навешивать классы-фолбэки "sidebar-left-open"/"sidebar-right-open"/"sidebar-both-open" на .app-content.
        - При ручном ресайзе — писать ширину в "--sidebar-w-left"/"--sidebar-w-right", иначе отступы центра разъедутся с панелью.
        - Режим ширины — класс "width-fixed"/"width-fluid"/"width-full" на body плюс сохранение выбора.
    tokens: ["--sidebar-w", "--sidebar-w-sm", "--sidebar-width", "--sidebar-w-left", "--sidebar-w-right", "--header-h", "--color-bg", "--color-surface", "--color-surface-hover", "--color-surface-sunken", "--color-border", "--color-border-strong", "--color-accent", "--color-text", "--color-text-muted", "--color-success", "--border-w", "--radius-full", "--shadow", "--space-px", "--space-2", "--space-3", "--space-4", "--space-5", "--space-6", "--space-16", "--space-20", "--icon-size-lg", "--touch-target-min", "--fs-xs", "--fs-sm", "--z-sticky", "--duration-press", "--duration-modal", "--ease-out", "--ease-drawer"]
    showcase: "components.html#app-layout"
    examples:
      - "витрина: components.html#app-layout — подмакетник каркаса (панель раздвигает контент; узкий экран — панель поверх с подложкой)"
      - "витрина: components.html — каркас самой страницы витрины (две боковые панели, оверлей, переключатель ширины)"
      - "класс задач: рабочее место оператора или внутренний портал, где слева дерево навигации, справа — служебные фильтры и настройки"
    status: stable
    notes:
      - "Раскладка реагирует на открытую панель только прямым потомком (:has(> .sidebar--left.is-open) > .app-content) — вложенный каркас не двигает внешнюю колонку."
      - "Дублирование: .site-footer здесь стилизуется повторно — подвал уже описан в styles/layout/site-footer.css и styles/components/footer.css (в беклоге)."

  - name: autotrassir
    file: styles/components/autotrassir.css
    summary: "Набор для галереи снимков-событий: карточка кадра с наложением и быстрыми действиями, скелетон карточки, индикаторы статуса, моноширинный «номерной» текст и строки временных меток."
    use_when:
      - Лента или сетка снимков от камер и датчиков, где под изображением показывается распознанное значение и время события.
      - Нужны быстрые действия (скачать, удалить), появляющиеся на карточке при наведении.
      - Нужен ряд «метка → значение» с моноширинными временными штампами и цветным индикатором состояния.
    avoid_when:
      - Карточка не про изображение, а про текстовые данные — базовая карточка гибче.
      - "Быстрые действия должны быть доступны с клавиатуры и на тач-экране: здесь они появляются только по hover."
      - Нужен скелетон загрузки общего назначения — в проекте есть отдельный компонент скелетона, который перекрывает этот.
    instead_use:
      - case: обычная контентная карточка без изображения-героя
        component: cards
      - case: плейсхолдеры загрузки любого блока
        component: skeleton
      - case: подпись состояния текстом, а не точкой
        component: badge
      - case: карточка результата поиска со сниппетом
        component: search-result-card
    anatomy:
      block: .photo-card
      elements: [photo-card-image, photo-card-overlay, photo-card-plate, photo-card-content, photo-card-timestamp, photo-card-meta, quick-actions, quick-action-btn, photo-card-skeleton, status-indicator, status-text, license-plate, lightbox-plate-box, timestamps-grid, timestamp-row]
      modifiers: ["license-plate-highlight", "photo-card-skeleton", "icon-amber", "icon-success", "icon-warning", "icon-error", "icon-primary", "icon-muted", "direction-enter", "direction-exit"]
      states: [success, warning, error, info, highlight]
    behavior_contract:
      keyboard:
        - "Карточка кликабельна (cursor: pointer) — разметка обязана сделать её кнопкой или ссылкой, иначе она недостижима с клавиатуры."
        - Быстрые действия видимы только по hover — им нужен показ и по :focus-within, иначе клавиатурный пользователь их не увидит.
      aria:
        - "Индикатор состояния — строка .status-indicator: точка (общий примитив .badge-dot из badge.css) плюс обязательная подпись .status-text; цвет носителем смысла не является."
        - Распознанное значение (.license-plate) моноширинное и в верхнем регистре — регистр задаётся стилем, текст в разметке пишется как есть.
      js_required:
        - Открытие полноразмерного просмотра и обработка быстрых действий — целиком на стороне разметки/скриптов, CSS только оформляет.
    tokens: ["--color-surface", "--color-surface-sunken", "--color-surface-hover", "--color-border", "--color-border-strong", "--color-text", "--color-text-muted", "--color-accent", "--color-accent-soft", "--color-success", "--color-warning", "--color-error", "--color-info", "--border-w", "--border-w-strong", "--radius", "--radius-sm", "--radius-xs", "--radius-full", "--shadow-sm", "--space-1", "--space-2", "--space-3", "--font-mono", "--fs-xs", "--fs-sm", "--fs-base", "--fs-2xl", "--fw-medium", "--fw-semi", "--fw-bold", "--tracking-wide", "--t", "--t-fast", "--t-slower", "--ease", "--ease-in-out"]
    showcase: "components.html#autotrassir"
    examples:
      - "\"витрина: components.html#logs — секция называется «AutoTrassir Components», но якорь секции — id=\\\"logs\\\"\""
      - "класс задач: журнал событий видеонаблюдения или контроля доступа со снимком, распознанным номером и парой временных меток"
    status: legacy
    notes:
      - "2026-07-30: собственный .skeleton и одноимённый @keyframes skeleton-pulse удалены. Имя keyframes глобальное, и вторая копия перебивала компонент по порядку импорта; заглушка карточки кадра теперь берёт .skeleton из styles/components/skeleton.css, здесь остались только её размеры внутри .photo-card-skeleton."
      - "Именование вне общей схемы: классы привязаны к предметной области (photo-card, license-plate), а не к роли в интерфейсе."
      - "2026-07-30: собственная точка .status-dot удалена — в разметке .badge-dot с семантическим модификатором (.badge-dot-success/-warning/-error/-info)."

  - name: avatar
    file: styles/components/avatar.css
    summary: Аватар пользователя — картинка или инициалы, пять размеров, круглая и квадратная форма, индикатор присутствия и наложенная группа с остатком «+N».
    use_when:
      - Нужно опознать автора или участника в списке, комментарии, шапке.
      - Нужно показать нескольких участников компактно — наложенная группа с остатком.
      - Нужен статус присутствия рядом с лицом (в сети / занят / отошёл / не в сети).
    avoid_when:
      - Изображение является содержимым, а не идентификатором — аватар всегда обрезается в круг/квадрат фиксированного размера.
      - Нужно показать только имя без визуального идентификатора.
      - Нужен счётчик непрочитанного на иконке — это другая роль.
    instead_use:
      - case: полоса «кто сейчас на странице» с движением и подсказками
        component: presence-strip
      - case: меню текущего пользователя с действиями
        component: user-menu
      - case: счётчик на иконке (уведомления, корзина)
        component: badge
      - case: плейсхолдер аватара во время загрузки
        component: skeleton
    anatomy:
      block: .avatar
      elements: [avatar-image, avatar-initials, avatar-status, avatar-count, avatar-group]
      modifiers: ["avatar-xs", "avatar-sm", "avatar-md", "avatar-lg", "avatar-xl", "avatar-square", "avatar-bordered", "avatar-clickable", "avatar-placeholder", "avatar-status-online", "avatar-status-offline", "avatar-status-busy", "avatar-status-away", "avatar-group-xs", "avatar-group-sm", "avatar-group-lg"]
      states: []
    behavior_contract:
      keyboard:
        - Вариант "avatar-clickable" обязан быть button или ссылкой — стиль даёт только курсор и кольцо фокуса.
      aria:
        - Картинке нужен осмысленный alt (имя), либо alt="" плюс подпись рядом.
        - "Статус присутствия — цветная точка без текста; смысл обязан нести aria-label или видимая подпись. Разметка: <span class=\"badge-dot avatar-status avatar-status-online\" role=\"img\" aria-label=\"в сети\">."
        - Остаток "+N" в группе нуждается в расшифровке для скринридера (сколько ещё участников).
      js_required:
        - "Ничего: компонент полностью декларативный, состояние задаётся классами в разметке."
    tokens: ["--radius", "--radius-sm", "--radius-lg", "--radius-full", "--color-accent", "--color-accent-soft", "--color-surface", "--color-surface-active", "--color-surface-sunken", "--color-border", "--color-text", "--color-text-muted", "--color-success", "--color-error", "--color-warning", "--border-w-strong", "--shadow-sm", "--shadow-focus", "--fw-semi", "--fs-xs", "--fs-sm", "--fs-base", "--fs-md", "--fs-2xl", "--t-fast", "--ease", "--z-raised"]
    showcase: "components.html#avatar"
    examples:
      - "витрина: components.html#avatar — размеры, статусы, группы"
      - "класс задач: список участников обсуждения или таблица задач с исполнителями"
    status: stable
    notes:
      - "Точка статуса выступает за круг аватара, поэтому обрезка по кругу живёт на самой картинке (.avatar-image), а не на блоке: overflow:hidden на .avatar срезал бы индикатор."
      - "Сама точка — общий примитив .badge-dot (badge.css); .avatar-status добавляет к нему только место у кромки круга, размер под размер аватара и кольцо в цвет поверхности, а .avatar-status-online/-offline/-busy/-away — цвет присутствия."

  - name: badge
    file: styles/components/badge.css
    summary: "Неинтерактивный носитель статуса: пилюля со счётчиком или короткой подписью, точка-индикатор без подписи и накладка того и другого на иконку."
    use_when:
      - Нужно показать число (непрочитанные, количество позиций) поверх иконки — вариант "badge-float" на позиционированном контейнере.
      - Нужна короткая неинтерактивная подпись состояния рядом с заголовком или в таблице.
      - Нужна точка состояния без подписи — "badge-dot" плюс семантический цвет; это единственный примитив точки в библиотеке.
    avoid_when:
      - Метка кликабельна, переключается или снимается пользователем — это чип, а не бейдж.
      - "Текст длинный: бейдж рассчитан на цифру или одно-два слова."
      - Нужен полноценный статус со значком и семантической подложкой в карточке — там уместнее чип.
    instead_use:
      - case: интерактивная метка-переключатель, выбор фильтра, удаляемая метка
        component: chip
      - case: снимаемые условия текущей выборки над списком
        component: filter-pills
      - case: облако меток с весами
        component: tag-cloud
      - case: тот же бейдж на колокольчике вместе с панелью списка уведомлений и пульсацией
        component: notification-badge
    anatomy:
      block: .badge
      elements: [badge-dot]
      modifiers: ["badge-float", "badge-outline", "badge-secondary", "badge-success", "badge-warning", "badge-error", "badge-info", "badge-dot-sm", "badge-dot-lg", "badge-dot-accent", "badge-dot-success", "badge-dot-warning", "badge-dot-error", "badge-dot-info", "badge-dot-muted"]
      states: []
    behavior_contract:
      keyboard:
        - "Ничего: бейдж не интерактивен. Если по нему кликают — это чип или кнопка."
      aria:
        - Числовой бейдж на иконке обязан иметь текстовую расшифровку (aria-label на кнопке-носителе), число само по себе бессмысленно.
        - "Точка .badge-dot декоративна: смысл несёт текст рядом или aria-label, цвет — только подкрепление."
        - Семантические варианты различаются только цветом — состояние обязано дублироваться текстом.
      js_required:
        - "Ничего: компонент декларативный, значение и цвет задаются разметкой."
    tokens: ["--space-1", "--space-2", "--fs-xs", "--fw-semi", "--color-accent", "--color-accent-text", "--color-text-on-accent", "--color-text-secondary", "--color-text-muted", "--color-surface", "--color-surface-active", "--color-success", "--color-warning", "--color-error", "--color-info", "--border-w", "--border-w-strong", "--radius-full"]
    showcase: "components.html#badges"
    examples:
      - "витрина: components.html#badges — пилюли и точки состояния"
      - "страница-пример: pages/catalog.html — метки классов эффективности на карточках изделий"
      - "класс задач: счётчик новых записей на иконке в шапке, статусные метки в таблице заказов"
    status: stable
    notes:
      - "Точка .badge-dot — общий примитив: её используют подвал (.footer-status), галерея событий (.status-indicator), индикатор уведомлений и аватар (.avatar-status добавляет только место у кромки круга и кольцо)."
      - "Мягкая метка .tag жила здесь до 2026-07-30 и была той же ролью, что чип: удалена, разметка переведена на .chip/.chip-removable."

  - name: brand-mark
    file: styles/components/brand-mark.css
    summary: Логотип текущего бренда как фоновое изображение из токена темы плюс сегментированный переключатель брендов; одна и та же разметка работает для любого бренда, светлой и тёмной темы.
    use_when:
      - В шапке или на титульном экране нужен логотип, который сам меняется при смене бренда через "data-brand".
      - Нужен белый (mono) логотип на фирменной подложке — "brand-mark--mono" внутри "brand-plate".
      - Нужен видимый переключатель бренда в виде сегмент-контрола.
    avoid_when:
      - Логотип должен попасть в разметку как содержимое (например, для копирования или экспорта) — здесь это фон, а не img.
      - "Нужен произвольный логотип, не входящий в набор тем: токен \"--brand-logo\" вне бренд-темы не определён и блок схлопывается."
      - Переключается не бренд, а светлая/тёмная тема — это отдельный элемент управления.
    instead_use:
      - case: переключение двух-трёх взаимоисключающих режимов, не связанных с брендом
        component: toggle
      - case: выбор одного значения из длинного списка
        component: combobox
    anatomy:
      block: .brand-mark
      elements: [brand-plate, "brand-switcher", "brand-switcher__option"]
      modifiers: ["brand-mark--sm", "brand-mark--lg", "brand-mark--mono"]
      states: ["is-active", 'aria-pressed="true"']
    behavior_contract:
      keyboard:
        - Каждая опция переключателя — button, обходится Tab, срабатывает Enter/Space, имеет видимое кольцо фокуса.
      aria:
        - "Логотип-фон не читается скринридером: элементу нужен role=\"img\" и aria-label."
        - Контейнер переключателя — role="group" с aria-label.
        - Активный бренд помечается aria-pressed="true" на своей кнопке; подсветка подложкой — только дубль.
      js_required:
        - Ставить выбранный бренд атрибутом "data-brand" на body и переписывать aria-pressed у опций.
        - Сохранять выбор и восстанавливать его до первой отрисовки, иначе логотип мигнёт чужим брендом.
        - Токены "--brand-logo", "--brand-logo-mono", "--brand-logo-scale", "--brand-logo-aspect", "--brand-plate-bg" обязана дать тема бренда.
    tokens: ["--brand-mark-h", "--brand-logo", "--brand-logo-mono", "--brand-logo-scale", "--brand-logo-aspect", "--brand-plate-bg", "--color-accent", "--color-surface", "--color-surface-sunken", "--color-border", "--color-text", "--color-text-muted", "--border-w", "--border-w-strong", "--radius", "--radius-full", "--shadow-sm", "--shadow-focus", "--space-1", "--space-2", "--space-3", "--space-4", "--space-6", "--fs-sm", "--fw-medium", "--duration-press", "--ease-out"]
    showcase: "components.html#brand"
    examples:
      - "витрина: components.html#brand — переключатель, цветной и белый логотип, типографика каждого бренда"
      - "страницы-примеры: pages/catalog.html, pages/login.html, pages/form.html, pages/datasheet.html, pages/dashboard.html — логотип и переключатель в шапке"
      - "класс задач: мультибрендовый портал, где один интерфейс обслуживает несколько торговых марок"
    status: stable

  - name: breadcrumbs
    file: styles/components/breadcrumbs.css
    summary: "Путь по уровням вложенности: ссылки-предки, разделители (символ задаётся модификатором) и невыделяемый текущий уровень."
    use_when:
      - Страница лежит глубже второго уровня и пользователю нужно вернуться на любой из предков.
      - Иерархия реальная и стабильная (каталог → раздел → изделие), а не история переходов.
      - Путь длинный и середину нужно свернуть — элемент "breadcrumb-ellipsis".
    avoid_when:
      - Плоская структура сайта — крошки из одного звена бессмысленны.
      - Нужно показать прогресс по шагам процесса.
      - Нужна основная навигация между разделами.
    instead_use:
      - case: линейный многошаговый процесс с состоянием шагов
        component: steps
      - case: основное меню разделов
        component: nav
      - case: переключение вкладок внутри одной страницы
        component: tabs
    anatomy:
      block: .breadcrumbs
      elements: [breadcrumb-item, breadcrumb-separator, breadcrumb-icon, breadcrumb-home, breadcrumb-ellipsis]
      modifiers: ["breadcrumbs-slash", "breadcrumbs-arrow", "breadcrumbs-chevron", "breadcrumbs-dot", "breadcrumbs-boxed", "breadcrumbs-sm", "breadcrumbs-lg"]
      states: [current]
    behavior_contract:
      keyboard:
        - Предки — обычные ссылки, обходятся Tab, кольцо фокуса видимо.
        - "Текущий уровень получает pointer-events: none — он не должен быть ссылкой в разметке."
      aria:
        - Контейнер обёрнут в nav с aria-label ("Хлебные крошки").
        - Текущий уровень помечается aria-current="page".
        - Разделители декоративны — скрываются от скринридера (aria-hidden), иначе читаются как текст.
      js_required:
        - Ничего для статичного пути; сворачивание середины по клику на многоточие требует обработчика.
    tokens: ["--space-1", "--space-2", "--space-3", "--space-4", "--fs-xs", "--fs-sm", "--fs-base", "--fw-medium", "--color-text", "--color-text-muted", "--color-text-disabled", "--color-accent", "--color-accent-soft", "--color-surface", "--color-surface-hover", "--color-border", "--border-w", "--border-w-strong", "--radius-xs", "--radius-sm", "--shadow-focus", "--t-fast", "--ease"]
    showcase: "components.html#breadcrumbs"
    examples:
      - "витрина: components.html#breadcrumbs — вариант со слэшем и с шевроном"
      - "страницы-примеры: pages/catalog.html и pages/datasheet.html — путь над списком и над карточкой изделия"
      - "класс задач: каталог с разделами и карточками, файловый менеджер, база документов"
    status: stable
    notes:
      - "Глиф разделителя рисует CSS (.breadcrumbs .breadcrumb-separator::before): в разметке элемент пустой и помечен aria-hidden. Символ, написанный в тексте, даёт двойной разделитель."

  - name: buttons
    file: styles/components/buttons.css
    summary: Базовая кнопка и её варианты по важности (первичная, контурная, призрачная, вторичная, опасная, «на акцентной заливке»), размеры, иконочная форма, группа и состояние загрузки.
    use_when:
      - "Любое действие, инициируемое пользователем: отправка формы, открытие панели, вызов диалога."
      - Действий несколько и их нужно упорядочить по важности — варианты задают иерархию.
      - Кнопка живёт на акцентной подложке (полоса шапки) — вариант "btn-on-accent" сохраняет контраст и кольцо фокуса.
    avoid_when:
      - Элемент ведёт на другую страницу и должен открываться в новой вкладке или копироваться — это ссылка.
      - Нужно переключать бинарное состояние с видимым положением.
      - Нужен выбор одного значения из набора — набор кнопок это не решает.
    instead_use:
      - case: переключение включено/выключено
        component: toggle
      - case: выбор из набора взаимоисключающих значений
        component: chip
      - case: действие раскрывает список других действий
        component: dropdown
      - case: набор фильтров-переключателей над списком
        component: filter-pills
    anatomy:
      block: .btn
      elements: [btn-group]
      modifiers: ["btn-primary", "btn-secondary", "btn-outline", "btn-ghost", "btn-danger", "btn-on-accent", "btn-icon", "btn-sm", "btn-lg", "btn-block-mobile", "btn-responsive", "btn-group-stack-mobile"]
      states: [disabled, "btn-loading"]
    behavior_contract:
      keyboard:
        - "Элемент обязан быть button или ссылкой: Tab, Enter/Space, видимое кольцо фокуса через box-shadow плюс прозрачный outline (чтобы фокус выжил в forced-colors)."
        - Заблокированная кнопка выключает pointer-events — причина блокировки обязана быть объяснена рядом текстом.
      aria:
        - Иконочной кнопке ("btn-icon") обязателен aria-label.
        - Состояние загрузки ("btn-loading") прячет текст цветом — нужен aria-busy и текстовое объявление результата.
        - Кнопка, раскрывающая панель, несёт aria-expanded.
      js_required:
        - Ничего для оформления; классы состояния ("btn-loading", disabled) навешивает логика формы.
    tokens: ["--space-1", "--space-2", "--space-3", "--space-4", "--space-5", "--space-6", "--fs-sm", "--fs-base", "--fs-md", "--fw-medium", "--lh-tight", "--icon-size", "--color-text", "--color-text-secondary", "--color-text-on-accent", "--color-bg", "--color-surface", "--color-surface-hover", "--color-surface-active", "--color-surface-sunken", "--color-border", "--color-border-strong", "--color-accent", "--color-accent-hover", "--color-accent-active", "--color-accent-soft", "--color-accent-soft-hover", "--color-accent-text", "--color-error", "--color-error-hover", "--color-on-accent-soft", "--color-on-accent-strong", "--color-on-accent-border", "--border-w", "--border-w-strong", "--radius-sm", "--radius-full", "--shadow-focus", "--shadow-focus-error", "--t-fast", "--ease"]
    showcase: "components.html#buttons"
    examples:
      - "витрина: components.html#buttons — варианты, размеры, группы, состояние загрузки"
      - "страницы-примеры: pages/form.html, pages/datasheet.html, pages/dashboard.html, pages/login.html, pages/catalog.html"
      - "класс задач: панель действий над формой (сохранить / сбросить / выгрузить), кнопки в шапке с акцентной заливкой"
    status: stable

  - name: cards
    file: styles/components/cards.css
    summary: "Универсальная карточка-контейнер: тонкая рамка, шапка с заголовком, тело, подвал и мета-строка; варианты — кликабельная, приподнятая, стеклянная, акцентная, компактная, выбранная; плюс раскладки список и сетка."
    use_when:
      - Разнородный блок контента нужно отделить от фона и сгруппировать (заголовок плюс текст плюс действия).
      - Нужна сетка однотипных элементов с автоподбором колонок ("card-grid").
      - Карточка целиком кликабельна и ведёт к подробностям ("card-interactive").
    avoid_when:
      - Данные табличные и сравниваются между строками — карточки ломают выравнивание колонок.
      - Нужен плотный список пар «параметр — значение» на печатном листе.
      - Карточек десятки и каждая содержит форму — вложенные рамки создают визуальный шум.
    instead_use:
      - case: лист характеристик изделия, пригодный к печати
        component: spec-sheet
      - case: строка списка с действиями справа
        component: row-card
      - case: результат поиска со сниппетом и подсветкой
        component: search-result-card
      - case: числовой показатель с динамикой
        component: stats
    anatomy:
      block: .card
      elements: [card-header, card-title, card-body, card-footer, card-meta, card-list, card-grid]
      modifiers: ["card-interactive", "card-elevated", "card-glass", "card-accent", "card-compact", "card-selected", "card-header-inline", "card-list-animated"]
      states: ["card-animate-in", "card-loading"]
    behavior_contract:
      keyboard:
        - Кликабельная карточка обязана быть ссылкой/кнопкой или иметь tabindex — CSS даёт только кольцо фокуса.
        - Внутри кликабельной карточки не должно быть вложенных интерактивных элементов (вложенная кнопка перехватывает фокус).
      aria:
        - Заголовок карточки должен быть настоящим заголовком нужного уровня, а не просто крупным текстом.
        - Состояние "card-selected" передаётся цветом — нужен aria-selected или aria-pressed на носителе.
        - "\"card-loading\" — плейсхолдер: контейнеру нужен aria-busy."
      js_required:
        - Ничего для статики; классы анимации входа и загрузки навешивает логика списка.
    tokens: ["--color-surface", "--color-surface-hover", "--color-border", "--color-border-strong", "--color-border-subtle", "--color-accent", "--color-accent-soft", "--color-text", "--color-text-secondary", "--color-text-muted", "--surface-glass", "--surface-glass-border", "--blur-glass", "--border-w", "--border-w-thick", "--border-w-strong", "--radius", "--radius-sm", "--shadow", "--shadow-sm", "--shadow-focus", "--space-1", "--space-2", "--space-3", "--space-4", "--space-5", "--fs-xs", "--fs-sm", "--fs-base", "--fs-md", "--fs-lg", "--fw-semi", "--lh-snug", "--lh-normal", "--tracking-tight", "--t", "--t-slow", "--ease", "--ease-out", "--ease-in-out"]
    showcase: "components.html#cards"
    examples:
      - "витрина: components.html#cards, а также обёртка почти всех демо-блоков витрины"
      - "класс задач: сетка изделий каталога, панели показателей на сводном экране, блоки настроек"
    status: stable

  - name: chip
    file: styles/components/chip.css
    summary: "Компактная пилюля-значение: неинтерактивная метка, переключаемая опция множественного выбора и удаляемый чип; полный набор семантических цветов и три плотности."
    use_when:
      - Множественный выбор значений в один клик, когда вариантов немного и все видны сразу ("chip-choice" плюс "is-active").
      - Нужно показать набор выбранных значений с возможностью снять каждое ("chip-removable").
      - Нужен ряд удаляемых меток без логики фильтрации ("chip-group" плюс "chip-removable") — сюда сведена бывшая метка .tag из badge.css.
      - Нужна плотная семантическая метка состояния внутри карточки или строки списка.
    avoid_when:
      - Вариантов десятки — ряд чипов переполнит строку, нужен список с поиском.
      - Значение одно и взаимоисключающее — набор чипов не передаёт «только одно».
      - Метка чисто числовая и накладывается на иконку.
    instead_use:
      - case: множественный выбор из длинного списка с поиском
        component: picklist
      - case: одно значение из длинного списка
        component: combobox
      - case: снятие условий уже применённой выборки над списком
        component: filter-pills
      - case: счётчик на иконке
        component: badge
      - case: выбор цвета из палитры
        component: swatch-picker
    anatomy:
      block: .chip
      elements: [chip-icon, chip-label, chip-remove, chips, "chip-group"]
      modifiers: ["chip-sm", "chip-lg", "chip-filled", "chip-outlined", "chip-soft", "chip-primary", "chip-success", "chip-warning", "chip-error", "chip-info", "chip-neutral", "chip-choice", "chip-clickable", "chip-removable", "chip-group-sm", "chip-group-lg", "chip-group-connected"]
      states: ["is-active", "is-removing", "chip-selected", "chip-disabled"]
    behavior_contract:
      keyboard:
        - "\"chip-choice\" и \"chip-clickable\" обязаны быть button: Tab, Enter/Space, видимое кольцо фокуса."
        - Кнопка удаления — отдельная точка табуляции внутри чипа.
      aria:
        - Переключаемый чип несёт aria-pressed, синхронный с классом is-active.
        - Кнопке удаления нужен aria-label с названием снимаемого значения.
        - Семантический цвет не единственный носитель смысла — текст чипа обязан его называть.
      js_required:
        - Переключать "is-active" и aria-pressed на "chip-choice".
        - Для удаления — навесить "is-removing" и удалить узел по transitionend; обязателен запасной таймер, иначе при выключенной анимации узел останется.
