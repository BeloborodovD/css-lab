<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAL Classic — справочник цветов и кодов · CSS Lab</title>
  <link rel="stylesheet" href="/styles/index-v3.css">
  <style>
    /* [BLOCK:page.ral-colors] Страница-справочник RAL: локальная раскладка */
    .ral-page {
      max-width: var(--max-content-w);
      margin: 0 auto;
      padding: var(--space-6) var(--space-4) var(--space-16);
    }
    .ral-page__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      flex-wrap: wrap;
      margin-bottom: var(--space-4);
    }
    .ral-page__title { margin: 0; }
    .ral-page__sub {
      margin: var(--space-1) 0 0;
      color: var(--color-text-muted);
      font-size: var(--fs-sm);
    }
    .ral-page__tools {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
    }
    .ral-page__search { min-width: 280px; }
    .ral-page__count {
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      white-space: nowrap;
    }
    .ral-family {
      margin: var(--space-6) 0 var(--space-3);
      padding-bottom: var(--space-1);
      border-bottom: var(--border-w) solid var(--color-border);
    }
    .ral-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: var(--space-3);
    }
    /* Карточка цвета: образец + код + название + HEX. Клик копирует код */
    .ral-card {
      display: flex;
      flex-direction: column;
      background: var(--color-surface);
      border: var(--border-w) solid var(--color-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      cursor: pointer;
      text-align: left;
      padding: 0;
      font: inherit;
      transition: box-shadow var(--duration-press) var(--ease-out),
                  border-color var(--duration-press) var(--ease-out);
    }
    @media (hover: hover) and (pointer: fine) {
      .ral-card:hover {
        border-color: var(--color-border-strong);
        box-shadow: var(--shadow);
      }
    }
    .ral-card:focus-visible { outline: none; box-shadow: var(--shadow-focus); }
    .ral-card__swatch {
      height: 72px;
      box-shadow: inset 0 0 0 1px var(--color-swatch-inset);
    }
    .ral-card__info {
      display: flex;
      flex-direction: column;
      gap: var(--space-px);
      padding: var(--space-2) var(--space-3);
    }
    .ral-card__code { font-weight: var(--fw-semi); font-size: var(--fs-sm); color: var(--color-text); }
    .ral-card__name {
      font-size: var(--fs-xs);
      color: var(--color-text-secondary);
      min-height: 2.4em;
    }
    .ral-card__hex {
      font-family: var(--font-mono);
      font-size: var(--fs-xs);
      color: var(--color-text-muted);
    }
    .ral-card.is-copied { border-color: var(--color-success); }
    .ral-page__empty { display: none; }
    .ral-page.is-empty .ral-page__empty { display: block; }
    /* Печать справочника: сетка компактнее, цвета принудительно */
    @media print {
      body { background: #fff; }
      .ral-page__tools, .v-toolbar { display: none !important; }
      .ral-grid { grid-template-columns: repeat(6, 1fr); gap: 3mm; }
      .ral-card { break-inside: avoid; border: 0.4pt solid #ccc; }
      .ral-card__swatch { height: 14mm; print-color-adjust: exact; }
      .ral-family { break-after: avoid; }
    }
    /* </BLOCK:page.ral-colors> */
  </style>
</head>
<body>
  <main class="ral-page" id="ral-page">
    <div class="ral-page__head">
      <div>
        <h1 class="ral-page__title">RAL Classic — цвета и коды</h1>
        <p class="ral-page__sub">216 цветов с русскими названиями и HEX-приближением для экрана. Клик по карточке копирует код. Источник данных — опросный лист R&amp;D Уралэлектро (RAL.xlsx).</p>
      </div>
      <div class="ral-page__tools">
        <input type="search" class="input ral-page__search" id="ral-search"
               placeholder="Поиск: код или название (напр. 5008, синий)" aria-label="Поиск цвета RAL">
        <span class="ral-page__count" id="ral-count" role="status"></span>
        <a class="btn btn-secondary" href="/index-v3.html">← Витрина</a>
        <button type="button" class="btn btn-primary" onclick="window.print()">Печать</button>
      </div>
    </div>
    <div id="ral-list"></div>
    <div class="empty-state ral-page__empty">
      <div class="empty-state-title">Ничего не найдено</div>
      <div class="empty-state-message">Попробуйте другой код или название</div>

  </main>

    // [BLOCK:ral-render] Рендер справочника: семейства → карточки, поиск, копирование кода
    const pairs = RAL_DATA.split(',').map(x => { const [c, h] = x.split(':'); return { code: c, num: c.slice(3), hex: '#' + h }; })
      .sort((a, b) => a.num.localeCompare(b.num));
    const list = document.getElementById('ral-list');
    const bySection = {};
    pairs.forEach(p => { (bySection[p.num[0]] = bySection[p.num[0]] || []).push(p); });

    Object.keys(bySection).sort().forEach(fam => {
      const h = document.createElement('h2');
      h.className = 'ral-family';
      h.textContent = FAMILIES[fam] || fam;
      h.dataset.fam = fam;
      list.appendChild(h);
      const grid = document.createElement('div');
      grid.className = 'ral-grid';
      grid.dataset.fam = fam;
      bySection[fam].forEach(p => {
        const name = RAL_NAMES[p.num] || '';
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'ral-card';
        card.dataset.search = (p.code + ' ' + p.num + ' ' + name + ' ' + p.hex).toLowerCase();
        card.setAttribute('aria-label', p.code + (name ? ', ' + name : '') + ' — копировать код');
        const sw = document.createElement('span');
        sw.className = 'ral-card__swatch';
        sw.style.background = p.hex;
        const info = document.createElement('span');
        info.className = 'ral-card__info';
        const code = document.createElement('span'); code.className = 'ral-card__code'; code.textContent = 'RAL ' + p.num;
        const nm = document.createElement('span'); nm.className = 'ral-card__name'; nm.textContent = name;
        const hx = document.createElement('span'); hx.className = 'ral-card__hex'; hx.textContent = p.hex;
        info.append(code, nm, hx);
        card.append(sw, info);
        card.addEventListener('click', async () => {
          try { await navigator.clipboard.writeText('RAL ' + p.num); } catch (e) { /* печать/файл без clipboard — не критично */ }

          code.textContent = 'Скопировано ✓';
          setTimeout(() => { card.classList.remove('is-copied'); code.textContent = 'RAL ' + p.num; }, 1200);
        });
        grid.appendChild(card);
      });
      list.appendChild(grid);
    });

    // Поиск: фильтр карточек + скрытие пустых семейств + счётчик
    const search = document.getElementById('ral-search');
    const count = document.getElementById('ral-count');
    const page = document.getElementById('ral-page');
    function applyFilter() {
      const q = search.value.trim().toLowerCase();
      let visible = 0;
      document.querySelectorAll('.ral-grid').forEach(grid => {
        let famVisible = 0;
        grid.querySelectorAll('.ral-card').forEach(card => {
          const hit = !q || card.dataset.search.includes(q);
          card.style.display = hit ? '' : 'none';
          if (hit) { visible++; famVisible++; }
        });
        grid.style.display = famVisible ? '' : 'none';
        const h = grid.previousElementSibling;
        if (h && h.classList.contains('ral-family')) h.style.display = famVisible ? '' : 'none';
      });
      count.textContent = visible + ' из ' + pairs.length;
      page.classList.toggle('is-empty', visible === 0);
    }
    search.addEventListener('input', applyFilter);
    applyFilter();
    // </BLOCK:ral-render>
  </script>
</body>
</html>
