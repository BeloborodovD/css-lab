# Конфиг SonarQube для css-lab (статичный сайт: HTML/CSS/vanilla JS).
# Ключ уникален на инстанс devstack.

sonar.projectKey=css-lab
sonar.projectName=CSS Lab — дизайн-система
sonar.projectVersion=3.0
sonar.sourceEncoding=UTF-8

# --- Что анализируем -------------------------------------------------------
# Продуктовый код: стили, скрипты, разметка страниц.
sonar.sources=styles,js,pages,main.js,components.html,index.html,index-v3.html,print-forms.html,ral-colors.html,assets/ral-data.js
sonar.tests=e2e

sonar.exclusions=\
  **/node_modules/**,\
  assets/fonts/**,\
  assets/logos/**,\
  .playwright-mcp/**,\
  test-results/**,\
  playwright-report/**,\
  **/*.min.js

# Покрытие для e2e-смоука статики не собирается осознанно:
# юнит-логики нет, тесты гейтуют работоспособность страниц в CI.
sonar.coverage.exclusions=**/*

sonar.cpd.exclusions=e2e/**,pages/*.html

# --- Сканеры безопасности (SARIF, см. workflow) ----------------------------
sonar.sarifReportPaths=trivy.sarif,gitleaks.sarif,semgrep.sarif
